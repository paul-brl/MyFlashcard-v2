        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']]

const supa = {
  // Load metadata only — NO front/back. Fast even for 100k cards.
  // First page tells us the total count (Prefer: count=exact), then every
  // remaining page is fetched in parallel instead of one-by-one.
  getCardsMeta: async () => {
    const BATCH = 1000; // metadata rows are tiny (~100 bytes each)
    const base = `${SUPA_URL}/rest/v1/cards?select=id,group_id,num,chapter_id,packet_id,sort_order,card_type`;
    try {
      const first = await fetch(`${base}&limit=${BATCH}&offset=0`, {
        headers: {
          ...H,
          "Prefer": "count=exact"
        }
      });
      const firstData = await first.json();
      if (!first.ok || !Array.isArray(firstData)) return null;
      let total = firstData.length;
      const range = first.headers.get("content-range"); // "0-999/3456"
      if (range && range.includes("/")) {
        const t = parseInt(range.split("/")[1], 10);
        if (!isNaN(t)) total = t;
      }
      let allRows = firstData;
      if (total > firstData.length) {
        const offsets = [];
        for (let off = BATCH; off < total; off += BATCH) offsets.push(off);
        const pages = await Promise.all(offsets.map(off => fetch(`${base}&limit=${BATCH}&offset=${off}`, {
          headers: H
        }).then(r => r.json()).catch(() => [])));
        pages.forEach(rows => {
          if (Array.isArray(rows)) allRows = allRows.concat(rows);
        });
      }
      return allRows.map(c => ({
        id: c.id,
        groupId: c.group_id,
        num: c.num,
        chapterId: c.chapter_id || 1,
        packetId: c.packet_id,
        sort_order: c.sort_order ?? null,
        card_type: c.card_type || 'text',

        back: null

      const chunks = [];

        const idList = chunk.map(id => `"${id}"`).join(',');
        const r = await fetch(`${SUPA_URL}/rest/v1/cards?select=id,front,back&id=in.(${idList})`, {
          headers: H
        });
        const d = await r.json();
        if (r.ok && Array.isArray(d)) d.forEach(c => {
          result[c.id] = {
            front: c.front,
            back: c.back
          };
        });

  getProgress: async username => {

    const base = `${SUPA_URL}/rest/v1/progress?username=eq.${encodeURIComponent(username)}&select=card_id,data`;
    try {

        headers: {

        }

      const firstRows = await first.json();
      if (!Array.isArray(firstRows)) throw new Error("Unexpected response");
      let total = firstRows.length;

const dateKey = (d = new Date()) => d.toISOString().slice(0, 10);

const recordStat = (username, correct, elapsedMs, isNewCard = false) => {
  if (!username) return;
  const st = getStats(username);
  const key = dateKey();
  const secs = Math.min(Math.round(elapsedMs / 1000), 120);
  if (!st.days[key]) st.days[key] = {
    cards: 0,
    correct: 0,
    seconds: 0,
    newShown: 0
  };
  st.days[key].cards++;
  if (correct) st.days[key].correct++;
  st.days[key].seconds += secs;
  if (isNewCard) st.days[key].newShown = (st.days[key].newShown || 0) + 1;
  st.total.cards++;
  if (correct) st.total.correct++;
  st.total.seconds += secs;
  saveStats(username, st);
};
const computeStreak = days => {
  let streak = 0;
  const today = dateKey();
  const yesterday = dateKey(new Date(Date.now() - 86400000));
  let cur = new Date(days[today]?.cards > 0 ? today : yesterday);
  if (!days[dateKey(cur)]?.cards) return 0;
  while (true) {
    const k = dateKey(cur);
    if (!days[k]?.cards) break;
    streak++;
    cur = new Date(cur.getTime() - 86400000);
  }
  return streak;
};
const formatSeconds = s => {
  if (s < 60) return `${s}s`;
  const h = Math.floor(s / 3600),
    m = Math.round(s % 3600 / 60);
  if (h === 0) return `${m} min`;
  return `${h}h ${m}min`;
};
const formatNextDue = date => {
  const diff = date - Date.now();
  if (diff <= 0) return "maintenant";
  const m = Math.round(diff / 60000);
  if (m < 2) return "dans moins d'une minute";
  if (m < 60) return `dans ${m} min`;
  const h = Math.round(m / 60);
  if (h < 24) return `dans ${h}h`;
  const d = Math.round(h / 24);
  return `dans ${d} jour${d > 1 ? "s" : ""}`;
};
const getEmptyQueueMsg = (filtered, prog, settings, newShownToday) => {
  const {
    newCardsPerDay = 20
  } = settings;
  const dueCards = filtered.filter(c => !prog[c.id]?.buried && isDue(prog[c.id]));
  if (dueCards.length === 0) {
    const dates = filtered.filter(c => !prog[c.id]?.buried && prog[c.id]?.next).map(c => new Date(prog[c.id].next)).sort((a, b) => a - b);
    if (dates.length) {
      return `✨ Toutes tes cartes sont à jour !\nProchaine révision ${formatNextDue(dates[0])}.`;
    }
    return "✨ Aucune carte dans cette sélection pour l'instant.";
  }
  const newDue = dueCards.filter(c => isNew(prog[c.id]));
  const reviewDue = dueCards.filter(c => !isNew(prog[c.id]));
  if (reviewDue.length === 0 && newDue.length > 0 && newShownToday >= (newCardsPerDay || 20)) {
    return `🎯 Plafond de nouvelles cartes atteint !\nTu as déjà découvert ${newShownToday} nouvelle${newShownToday > 1 ? "s" : ""} carte${newShownToday > 1 ? "s" : ""} aujourd'hui (plafond : ${newCardsPerDay || 20}).\n💡 Reviens demain ou augmente le plafond dans les Paramètres.`;
  }
  if (dueCards.length > 0) {
    return `📋 ${dueCards.length} carte${dueCards.length > 1 ? "s" : ""} disponible${dueCards.length > 1 ? "s" : ""} mais exclue${dueCards.length > 1 ? "s" : ""} par tes filtres de matières ou de paquets.\nModifie les filtres dans les Paramètres.`;
  }
  return "✨ Aucune carte à réviser pour le moment.";
};

const sortCardsGlobally = cards => [...cards].sort((a, b) => {
  const gi = GROUPS.findIndex(g => g.id === a.groupId) - GROUPS.findIndex(g => g.id === b.groupId);
  if (gi) return gi;
  if (a.num !== b.num) return a.num - b.num;
  if (a.chapterId !== b.chapterId) return a.chapterId - b.chapterId;
