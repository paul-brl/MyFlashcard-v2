          <li><strong>La phase d'apprentissage ne rapporte rien.</strong> Cliquer en boucle sur « À revoir » ou « Difficile » pendant l'apprentissage laisse l'intervalle sous la journée : 0 point.</li>
          <li><strong>Le farming de cartes faciles est peu rentable.</strong> Une carte ancienne, déjà consolidée, ne vaut qu'1 point : l'effort utile (nouvelles cartes, cartes difficiles, cartes prioritaires) est mieux payé.</li>
          <li><strong>Remise à zéro quotidienne.</strong> Le classement porte uniquement sur la journée en cours : c'est la régularité qui compte, pas le cumul.</li>
        </ul>
        <p style={{fontSize:12,color:C.textLt,margin:0}}>L'algorithme de répétition espacée (boutons et intervalles) reste strictement inchangé : le système de points ne fait que l'observer.</p>
      </div>}
    </div>
  );
}
// ─── Forum ────────────────────────────────────────────────────────────────────
// Commun à tous les utilisateurs de MyFlashCard (étudiants ET administrateurs).
// Pseudo des administrateurs en rouge, pseudo des étudiants en bleu. Nécessite
// la table optionnelle "forum_posts" — voir supabase_forum_posts.sql. Sans elle,
// l'onglet affiche un message explicatif au lieu de planter.
function ForumTab({currentUser,pseudo}){
  const isAdmin=currentUser.role==="admin";
  const [posts,setPosts]=useState(undefined); // undefined = chargement · null = table indisponible
  const [body,setBody]=useState("");
  const [replyTo,setReplyTo]=useState(null);
  const [replyBody,setReplyBody]=useState("");
  const [posting,setPosting]=useState(false);
  const [err,setErr]=useState("");
  // Suppression de ses propres messages : id du message en attente de confirmation.
  const [confirmDel,setConfirmDel]=useState(null);
  const [deleting,setDeleting]=useState(false);
  const load=useCallback(async()=>{
    const rows=await supa.getForumPosts();
    setPosts(rows);
  },[]);
  useEffect(()=>{load();},[load]);
  const nameColor=role=>role==="admin"?C.again:C.easy;
  const submit=async(text,parentId)=>{
    const trimmed=(text||"").trim();
    if(!trimmed||posting)return;
    setPosting(true);setErr("");
    try{
      const created=await supa.createForumPost({
        username:currentUser.username,
        display_name:pseudo||defaultPseudo(currentUser.username),
        role:isAdmin?"admin":"student",
        body:trimmed,
        parent_id:parentId||null,
      });
      if(created)setPosts(p=>Array.isArray(p)?[...p,created]:[created]);
      else await load();
      if(parentId){setReplyBody("");setReplyTo(null);} else {setBody("");}
    }catch(e){
      setErr("Impossible d'envoyer le message. Réessaie dans un instant.");
    }finally{setPosting(false);}
  };
  // Un message ne peut être supprimé que par son auteur.
  const canDelete=p=>!!p&&p.username===currentUser.username;
  // Supprime un message. S'il s'agit d'un message principal, ses réponses sont
  // supprimées avec lui : sans cela elles resteraient en base sans parent et
  // disparaîtraient silencieusement de l'affichage.
  const handleDelete=async id=>{
    if(deleting)return;
    const target=Array.isArray(posts)?posts.find(p=>p.id===id):null;
    if(!target||!canDelete(target))return;
    const replyIds=Array.isArray(posts)&&!target.parent_id
      ? posts.filter(p=>p.parent_id===id).map(p=>p.id)
      : [];
    const toRemove=new Set([id,...replyIds]);
    setDeleting(true);setErr("");
    try{
      await Promise.all([...toRemove].map(x=>supa.deleteForumPost(x)));
      setPosts(p=>Array.isArray(p)?p.filter(x=>!toRemove.has(x.id)):p);
      setConfirmDel(null);
      if(replyTo===id)setReplyTo(null);
    }catch(e){
      setErr("Impossible de supprimer le message. Réessaie dans un instant.");
    }finally{setDeleting(false);}
  };
  const fmtDate=iso=>{
    try{
      const d=new Date(iso);
      const now=Date.now();
      const diffH=(now-d.getTime())/3600000;
      if(diffH<24)return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    }catch{return"";}
  };
  const topLevel=useMemo(()=>Array.isArray(posts)?posts.filter(p=>!p.parent_id):[],[posts]);
  const repliesOf=useMemo(()=>{
    const m={};
    if(Array.isArray(posts))posts.filter(p=>p.parent_id).forEach(p=>{(m[p.parent_id]=m[p.parent_id]||[]).push(p);});
    return m;
  },[posts]);
  const renderPost=(p,isReply)=><div style={{padding:isReply?"10px 0 0 28px":"14px 0",borderTop:isReply?"none":`1px solid ${C.border}`}}>
    <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap",marginBottom:4}}>
      <strong style={{fontSize:13,color:nameColor(p.role)}}>{p.display_name||defaultPseudo(p.username)}</strong>
      {p.role==="admin"&&<Tag color={C.again} bg={C.againBg} small>Admin</Tag>}
      <span style={{fontSize:11,color:C.textLt}}>{fmtDate(p.created_at)}</span>
    </div>
    <p style={{fontSize:13.5,color:C.text,margin:"0 0 6px",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{p.body}</p>
    <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
      {!isReply&&<button onClick={()=>{setReplyTo(replyTo===p.id?null:p.id);setReplyBody("");}} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,textDecoration:"underline",padding:0}}>{replyTo===p.id?"Annuler":"↩ Répondre"}</button>}
      {canDelete(p)&&confirmDel!==p.id&&<button onClick={()=>setConfirmDel(p.id)} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,textDecoration:"underline",padding:0}}>🗑 Supprimer</button>}
      {canDelete(p)&&confirmDel===p.id&&<span style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:C.again}}>{!isReply&&(repliesOf[p.id]||[]).length>0?`Supprimer ce message et ses ${(repliesOf[p.id]||[]).length} réponse${(repliesOf[p.id]||[]).length>1?"s":""} ?`:"Supprimer définitivement ce message ?"}</span>
        <button onClick={()=>handleDelete(p.id)} disabled={deleting} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"4px 10px",cursor:deleting?"wait":"pointer",borderRadius:5,border:`1.5px solid ${C.again}`,background:C.againBg,color:C.again}}>{deleting?"Suppression…":"Confirmer"}</button>
        <button onClick={()=>setConfirmDel(null)} disabled={deleting} style={{fontFamily:font,fontSize:11,padding:"4px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${C.border}`,background:"transparent",color:C.textMed}}>Annuler</button>
      </span>}
    </div>
    {!isReply&&replyTo===p.id&&<div style={{marginTop:8,display:"flex",gap:8}}>
      <input style={{...iLine,flex:1}} placeholder={isAdmin?"Ta réponse (pseudo en rouge)…":"Ta réponse…"} value={replyBody} onChange={e=>setReplyBody(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit(replyBody,p.id)} autoFocus/>
      <Btn small fill onClick={()=>submit(replyBody,p.id)} disabled={!replyBody.trim()||posting}>Envoyer</Btn>
    </div>}
    {!isReply&&(repliesOf[p.id]||[]).map(r=><React.Fragment key={r.id}>{renderPost(r,true)}</React.Fragment>)}
  </div>;
  return <div style={{animation:"fadeIn 0.18s ease"}}>
    <p style={{fontFamily:serif,fontSize:18,margin:"0 0 4px"}}>Forum</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 20px"}}>Espace d'échange commun à tous les utilisateurs de MyFlashCard.</p>
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px",marginBottom:20}}>
      <p style={{fontSize:12,color:C.textLt,margin:"0 0 8px"}}>Tu postes sous le pseudo : <strong style={{color:nameColor(isAdmin?"admin":"student")}}>{pseudo||defaultPseudo(currentUser.username)}</strong> {isAdmin&&<span style={{color:C.textLt}}>(modifiable dans Réglages → Profil)</span>}</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <textarea style={{...iBox,flex:"1 1 260px",minHeight:60}} placeholder="Pose ta question ou partage quelque chose avec la communauté…" value={body} onChange={e=>setBody(e.target.value)} rows={2}/>
        <Btn fill onClick={()=>submit(body,null)} disabled={!body.trim()||posting} style={{alignSelf:"flex-end"}}>{posting?"Envoi…":"Publier"}</Btn>
      </div>
      {err&&<p style={{fontSize:12,color:C.again,margin:"8px 0 0"}}>{err}</p>}
    </div>
    {posts===undefined?(
      <p style={{fontSize:13,color:C.textLt,padding:"24px 0",textAlign:"center"}}>Chargement du forum…</p>
    ):posts===null?(
      <div style={{border:`1.5px dashed ${C.border}`,borderRadius:10,padding:"22px",background:C.surface}}>
        <p style={{fontSize:13,color:C.textMed,margin:"0 0 10px",lineHeight:1.6}}>⚠️ Le forum n'est pas encore disponible : la table <code style={{fontFamily:mono,fontSize:11,background:"var(--c-chipBg)",padding:"1px 5px",borderRadius:4}}>forum_posts</code> n'existe pas encore dans Supabase.</p>
        <p style={{fontSize:11,color:C.textLt,margin:0,lineHeight:1.6}}>À créer une fois dans l'éditeur SQL Supabase — voir le fichier <code style={{fontFamily:mono,fontSize:10}}>supabase_forum_posts.sql</code>.</p>
      </div>
    ):topLevel.length===0?(
      <p style={{fontSize:13,color:C.textLt,padding:"24px 0",textAlign:"center"}}>Aucun message pour l'instant — sois le premier à écrire !</p>
    ):(
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"0 18px"}}>
        {[...topLevel].reverse().map(p=><React.Fragment key={p.id}>{renderPost(p,false)}</React.Fragment>)}
      </div>
    )}
  </div>;
}
// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({currentUser,cards,userCards,progress,settings,onStudy,onGlobalStudy,onAdmin,onSettings,onLogout,onNewUserCard,onEditUserCard,onDeleteUserCard,onToggleIntegration,onStudyUser,onStudyPersonal,onUnbury,allCards:allCardsProp,paymentStatus,onClosePaymentBanner,pointsTick,pseudo,theme,onToggleTheme,resumeInfo,onResume,onDismissResume}){
  const isAdmin=currentUser.role==="admin";
  const userGroups=currentUser.plan?.groups||[];
  const fullGroups=currentUser.plan?.fullGroups||[];
  const currentPlan=PLANS.find(p=>p.id===currentUser.plan?.planId);
  const displayName=pseudo||defaultPseudo(currentUser.username);
  const [showUpgrade,setShowUpgrade]=useState(false);
  const todayPts=useMemo(()=>isAdmin?0:todayPoints(currentUser.username).points,[currentUser.username,isAdmin,pointsTick]);
  const gModes=[{id:"prioritaire",label:"Prioritaire",col:C.prio,bg:C.prioBg},{id:"important",label:"Important",col:C.imp,bg:C.impBg},{id:"utile",label:"Utile",col:C.util,bg:C.utilBg},{id:null,label:"Toutes",col:C.accent,bg:C.accentBg}];
  const TABS=[
    {id:"sem1",label:"Semestre 1",sem:1,price:"99 €"},
    {id:"sem2",label:"Semestre 2",sem:2,price:"149 €"},
  ];
  const planId=currentUser.plan?.planId||"prerentree";
  const defaultTab=planId==="sem2"?"sem2":"sem1";
  const [activeTab,setActiveTab]=useState(defaultTab);
  const allCards=useMemo(()=>[...cards,...(userCards||[]).filter(c=>c.integrated)],[cards,userCards]);
  const accessibleCards=useMemo(()=>isAdmin?allCards:allCards.filter(c=>isCourseAccessible(c.groupId,c.num,userGroups,fullGroups)),[allCards,isAdmin,userGroups,fullGroups]);
  const groupsForTab=useCallback(tabId=>{
    const sem=TABS.find(t=>t.id===tabId)?.sem;
    return GROUPS.filter(g=>g.sem===sem);
  },[]);
  const accessibleGroupsForTab=useCallback(tabId=>{
    const gs=groupsForTab(tabId);
    return isAdmin?gs:gs.filter(g=>userGroups.includes(g.id));
  },[groupsForTab,isAdmin,userGroups]);
  const hasTabAccess=useCallback(tab=>{
    if(!tab)return false;
    return accessibleGroupsForTab(tab.id).length>0;
  },[accessibleGroupsForTab]);
  const tabGroups=useMemo(()=>groupsForTab(activeTab),[activeTab,groupsForTab]);
  const visibleIds=isAdmin?ALL:userGroups;
  function GroupBlock({group}){
    const [activeCours,setActiveCours]=useState(null);
    const chapters=activeCours?getDisplayChapters(group.id,activeCours,allCards):[];
    const groupLocked=!isAdmin&&!group.nums.some(n=>isCourseAccessible(group.id,n,userGroups,fullGroups));
    if(groupLocked){
      return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:12,opacity:0.75}}>
        <div style={{padding:"11px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <p style={{fontFamily:serif,fontSize:15,margin:0,color:C.textMed}}>{group.label}</p>
          <button onClick={()=>setShowUpgrade(true)} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 12px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.border}`,background:"transparent",color:C.textLt,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0}}>🔒 Débloquer</button>
        </div>
      </div>;
    }
    function PktBtn({chapterId,pk}){
      const col=pC(pk.id),bg=pB(pk.id);
      const {total,due}=chapterStats(allCards,progress,group.id,activeCours,chapterId,pk.id);
      const hasDue=due>0,upToDate=total>0&&!hasDue;
      return <button onClick={()=>total>0&&onStudy(group.id,activeCours,chapterId,pk.id)} style={{fontFamily:font,fontSize:11,fontWeight:500,padding:"6px 10px",cursor:total>0?"pointer":"default",borderRadius:6,border:`1.5px solid ${hasDue?col:upToDate?C.border:"var(--c-borderSoft)"}`,background:hasDue?bg:C.surface,color:hasDue?col:upToDate?C.textLt:"var(--c-textDisabled)",display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:78,transition:"border-color 0.15s"}} onMouseEnter={e=>{if(total>0)e.currentTarget.style.borderColor=col;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=hasDue?col:upToDate?C.border:"var(--c-borderSoft)";}}><span style={{fontSize:10}}>{pk.label}</span><span style={{fontSize:10,fontWeight:400}}>{total===0?"vide":hasDue?`${due} carte${due>1?"s":""}` :"✓ à jour"}</span></button>;
    }
    return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"11px 18px",borderBottom:`1px solid ${C.border}`,background:C.bg}}><p style={{fontFamily:serif,fontSize:15,margin:0}}>{group.label}</p></div>
      <div style={{display:"flex",gap:8,padding:"10px 18px",flexWrap:"wrap",borderBottom:activeCours?`1px solid ${C.border}`:"none",background:C.surface}}>
        {group.nums.map(n=>{
          const locked=!isAdmin&&!isCourseAccessible(group.id,n,userGroups,fullGroups);
          const active=activeCours===n;
          const due=locked?0:courseDueCount(allCards,progress,group.id,n);
          return <button key={n} onClick={()=>locked?setShowUpgrade(true):setActiveCours(active?null:n)} style={{fontFamily:font,fontSize:12,fontWeight:active?600:400,padding:"8px 16px",cursor:"pointer",borderRadius:7,border:`1.5px solid ${locked?C.border:active?C.accent:due>0?C.good:C.border}`,background:locked?"transparent":active?C.accentBg:due>0?C.goodBg:"transparent",color:locked?C.textLt:active?C.accent:due>0?C.good:C.textMed,display:"flex",alignItems:"center",gap:7,transition:"all 0.15s",opacity:locked?0.7:1}}><span>Cours {n}</span>{locked?<span style={{fontSize:10}}>🔒</span>:<>{due>0&&!active&&<span style={{fontFamily:mono,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:10,background:C.good,color:"var(--c-onSolid)"}}>{due}</span>}<span style={{fontSize:10,opacity:0.6}}>{active?"▲":"▼"}</span></>}</button>;
        })}
      </div>
      {activeCours&&(
        <div style={{animation:"fadeIn 0.18s ease"}}>
          {(()=>{
            const courseDue=courseDueCount(allCards,progress,group.id,activeCours);
            const courseTotal=allCards.filter(c=>c.groupId===group.id&&c.num===activeCours).length;
            if(!courseTotal)return null;
            const upToDate=courseTotal>0&&courseDue===0;
            return(
              <div style={{padding:"10px 18px",borderBottom:`1px solid ${C.border}`,background:courseDue>0?"var(--c-violetTint)":"var(--c-surfaceAlt)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontFamily:mono,fontSize:9,letterSpacing:1,color:"var(--c-violet)",textTransform:"uppercase",fontWeight:600}}>Cours {activeCours} complet</span>
                  <span style={{fontFamily:mono,fontSize:9,color:courseDue>0?"var(--c-violet)":"var(--c-grey1)"}}>{upToDate?"✓ tout à jour":`${courseDue} carte${courseDue>1?"s":""} à réviser`}</span>
                </div>
                {courseDue>0&&<button onClick={()=>onStudy(group.id,activeCours,"__course__","__course__")} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 14px",cursor:"pointer",borderRadius:6,border:"1.5px solid #7c3aed",background:"var(--c-violetBg2)",color:"var(--c-violet)",whiteSpace:"nowrap",flexShrink:0}}>Tout réviser ({courseDue}) →</button>}
              </div>
            );
          })()}
          {chapters.length===0?(()=>{
            const noChTotal=allCards.filter(c=>c.groupId===group.id&&c.num===activeCours).length;
            if(noChTotal===0)return<div style={{padding:"14px 18px"}}><p style={{fontSize:12,color:C.textLt,margin:0}}>Aucune carte pour ce cours.</p></div>;
            const noChDue=PACKETS.reduce((acc,pk)=>acc+chapterStats(allCards,progress,group.id,activeCours,1,pk.id).due,0);
            const userNoChCards=(userCards||[]).filter(c=>c.groupId===group.id&&c.num===activeCours&&c.chapterId===1).length;
            return<div style={{display:"flex",alignItems:"center",padding:"9px 18px",gap:12,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:180}}>
                <span style={{fontFamily:font,fontSize:13,color:noChDue>0?C.text:C.textMed,fontWeight:noChDue>0?500:400}}>Toutes les cartes</span>
                {noChDue>0&&<span style={{fontFamily:mono,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:10,background:C.accent,color:"var(--c-onSolid)"}}>{noChDue}</span>}
                {userNoChCards>0&&<span style={{fontFamily:mono,fontSize:8,padding:"1px 5px",borderRadius:10,background:"var(--c-chipBg)",color:C.textMed}}>+{userNoChCards} perso</span>}
              </div>
              <div style={{display:"flex",gap:5,flexShrink:0,flexWrap:"wrap"}}>
                {PACKETS.map(pk=><PktBtn key={pk.id} chapterId={1} pk={pk}/>)}
                {noChDue>0&&<button onClick={()=>onStudy(group.id,activeCours,1,"__all__")} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 10px",cursor:"pointer",borderRadius:6,border:"1.5px solid #7c3aed",background:"var(--c-violetBg2)",color:"var(--c-violet)",display:"flex",flexDirection:"column",alignItems:"center",gap:2,minWidth:64}}><span style={{fontSize:10}}>Tout</span><span style={{fontSize:10,fontWeight:400}}>{noChDue} carte{noChDue>1?"s":""}</span></button>}
              </div>
            </div>;
          })():(
            chapters.map((chName,i)=>{
              const chIdx=i+1;

function PriorityBadges(){

}

  if(view==="dashboard"&&currentUser) return <Dashboard currentUser={currentUser} cards={cards} userCards={userCards} progress={prog} settings={settings} onStudy={startStudy} onGlobalStudy={startGlobalStudy} onAdmin={()=>setView("admin")} onSettings={()=>setView("settings")} onLogout={logout} onNewUserCard={()=>setUserCardEditor(false)} onEditUserCard={c=>setUserCardEditor(c)} onDeleteUserCard={handleDeleteUserCard} onToggleIntegration={handleToggleIntegration} onStudyUser={startUserCardStudy} onStudyPersonal={startPersonalCourseStudy} onUnbury={handleUnbury} allCards={allCards} paymentStatus={paymentStatus} onClosePaymentBanner={()=>setPaymentStatus(null)} pointsTick={pointsTick} pseudo={pseudo||getPseudo(currentUser.username)} theme={theme} onToggleTheme={toggleTheme} resumeInfo={resumeInfo} onResume={resumeStudySession} onDismissResume={dismissResume}/>;
  if(view==="study"&&studyCtx) return <StudyView label={studyCtx.label} queue={studyCtx.queue} onRate={handleRate} onBury={handleBury} onChangePacket={handleChangePacket} onBack={leaveStudy} settings={settings} isAdmin={currentUser?.role==="admin"} progress={prog} theme={theme} onToggleTheme={toggleTheme} onUndo={handleUndoRate} onQueueChange={persistStudyQueue}/>;
  if(view==="admin")     return <AdminView cards={cards} accounts={accounts} onSaveCard={handleSaveCard} onDeleteCard={handleDeleteCard} onSaveUser={handleSaveUser} onDeleteUser={handleDeleteUser} onSortCards={handleBatchSortCards} onBack={()=>setView("dashboard")} theme={theme} onToggleTheme={toggleTheme}/>;
  if(view==="settings")  return <SettingsView settings={settings} onSave={saveSet} onBack={()=>setView("dashboard")} currentUser={currentUser} accounts={accounts} cards={cards} onResetProgress={handleResetProgress} onDeleteAccount={handleDeleteAccount} pseudo={pseudo||getPseudo(currentUser?.username)} onSavePseudo={savePseudo} theme={theme} onToggleTheme={toggleTheme}/>;
  return null;
  };
  return <>
    {renderView()}
    {updateReady&&!updateDismissed&&<UpdateBanner
      pending={pendingSaves}
      onDismiss={()=>setUpdateDismissed(true)}
      onReload={()=>{ if(pendingSavesRef.current>0)return; window.location.reload(); }}
    />}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
