    </div>
  </div>;
}

// ─── La courbe de rétention d'une carte donnée ───────────────────────────────
// Trace R(t) = (1 + t/9S)^-1 : la probabilité de retrouver la carte t jours
// après le dernier rappel. Le point à 90 % est l'échéance que l'algorithme vise.
function RetentionCurve({S=5,target=0.9}){
  const W=520,H=190,L=46,R0=16,T=14,B=34;
  const maxT=Math.max(2,Math.round(9*S*((1/0.5)-1))); // on trace jusqu'à ~50% de rétention
  const x=t=>L+(t/maxT)*(W-L-R0);
  const y=r=>T+(1-r)*(H-T-B);
  const pts=[];
  for(let i=0;i<=60;i++){ const t=maxT*i/60; pts.push(`${x(t).toFixed(1)},${y(fsrsR(t,S)).toFixed(1)}`); }
  const due=9*S*((1/target)-1);
  const ticks=[0,0.25,0.5,0.75,1].map(f=>Math.round(maxT*f));
  return <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Probabilité de se souvenir de la carte en fonction du nombre de jours écoulés" style={{width:"100%",height:"auto",display:"block",margin:"6px 0 0"}}>
    {[0.5,0.9,1].map(r=><line key={r} x1={L} y1={y(r)} x2={W-R0} y2={y(r)} stroke={C.border} strokeWidth="1" strokeDasharray="3 3"/>)}
    <text x="6" y={y(1)+4} fontSize="11" fill={C.textMed}>100%</text>
    <text x="6" y={y(target)+4} fontSize="11" fontWeight="700" fill={C.accent}>{Math.round(target*100)}%</text>
    <text x="6" y={y(0.5)+4} fontSize="11" fill={C.textMed}>50%</text>
    <line x1={L} y1={T} x2={L} y2={H-B} stroke={C.text} strokeWidth="1.4"/>
    <line x1={L} y1={H-B} x2={W-R0} y2={H-B} stroke={C.text} strokeWidth="1.4"/>
    <polyline points={pts.join(" ")} fill="none" stroke={C.accent} strokeWidth="2.6"/>
    <line x1={x(due)} y1={T} x2={x(due)} y2={H-B} stroke="var(--c-violet)" strokeWidth="1.6" strokeDasharray="5 3"/>
    <circle cx={x(due)} cy={y(target)} r="4.5" fill="var(--c-violet)"/>
    <text x={Math.min(x(due)+8,W-130)} y={T+30} fontSize="11.5" fontWeight="700" fill="var(--c-violet)">échéance · {fmtDays(due)}</text>
    {ticks.map((t,i)=><text key={i} x={x(t)-8} y={H-B+16} fontSize="11" fill={C.textMed}>{t} j</text>)}
    <text x={(W)/2-40} y={H-6} fontSize="11" fill={C.textLt}>jours depuis le dernier rappel</text>
  </svg>;
}
const fmtDays=d=>{
  if(d<1)return`${Math.round(d*24)} h`;
  if(d<30)return`${d.toFixed(d<10?1:0)} j`;
  if(d<365)return`${Math.round(d/30)} mois`;
  return`${(d/365).toFixed(1)} an${d>=730?"s":""}`;
};

// ─── Fiche : méthode Anki (FSRS) ─────────────────────────────────────────────
function AnkiMethodModal({onClose,settings}){
  const [S,setS]=useState(5),[D,setD]=useState(5);
  const R=fsrsR(9*S*((1/0.9)-1),S); // rétention au moment prévu de la révision
  // Carte fictive « mûre et due » : c'est exactement l'objet que l'algorithme
  // reçoit en vrai, on peut donc lui demander les quatre délais qu'il proposerait.
  const iv=fsrsIntervalDays(S);
  const fake={state:"review",step:0,stability:S,difficulty:D,reps:5,lapses:0,interval:iv,
    lastReview:new Date(Date.now()-iv*86400000).toISOString(),next:new Date().toISOString(),reviewHistory:[]};
  return <Modal onClose={onClose} width={620}>
    <p style={{fontFamily:mono,fontSize:9,letterSpacing:2.5,textTransform:"uppercase",color:C.accent,margin:"0 0 6px"}}>Méthode Anki</p>
    <p style={{fontFamily:serif,fontSize:23,margin:"0 0 6px"}}>Comment tes cartes sont reprogrammées</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 20px",lineHeight:1.7}}>Aucun intervalle n'est fixé à l'avance. À chaque fois que tu notes une carte, l'algorithme <strong>FSRS</strong> remet à jour son modèle de ta mémoire, puis en déduit la date du prochain rappel. Deux cartes notées « Bien » le même jour peuvent très bien revenir l'une dans 3 jours et l'autre dans 3 semaines.</p>

    <p style={{fontFamily:serif,fontSize:17,margin:"0 0 4px"}}>Les quatre variables de l'équation</p>
    <div style={{marginBottom:18}}>
      <VarRow sym="S" name="Stabilité — en jours">Le cœur du modèle : le nombre de jours au bout desquels il te reste <strong>90 % de chances</strong> de retrouver la carte. Une carte fraîchement apprise a S ≈ 1 ; une carte bien ancrée peut monter à S = 200.</VarRow>
      <VarRow sym="D" name="Difficulté — de 1 à 10">À quel point cette carte-là te résiste, indépendamment du temps. Elle monte quand tu cliques « À revoir », descend quand tu cliques « Facile ». Une carte difficile gagne moins de stabilité à chaque réussite.</VarRow>
      <VarRow sym="t" name="Temps écoulé — en jours">Le nombre de jours réellement passés depuis le dernier rappel. C'est lui qui fait qu'une carte revue en avance rapporte moins qu'une carte revue à sa date.</VarRow>
      <VarRow sym="g" name="Ta note — de 1 à 4">À revoir (1) · Difficile (2) · Bien (3) · Facile (4). C'est la seule chose que tu fournis ; tout le reste en découle.</VarRow>
    </div>

    <p style={{fontFamily:serif,fontSize:17,margin:"0 0 4px"}}>1. La probabilité de te souvenir</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 4px",lineHeight:1.7}}>C'est l'équation centrale, celle qui donne son nom à la « probabilité de rétention » :</p>
    <Eq note="R vaut 1 juste après le rappel, puis décroît. La courbe n'est pas exponentielle mais en puissance : l'oubli est brutal les premiers jours, puis très lent — c'est exactement ce que montre la courbe de l'oubli.">R(t, S) = ( 1 + t / (9 × S) )⁻¹</Eq>

    <p style={{fontFamily:serif,fontSize:17,margin:"14px 0 4px"}}>2. La date du prochain rappel</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 4px",lineHeight:1.7}}>On cherche le moment où cette probabilité tombe à <strong>90 %</strong> : assez tard pour que le rappel te fasse travailler, assez tôt pour que tu ne l'aies pas encore perdue. En résolvant l'équation ci-dessus pour R = 0,90 :</p>
    <Eq note="Avec la cible à 90 %, cela revient exactement à « intervalle = S ». Baisser la cible allongerait les intervalles au prix de plus d'oublis.">intervalle = 9 × S × ( 1 / 0,90 − 1 )</Eq>

    <p style={{fontFamily:serif,fontSize:17,margin:"14px 0 4px"}}>3. Comment S bouge après ta note</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 4px",lineHeight:1.7}}>Si tu <strong>retrouves</strong> la carte, la stabilité augmente — et d'autant plus que tu étais près de l'oublier (R faible) et que la carte est facile (D faible) :</p>
    <Eq>S′ = S × ( 1 + e^w₈ × (11 − D) × S^−w₉ × ( e^((1−R)×w₁₀) − 1 ) )</Eq>
    <p style={{fontSize:13,color:C.textMed,margin:"6px 0 4px",lineHeight:1.7}}>Si tu l'as <strong>oubliée</strong>, la stabilité retombe — jamais à zéro, car une carte déjà vue se réapprend plus vite qu'une carte neuve :</p>
    <Eq note="Les wᵢ sont les 19 poids de FSRS-4.5, mesurés sur des centaines de millions de révisions réelles (projet open-source open-spaced-repetition). Ils sont dans le code du site, ligne FSRS_W.">S′ = w₁₁ × D^−w₁₂ × ( (S + 1)^w₁₃ − 1 ) × e^( w₁₄ × (1 − R) )</Eq>

    <div style={{background:C.accentBg,border:`1px solid ${C.accent}`,borderRadius:10,padding:"16px 18px",marginTop:20}}>
      <p style={{fontFamily:serif,fontSize:17,margin:"0 0 4px",color:C.accent}}>Essaie toi-même</p>
      <p style={{fontSize:12,color:C.textMed,margin:"0 0 14px",lineHeight:1.6}}>Déplace les curseurs : voilà les quatre délais que l'algorithme proposerait sur une carte ayant cette stabilité et cette difficulté.</p>
      <div style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
          <span style={{fontSize:12,color:C.text}}>Stabilité <strong>S</strong></span>
          <span style={{fontFamily:mono,fontSize:12,color:C.accent,fontWeight:700}}>{S.toFixed(1)} j</span>
        </div>
        <input type="range" min="0.5" max="120" step="0.5" value={S} onChange={e=>setS(Number(e.target.value))} style={{width:"100%",accentColor:"var(--c-accent)"}}/>
      </div>
      <div style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
          <span style={{fontSize:12,color:C.text}}>Difficulté <strong>D</strong></span>
          <span style={{fontFamily:mono,fontSize:12,color:C.accent,fontWeight:700}}>{D.toFixed(1)} / 10</span>
        </div>
        <input type="range" min="1" max="10" step="0.1" value={D} onChange={e=>setD(Number(e.target.value))} style={{width:"100%",accentColor:"var(--c-accent)"}}/>
      </div>
      <div className="mfc-grid-4" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginTop:12}}>
        {[[1,"À revoir",C.again,C.againBg],[2,"Difficile",C.hard,C.hardBg],[3,"Bien",C.good,C.goodBg],[4,"Facile",C.easy,C.easyBg]].map(([r,lbl,col,bg])=>
          <div key={r} style={{padding:"10px 6px",borderRadius:8,border:`1.5px solid ${col}`,background:bg,color:col,textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:600}}>{lbl}</div>
            <div style={{fontSize:14,fontWeight:700,marginTop:4}}>{getIntervalLabel(fake,r,settings||DEFAULT_SETTINGS)}</div>
          </div>)}
      </div>
      <RetentionCurve S={S}/>
    </div>

    <div style={{marginTop:20,paddingTop:14,borderTop:`1px solid ${C.border}`}}>
      <p style={{fontSize:12,color:C.textLt,margin:0,lineHeight:1.7}}>Ce mode tient son propre calendrier. Les cartes que tu travailles ici ne bougent pas d'un jour quand tu passes en méthode des J ou en révision personnalisée, et inversement.</p>
    </div>
    <div style={{marginTop:16,textAlign:"right"}}><Btn fill onClick={onClose}>J'ai compris</Btn></div>
  </Modal>;
}

// ─── Fiche : méthode des J ───────────────────────────────────────────────────
function JMethodModal({onClose}){
  return <Modal onClose={onClose} width={620}>
    <p style={{fontFamily:mono,fontSize:9,letterSpacing:2.5,textTransform:"uppercase",color:"var(--c-violet)",margin:"0 0 6px"}}>Méthode des J</p>
    <p style={{fontFamily:serif,fontSize:23,margin:"0 0 6px"}}>Un planning que tu décides à l'avance</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 8px",lineHeight:1.7}}>Ici, aucun algorithme ne décide à ta place. Le jour où tu ouvres un paquet, c'est <strong>J0</strong>. Tu as coché, par exemple, J1 · J3 · J7 · J14 · J30 : la carte reviendra le lendemain, puis trois jours après le cours, puis une semaine après, et ainsi de suite. Ces dates ne bougent jamais.</p>

    <p style={{fontFamily:serif,fontSize:17,margin:"18px 0 2px"}}>Pourquoi ça marche</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 4px",lineHeight:1.7}}>Sans révision, la mémoire d'une information neuve chute très vite — jusqu'à <strong>70 % d'oubli dès le lendemain</strong>. Chaque rappel placé au bon moment relance la courbe depuis le haut, et la chute suivante est plus lente. C'est le mécanisme décrit par Ebbinghaus il y a plus d'un siècle :</p>
    <ForgettingCurve/>
    <p style={{fontSize:12,color:C.textLt,margin:"10px 0 0",lineHeight:1.7,textAlign:"center"}}>Chaque point bleu est un J. Plus ils sont resserrés au début, plus la carte tient longtemps ensuite.</p>

    <p style={{fontFamily:serif,fontSize:17,margin:"22px 0 2px"}}>Tu choisis tes J paquet par paquet</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 10px",lineHeight:1.7}}>Dans un même chapitre, le paquet <strong>Prioritaire</strong> peut suivre J1-J2-J3-J7-J14-J30 pendant que le paquet <strong>Utile</strong> se contente de J7-J30. Tu coches ce que tu veux dans la grille, et tu peux appliquer un plan d'un seul geste à tout un cours ou à toute une matière.</p>

    <div style={{background:"var(--c-violetBg)",border:"1px solid var(--c-violetSoft)",borderRadius:10,padding:"16px 18px",margin:"18px 0"}}>
      <p style={{fontFamily:serif,fontSize:17,margin:"0 0 8px",color:"var(--c-violet)"}}>Une carte reste disponible toute la journée</p>
      <p style={{fontSize:13,color:C.textMed,margin:"0 0 10px",lineHeight:1.7}}>C'est le principe du mode : tant que tu n'as pas coché le J suivant, la carte n'a pas quitté ta journée. Un seul bouton la fait avancer.</p>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {[["✅","Acquis → J+n","le seul bouton qui coche le J suivant. La carte sort de la journée et revient à la date prévue."],
          ["⏱","1 · 5 · 10 · 30 min","la carte n'est pas acquise : elle disparaît de la file et y revient quand la minuterie sonne."]].map(([ic,t,d])=>
          <div key={t} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <span style={{fontSize:15,flexShrink:0,width:20}}>{ic}</span>
            <p style={{fontSize:12.5,color:C.textMed,margin:0,lineHeight:1.6}}><strong style={{color:C.text}}>{t}</strong> — {d}</p>
          </div>)}
      </div>
      <p style={{fontSize:12.5,color:C.textMed,margin:"12px 0 0",lineHeight:1.7}}><strong style={{color:C.text}}>Et si tu finis le paquet avant la fin d'un délai ?</strong> Les cartes en attente sont remises en jeu sur-le-champ. Un paquet n'est jamais annoncé terminé tant qu'il en reste une — c'est ce qui fait de <strong>30 min</strong> une fin de paquet de fait : un paquet demande rarement une demi-heure, la carte revient donc à la fin, pas dans trente minutes.</p>
      <p style={{fontSize:12,color:C.textLt,margin:"10px 0 0",lineHeight:1.7}}>À minuit, tous les reports expirent. Une carte que tu n'as pas validée est de nouveau proposée le lendemain, <strong>au même J</strong>, marquée « en retard ». Elle n'avance jamais toute seule.</p>
    </div>

    <p style={{fontSize:12,color:C.textLt,margin:0,lineHeight:1.7}}>Ce mode tient son propre calendrier. Les cartes que tu travailles ici ne touchent pas à la programmation de la méthode Anki, et inversement : tu peux faire des allers-retours sans rien perdre.</p>
    <div style={{marginTop:16,textAlign:"right"}}><Btn fill onClick={onClose}>J'ai compris</Btn></div>
  </Modal>;
}

  const rows=[];
  for(let i=0;i<J_VALUES.length;i+=J_PER_ROW)rows.push(J_VALUES.slice(i,i+J_PER_ROW));

      })}
    </div>

    <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:8,border:`1.5px solid ${sel.has(0)?"var(--c-violet)":C.border}`,background:sel.has(0)?"var(--c-violetBg)":"transparent",cursor:"pointer",marginBottom:14}}>
      <input type="checkbox" checked={sel.has(0)} onChange={()=>toggle(0)} style={{width:16,height:16,accentColor:"var(--c-violet)",cursor:"pointer"}}/>
      <span style={{minWidth:0}}>
        <span style={{fontSize:13,fontWeight:600,color:C.text,display:"block"}}>J0 — un premier passage le jour même</span>
        <span style={{fontSize:11,color:C.textMed,lineHeight:1.5}}>Sans lui, une carte ouverte aujourd'hui n'est revue que demain.</span>
      </span>
    </label>

    <Lbl>La grille</Lbl>
    <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
      {rows.map((row,ri)=><div key={ri} style={{display:"grid",gridTemplateColumns:`repeat(${J_PER_ROW},1fr)`,gap:5}}>
        {row.map(j=>{
          const on=sel.has(j);
          return <button key={j} onClick={()=>toggle(j)} style={{fontFamily:font,fontSize:12.5,fontWeight:on?700:500,padding:"9px 2px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${on?"var(--c-violet)":C.border}`,background:on?"var(--c-violet)":"transparent",color:on?"var(--c-onSolid)":C.textMed,transition:"all 0.12s"}}>{j}</button>;
        })}
      </div>)}
    </div>

    <div style={{background:"var(--c-surfaceAlt)",border:`1px solid ${C.border}`,borderRadius:8,padding:"11px 13px",marginBottom:16}}>
      <p style={{fontSize:11,color:C.textLt,margin:"0 0 5px",fontFamily:mono,letterSpacing:1,textTransform:"uppercase"}}>{list.length} passage{list.length>1?"s":""} programmé{list.length>1?"s":""}</p>
      <p style={{fontSize:13,color:C.text,margin:0,lineHeight:1.7,wordBreak:"break-word"}}>{list.length?list.map(jLabel).join(" · "):<span style={{color:C.again}}>Aucun J coché — la carte ne sera jamais proposée.</span>}</p>
    </div>

    {scopes&&scopes.length>1&&<>
      <Lbl>Appliquer ce plan à</Lbl>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:18}}>
        {scopes.map(s=>{
          const on=scope===s.id;
          return <button key={s.id} onClick={()=>setScope(s.id)} style={{fontFamily:font,fontSize:12.5,textAlign:"left",padding:"9px 12px",cursor:"pointer",borderRadius:7,border:`1.5px solid ${on?"var(--c-violet)":C.border}`,background:on?"var(--c-violetBg)":"transparent",color:on?"var(--c-violet)":C.textMed,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:13}}>{on?"◉":"○"}</span>
            <span><strong>{s.label}</strong>{s.desc&&<span style={{display:"block",fontSize:11,opacity:0.8,marginTop:1}}>{s.desc}</span>}</span>
          </button>;

    <div style={{display:"flex",gap:10,justifyContent:"flex-end",flexWrap:"wrap"}}>
      <Btn onClick={onClose}>Annuler</Btn>

    {agenda.map((d,i)=>{
      const dt=new Date(d.date+"T12:00:00");

      return <div key={d.date} title={`${dt.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})} : ${d.n} carte${d.n>1?"s":""}`} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,minWidth:0}}>

}

// ─── Adaptation personnelle d'une carte ───────────────────────────────────────
// Ouverte depuis la session de révision. L'étudiant retouche la formulation de
// la question, complète la réponse, ajoute ou remplace une image — et ces
// changements n'existent QUE pour lui. La carte officielle n'est pas touchée,
// les autres étudiants ne voient rien, et l'administrateur reste seul maître de
// la version d'origine.
//
// Cas particulier des cartes à image occlusion : le titre et la réponse sont
// modifiables, mais pas le découpage des zones sur l'image. Redécouper une image
// mutualisée entre plusieurs cartes serait à la fois lourd et hasardeux ; le
// besoin réel — reformuler ou annoter — est couvert par les deux champs offerts.
function CardAdaptModal({card,onSave,onReset,onClose}){
  const occ=isOcclusion(card);
  const origFront=card.originalFront!==undefined?card.originalFront:card.front;
  const origBack=card.originalBack!==undefined?card.originalBack:card.back;
  const fc=parseContent(card.front), bc=parseContent(card.back);
  const occData=useMemo(()=>{ if(!occ)return null; try{ return JSON.parse(card.front); }catch{ return null; } },[occ,card.front]);
  const [frontText,setFrontText]=useState(occ?(occData?.title||""):fc.text);
  const [backText,setBackText]=useState(bc.text);
  const [frontImg,setFrontImg]=useState(occ?null:fc.img);
  const [backImg,setBackImg]=useState(bc.img);
  const [saving,setSaving]=useState(false);
  const [confirmReset,setConfirmReset]=useState(false);
  const isEdited=!!card.isEdited;
  const handleSave=async()=>{
    if(saving)return;
    setSaving(true);
    let newFront;
    if(occ){
      // On réécrit uniquement le titre dans le JSON d'occlusion : zones,
      // référence d'image et zone cible sont recopiées telles quelles.
      newFront=JSON.stringify({...(occData||{}),title:frontText});
    } else {
      newFront=serializeContent(frontText,frontImg);
    }
    const newBack=serializeContent(backText,backImg);
    await onSave(card.id,newFront,newBack);
    setSaving(false);
    onClose();
  };
  const handleReset=async()=>{
    setSaving(true);
    await onReset(card.id);
    setSaving(false);
    onClose();
  };
  const origFc=parseContent(origFront), origBc=parseContent(origBack);
  return <Modal onClose={onClose} width={560}>
    <p style={{fontFamily:serif,fontSize:21,margin:"0 0 6px"}}>Adapter cette carte</p>
    <p style={{fontSize:12.5,color:C.textMed,margin:"0 0 4px",lineHeight:1.65}}>
      Reformule la question, complète la réponse, ajoute une image — comme tu veux.
    </p>
    <p style={{fontSize:12,color:C.textLt,margin:"0 0 20px",lineHeight:1.65}}>
      🔒 Ta version reste <strong>privée</strong> et ne remplace la carte que pour toi.
      Tu la retrouveras telle quelle à chaque révision, sur tous tes appareils.
      La carte officielle et les révisions des autres étudiants ne changent pas.
    </p>
    {isEdited&&<div style={{background:"var(--c-violetBg)",border:"1px solid var(--c-violetSoft)",borderRadius:8,padding:"9px 13px",marginBottom:18}}>
      <p style={{fontSize:12,color:"var(--c-violet)",margin:0,lineHeight:1.55}}>✏️ Tu as déjà adapté cette carte. Tu peux continuer à la modifier, ou revenir à la version d'origine.</p>
    </div>}
    <div style={{marginBottom:18}}>
      <Lbl>{occ?"Titre affiché au-dessus de l'image":"Question (recto)"}</Lbl>
      <textarea value={frontText} onChange={e=>setFrontText(e.target.value)} rows={occ?2:3}
        placeholder={occ?"Titre de l'image (optionnel)":"La question, formulée à ta façon"}
        style={{...iBox,fontFamily:serif,fontSize:15}}/>
      {!occ&&origFc.text&&origFc.text!==frontText&&<details style={{marginTop:7}}>
        <summary style={{fontSize:11,color:C.textLt,cursor:"pointer"}}>Voir la formulation d'origine</summary>
        <p style={{fontSize:12.5,color:C.textMed,margin:"7px 0 0",lineHeight:1.6,fontFamily:serif,whiteSpace:"pre-wrap",padding:"9px 12px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>{origFc.text}</p>
      </details>}
      {!occ&&<div style={{marginTop:11}}><ImageDropZone value={frontImg} onChange={setFrontImg} label="Image du recto (optionnelle)"/></div>}
      {occ&&<p style={{fontSize:11.5,color:C.textLt,margin:"9px 0 0",lineHeight:1.6}}>🖼 Les zones masquées de l'image ne sont pas modifiables ici : elles sont communes à toutes les cartes issues de cette image.</p>}
    </div>
    <div style={{marginBottom:22}}>
      <Lbl>Réponse (verso)</Lbl>
      <textarea value={backText} onChange={e=>setBackText(e.target.value)} rows={4}
        placeholder="La réponse, avec tes propres repères, moyens mnémotechniques…"
        style={{...iBox,fontSize:14}}/>
      {origBc.text&&origBc.text!==backText&&<details style={{marginTop:7}}>
        <summary style={{fontSize:11,color:C.textLt,cursor:"pointer"}}>Voir la réponse d'origine</summary>
        <p style={{fontSize:12.5,color:C.textMed,margin:"7px 0 0",lineHeight:1.6,whiteSpace:"pre-wrap",padding:"9px 12px",background:C.bg,borderRadius:6,border:`1px solid ${C.border}`}}>{origBc.text}</p>
      </details>}
      <div style={{marginTop:11}}><ImageDropZone value={backImg} onChange={setBackImg} label="Image du verso (optionnelle)"/></div>
    </div>
    <p style={{fontSize:11.5,color:C.textLt,margin:"0 0 16px",lineHeight:1.6}}>
      Ta progression sur cette carte (intervalles, historique, points) est conservée : tu l'adaptes sans repartir de zéro.
    </p>
    {confirmReset?(

}
// ─── Study ────────────────────────────────────────────────────────────────────
function StudyView({label,queue,cram=false,mode="anki",jplans,onRate,onJAction,onJUnsnooze,onBury,onChangePacket,onDeleteUserCard,onEditUserCard,onSaveOverride,onResetOverride,overrides={},onBack,settings,isAdmin,progress,theme,onToggleTheme,onUndo,onQueueChange}){
  // ─── Cartes mises en attente (méthodes des J et personnalisée) ──────────────

  const [idx,setIdx]=useState(0),[showBack,setShowBack]=useState(false),[showOthers,setShowOthers]=useState(false),[localQ,setLocalQ]=useState(queue),[done,setDone]=useState(false),[stats,setStats]=useState({correct:0,total:0}),[buryFlash,setBuryFlash]=useState(false),[showPktChange,setShowPktChange]=useState(false),[gainFlash,setGainFlash]=useState(null),[sessionPts,setSessionPts]=useState(0),[confirmDelCard,setConfirmDelCard]=useState(null),[delFlash,setDelFlash]=useState(false);
  // Adaptation personnelle de la carte affichée.

  const prefetchedRef=useRef(new Set());
  useEffect(()=>{
    let alive=true;

    // 1. Contenu encore absent (recto d'une occlusion, carte texte pas encore chargée).
    //    On n'accepte que les réponses réellement remplies : une carte disparue du

        if(!Object.keys(usable).length)return;

  // Le battement qui fait revenir les cartes en attente. Cinq secondes : assez fin

    // la file est vide. Ce second cas est celui qui compte le plus : il évite
    // d'annoncer « paquet terminé » alors que des cartes attendent encore, et il
    // fait qu'un report de 30 minutes se comporte en pratique comme une fin de

      <div style={{width:"min(520px,88vw)",height:260,borderRadius:12,background:C.surface,border:`1.5px solid ${C.border}`,animation:"mfcPulse 1.2s ease-in-out infinite"}}/>
      <p style={{fontFamily:mono,fontSize:10,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:0}}>préparation de la carte…</p>
    </div>;
  }

    // Instantané AVANT modification : progression d'origine, file et position.
    const prevProgSnapshot=progress?progress[card.id]:undefined;
    const snapshot={
      cardId:card.id, card,
      prevProg:prevProgSnapshot?JSON.parse(JSON.stringify(prevProgSnapshot)):undefined,
      elapsedMs:elapsed, wasCorrect:rating>=3, wasNew:!prevProgSnapshot||prevProgSnapshot.state==="new",
      queue:[...localQ], idx, stats:{...stats}, sessionPts, rating,
    };

    const np=await onRate(card,rating,elapsed);
    snapshot.gain=(np&&np.__gain)?np.__gain:null;

        cardId:card.id, card,
        prevProg:prevProgSnapshot?JSON.parse(JSON.stringify(prevProgSnapshot)):undefined,
        elapsedMs:elapsed, wasCorrect:action==="validate", wasNew:false,
        queue:[...localQ], idx, stats:{...stats}, sessionPts, rating:action==="validate"?3:1,

        const g=res.__gain,fid=Date.now()+Math.random();

    <div style={{height:3,background:C.border}}><div style={{height:3,background:col,width:`${(idx/Math.max(1,localQ.length))*100}%`,transition:"width 0.3s"}}/></div>
    {cram&&<div style={{background:"var(--c-violetBg)",borderBottom:"1px solid var(--c-violetSoft)",padding:"8px 24px",textAlign:"center"}}><p style={{fontSize:12,color:"var(--c-violet)",margin:0,fontWeight:500}}>🗓️ Révision en avance — ces cartes comptent normalement, avec un gain réduit à la hauteur de l'avance prise</p></div>}
    {undoFlash&&<div key={undoFlash.id} style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:200,background:"var(--c-toast)",color:"var(--c-onSolid)",borderRadius:8,padding:"10px 18px",fontFamily:font,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.2)",animation:"fadeIn 0.2s ease",textAlign:"center"}}>↩ Retour sur la carte précédente{undoFlash.points>0?` — ${undoFlash.points} point${undoFlash.points>1?"s":""} retiré${undoFlash.points>1?"s":""}`:""}</div>}
    {recallFlash&&<div key={recallFlash.id} style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:200,background:C.hardBg,border:`1.5px solid ${C.hard}`,color:C.hard,borderRadius:8,padding:"10px 18px",fontFamily:font,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",animation:"fadeIn 0.2s ease",textAlign:"center",maxWidth:"92vw"}}>↻ Fin du paquet — {recallFlash.n} carte{recallFlash.n>1?"s":""} en attente {recallFlash.n>1?"remises":"remise"} en jeu</div>}
    {buryFlash&&<div style={{position:"fixed",bottom:24,right:24,zIndex:200,background:"var(--c-toast)",color:"var(--c-onSolid)",borderRadius:8,padding:"10px 18px",fontFamily:font,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.2)",animation:"fadeIn 0.2s ease"}}>🙈 Carte enfouie — plus dans tes révisions</div>}
    {delFlash&&<div style={{position:"fixed",bottom:24,right:24,zIndex:200,background:C.again,color:"var(--c-onSolid)",borderRadius:8,padding:"10px 18px",fontFamily:font,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.2)",animation:"fadeIn 0.2s ease"}}>🗑 Ta carte a été supprimée</div>}
    {adaptCard&&<CardAdaptModal card={localQ.find(c=>c.id===adaptCard.id)||adaptCard} onSave={handleSaveAdapt} onReset={handleResetAdapt} onClose={()=>setAdaptCard(null)}/>}
    {adaptFlash&&<div key={adaptFlash.id} style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:200,background:adaptFlash.kind==="saved"?"var(--c-violetBg)":C.bg,border:`1.5px solid ${adaptFlash.kind==="saved"?"var(--c-violet)":C.border}`,color:adaptFlash.kind==="saved"?"var(--c-violet)":C.textMed,borderRadius:8,padding:"10px 18px",fontFamily:font,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",animation:"fadeIn 0.2s ease",textAlign:"center",maxWidth:"92vw"}}>{adaptFlash.kind==="saved"?"✏️ Ta version est enregistrée — elle s'affichera à chaque révision":"↺ Version d'origine rétablie"}</div>}
    {confirmDelCard&&<Modal onClose={()=>setConfirmDelCard(null)} width={360}>
      <p style={{fontFamily:serif,fontSize:20,margin:"0 0 8px"}}>Supprimer ta carte ?</p>
      <p style={{fontSize:13,color:C.textMed,margin:"0 0 8px",lineHeight:1.6}}>Cette carte que tu as créée sera définitivement effacée de ton compte, ainsi que sa place dans tes révisions.</p>
      <p style={{fontSize:12,color:C.textLt,margin:"0 0 22px",lineHeight:1.6}}>Les cartes officielles de MyFlashcard et les révisions des autres étudiants ne sont pas touchées.</p>
      <div style={{display:"flex",gap:10}}><Btn fill danger onClick={handleDeleteOwnCard}>Supprimer</Btn><Btn onClick={()=>setConfirmDelCard(null)}>Annuler</Btn></div>
    </Modal>}
    {gainFlash&&<div key={gainFlash.id} style={{position:"fixed",top:88,right:24,zIndex:210,background:"var(--c-goldBg)",border:"1.5px solid #b7791f",color:"var(--c-goldText)",borderRadius:10,padding:"10px 16px",fontFamily:font,boxShadow:"0 6px 20px rgba(0,0,0,0.12)",animation:"pointsPop 0.35s ease",textAlign:"right"}}>
      <div style={{fontFamily:serif,fontSize:22,fontWeight:600,lineHeight:1}}>+{gainFlash.points} pts</div>
      <div style={{fontSize:10,color:"var(--c-goldTextSoft)",marginTop:3}}>{AGE_LABELS[gainFlash.age]} {gainFlash.base} {gainFlash.bonus?`+ ${IMP_LABELS[gainFlash.packetId]||""} ${gainFlash.bonus}`:""} · {gainFlash.total} pts aujourd'hui</div>
    </div>}
    <div className="mfc-page mfc-study" style={{maxWidth:560,margin:"0 auto",padding:"28px 24px 0"}}>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18,alignItems:"center"}}>
        {mode==="anki"&&isNewCard&&<span style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",padding:"3px 8px",borderRadius:3,background:"var(--c-dangerBg)",color:"var(--c-danger)",border:"1px solid #fca5a5",fontWeight:700}}>Nouveau</span>}
        <Tag color={col} bg={pB(card.packetId)}>{PACKETS.find(p=>p.id===card.packetId)?.label}</Tag>
        <Tag color={C.accent} bg={C.accentBg}>{grp?.label}</Tag>
        <Tag color={C.textMed} bg={C.bg}>Cours {card.num}</Tag>
        {chName&&<Tag color={C.textMed} bg={C.bg}>Ch.{card.chapterId} {chName}</Tag>}
        {card.isUserCard&&<Tag color={"var(--c-violet)"} bg={"var(--c-violetBg)"}>✏️ Personnel</Tag>}
        {!card.isUserCard&&card.isEdited&&<Tag color={"var(--c-violet)"} bg={"var(--c-violetBg)"}>✏️ Ta version</Tag>}
        <Tag color={C.textLt} bg={C.bg}>{mode==="j"?(jInfo?(jInfo.isNew?"Méthode des J · première ouverture":`Méthode des J · ${jLabel(jInfo.j)}${jInfo.late>0?` (+${jInfo.late} j)`:""}`):"Méthode des J"):mode==="perso"?(persoM===null?"Jamais travaillée ici":`Maîtrise ${Math.round(persoM*100)} %`):stateLabel(cardProg)}</Tag>
      </div>
      {isOcclusion(card)?(
        <div style={{marginBottom:22}}>
          <div style={{background:C.surface,border:`1.5px solid ${showBack?col:C.border}`,borderRadius:12,padding:"16px 20px",transition:"border-color 0.3s"}}>
            {getOcclusionTitle(card.front)&&<p style={{fontFamily:serif,fontSize:17,fontWeight:600,color:C.text,margin:"0 0 12px",textAlign:"center"}}>{getOcclusionTitle(card.front)}</p>}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><Lbl>{showBack?"Réponse révélée":showOthers?"Indices visibles (image)":"Zone rouge = à deviner · Zones noires = masquées"}</Lbl>{showBack&&<Tag color={C.good} bg={C.goodBg} small>Révélé</Tag>}</div>
            <div onClick={()=>showBack?setShowBack(false):setShowBack(true)} style={{cursor:"pointer"}}><OcclusionCanvas cardFront={card.front} showBack={showBack} showOthers={showOthers}/></div>
            {!showBack&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}><button onClick={e=>{e.stopPropagation();setShowOthers(s=>!s);}} style={{fontFamily:font,fontSize:11,fontWeight:500,padding:"6px 12px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${showOthers?C.imp:C.border}`,background:showOthers?C.impBg:"transparent",color:showOthers?C.imp:C.textMed,display:"flex",alignItems:"center",gap:6}}>{showOthers?"🔲 Masquer les indices":"👁 Voir les indices (image)"}</button><button onClick={()=>setShowBack(true)} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 14px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${col}`,background:pB(card.packetId),color:col}}>Révéler →</button></div>}
            {showBack&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}><button onClick={()=>setShowBack(false)} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,padding:0}}>← Cliquer sur l'image pour revoir la question</button></div>}
          </div>
        </div>
      ):(
        <div style={{perspective:1200,marginBottom:22}}>
          {(()=>{
            const fc=parseContent(card.front);
            const bc=parseContent(card.back);
            const minH=fc.img||bc.img?300:260;
            return(
              <div style={{width:"100%",minHeight:minH,position:"relative",transformStyle:"preserve-3d",transform:showBack?"rotateY(180deg)":"rotateY(0)",transition:"transform 0.4s cubic-bezier(0.4,0,0.2,1)",cursor:showBack?"pointer":"pointer"}} onClick={()=>showBack?setShowBack(false):setShowBack(true)}>
                <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",background:C.surface,borderRadius:12,border:`1.5px solid ${C.border}`,padding:"24px 28px",display:"flex",flexDirection:"column",justifyContent:"center",minHeight:minH}}>
                  <Lbl>Question · cliquer pour révéler</Lbl>
                  {fc.text&&<MathText text={fc.text} style={{fontFamily:serif,fontSize:20,lineHeight:1.6,margin:"8px 0 0",whiteSpace:"pre-wrap",...(!isAdmin?noSel:{})}} onContextMenu={!isAdmin?e=>e.preventDefault():undefined}/>}
                  {fc.img&&<img src={fc.img} style={{maxWidth:"100%",maxHeight:220,borderRadius:8,marginTop:fc.text?12:0,display:"block",objectFit:"contain"}}/>}
                  <p style={{fontSize:12,color:C.textLt,position:"absolute",bottom:14,right:18}}>Cliquer pour révéler →</p>
                </div>
                <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",background:C.surface,borderRadius:12,border:`1.5px solid ${col}`,padding:"24px 28px",display:"flex",flexDirection:"column",justifyContent:"center",transform:"rotateY(180deg)",minHeight:minH}}>
                  <Lbl>Réponse · cliquer pour revoir la question</Lbl>
                  {bc.text&&<MathText text={bc.text} style={{fontSize:15,lineHeight:1.8,margin:"8px 0 0",color:C.textMed,whiteSpace:"pre-wrap",...(!isAdmin?noSel:{})}} onContextMenu={!isAdmin?e=>e.preventDefault():undefined}/>}
                  {bc.img&&<img src={bc.img} style={{maxWidth:"100%",maxHeight:220,borderRadius:8,marginTop:bc.text?12:0,display:"block",objectFit:"contain"}}/>}
                </div>
              </div>
            );
          })()}
        </div>
      )}
      {showBack&&<div>
        {mode==="j"?(
        // ─── Méthode des J ────────────────────────────────────────────────────
        // « Acquis » est le seul bouton qui coche le J suivant. Tous les autres
        // gardent la carte dans la journée : c'est le cœur du mode.
        <>
          <Lbl color="var(--c-violet)">{jInfo&&jInfo.late>0?`${jLabel(jInfo.j)} · en retard de ${jInfo.late} jour${jInfo.late>1?"s":""}`:`Passage ${jInfo?jLabel(jInfo.j):"J0"}`} — l'as-tu acquise ?</Lbl>
          <button onClick={()=>handleJAction("validate")} style={{fontFamily:font,width:"100%",padding:"15px 12px",marginTop:10,cursor:"pointer",borderRadius:8,border:`1.5px solid ${C.good}`,background:C.goodBg,color:C.good,display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"transform 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.transform="none";}}>
            <span style={{fontSize:15,fontWeight:700}}>✅ Acquis {jNext!=null?`→ ${jLabel(jNext)}`:"→ plan terminé"}</span>
            <span style={{fontSize:11.5,opacity:0.85}}>{jNext!=null?`prochain passage ${jNextLabel}`:"plus aucun rappel prévu pour cette carte"}</span>
          </button>
          <p style={{fontFamily:mono,fontSize:9,letterSpacing:2.5,textTransform:"uppercase",color:C.textLt,margin:"16px 0 8px",textAlign:"center"}}>Pas encore acquise — la revoir dans</p>
          <div className="mfc-grid-4 mfc-rate-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
            {J_SNOOZE.map(sn=><button key={sn.id} title={sn.hint} onClick={()=>handleJAction("delay",sn.mins)} style={{fontFamily:font,padding:"13px 4px",cursor:"pointer",borderRadius:8,border:`1.5px solid ${C.hard}`,background:C.hardBg,color:C.hard,display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"transform 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.transform="none";}}>
              <span style={{fontSize:14,fontWeight:700}}>{sn.label}</span>
              <span style={{fontSize:9,opacity:0.8,lineHeight:1.2,textAlign:"center"}}>{sn.hint}</span>
            </button>)}
          </div>
          <p style={{fontSize:11,color:C.textLt,margin:"12px 0 0",lineHeight:1.6,textAlign:"center"}}>Seul <strong>Acquis</strong> coche le J suivant. Si tu finis le paquet avant la fin d'un délai, la carte revient quand même — le paquet n'est jamais terminé tant qu'il en reste une en attente. À minuit, une carte non acquise repart au même J, marquée « en retard ».</p>
        </>
        ):mode==="perso"?(
        // ─── Révision personnalisée ───────────────────────────────────────────
        // Les mêmes quatre notes qu'en méthode Anki, mais elles ne reprogramment
        // rien : elles alimentent uniquement le pourcentage de maîtrise du paquet.
        <>
          <Lbl color="var(--c-gold)">Comment était-ce ? {persoM!==null&&<span style={{color:masteryColor(persoM),fontWeight:700}}>· maîtrise actuelle {Math.round(persoM*100)} %</span>}</Lbl>
          <div className="mfc-grid-4 mfc-rate-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:10}}>
            {[[1,"À revoir","0","1 min",C.again,C.againBg],[2,"Difficile","0,5","5 min",C.hard,C.hardBg],[3,"Correct","1","10 min",C.good,C.goodBg],[4,"Facile","1","sortie",C.easy,C.easyBg]].map(([r,lbl,val,delai,btnCol,btnBg])=>
              <button key={r} onClick={()=>handleRate(r)} title={PERSO_SNOOZE_LABEL[r]} style={{fontFamily:font,padding:"13px 6px",cursor:"pointer",borderRadius:8,border:`1.5px solid ${btnCol}`,background:btnBg,color:btnCol,display:"flex",flexDirection:"column",alignItems:"center",gap:4,transition:"transform 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.transform="none";}}>
                <span style={{fontSize:12,fontWeight:600}}>{lbl}</span>
                <span style={{fontSize:14,fontWeight:700}}>{val}</span>
                <span style={{fontSize:9.5,opacity:0.8,lineHeight:1.2,textAlign:"center"}}>{r===4?"pas avant la prochaine session":`revient dans ${delai}`}</span>
              </button>)}
          </div>
          <p style={{fontSize:11,color:C.textLt,margin:"12px 0 0",lineHeight:1.6,textAlign:"center"}}>La note met à jour le <strong>pourcentage de maîtrise</strong> du paquet sans reprogrammer aucune échéance, et décide en même temps <strong>dans combien de temps la carte se represente</strong> dans cette session. Si tu finis le paquet avant, elle revient quand même.</p>
        </>
        ):(
        <>
          <Lbl>Comment était-ce ?</Lbl>
          <div className="mfc-grid-4 mfc-rate-grid" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:10}}>
            {[[1,"À revoir",C.again,C.againBg],[2,"Difficile",C.hard,C.hardBg],[3,"Bien",C.good,C.goodBg],[4,"Facile",C.easy,C.easyBg]].map(([r,lbl,btnCol,btnBg])=><button key={r} onClick={()=>handleRate(r)} style={{fontFamily:font,padding:"14px 8px",cursor:"pointer",borderRadius:8,border:`1.5px solid ${btnCol}`,background:btnBg,color:btnCol,display:"flex",flexDirection:"column",alignItems:"center",gap:6,transition:"transform 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.transform="none";}}><span style={{fontSize:12,fontWeight:600}}>{lbl}</span><span style={{fontSize:14,fontWeight:700}}>{getIntervalLabel(cardProg,r,settings)}</span></button>)}
          </div>
          {earlyDays>0&&<p style={{fontSize:11,color:C.textLt,margin:"10px 0 0",lineHeight:1.6,textAlign:"center"}}>Carte revue <strong>{earlyDays} jour{earlyDays>1?"s":""} avant son échéance</strong> — les délais proposés sont plus courts que si tu avais attendu, c'est normal : réussir une carte encore fraîche prouve moins de choses.</p>}
        </>
        )}
        {mode==="j"?(()=>{
          const remaining=localQ.slice(idx);
          const lateCount=remaining.filter(c=>{
            const pl=jPlanFor(jplans||{},c.groupId,c.num,c.chapterId,effPkt(c,progress||{}));
            return jDueInfo(progress?.[c.id],pl).late>0;
          }).length;
          return <div style={{display:"flex",justifyContent:"center",gap:18,marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"var(--c-violet)",fontWeight:600}}>{remaining.length} restante{remaining.length!==1?"s":""}</span>
            {lateCount>0&&<span style={{fontSize:11,color:C.again,fontWeight:600}}>{lateCount} en retard</span>}
            {waiting.length>0&&<span style={{fontSize:11,color:C.hard,fontWeight:600}}>{waiting.length} en attente</span>}
          </div>;
        })():mode==="perso"?(()=>{
          const remaining=localQ.slice(idx);
          const weak=remaining.filter(c=>{const m=cardMastery(progress?.[c.id]);return m!==null&&m<PERSO_WEAK;}).length;
          const fresh=remaining.filter(c=>cardMastery(progress?.[c.id])===null).length;
          return <div style={{display:"flex",justifyContent:"center",gap:18,marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
            <span style={{fontSize:11,color:"var(--c-gold)",fontWeight:600}}>{remaining.length} restante{remaining.length!==1?"s":""}</span>
            {weak>0&&<span style={{fontSize:11,color:C.again,fontWeight:600}}>{weak} fragile{weak>1?"s":""}</span>}
            {fresh>0&&<span style={{fontSize:11,color:C.textMed,fontWeight:600}}>{fresh} jamais travaillée{fresh>1?"s":""}</span>}
          </div>;
        })():(()=>{
          const remaining=localQ.slice(idx);
          const newCount=remaining.filter(c=>isNew(progress?.[c.id])).length;
          const learningCount=remaining.filter(c=>{const p=progress?.[c.id];return p&&(p.state==="learning"||p.state==="relearning");}).length;
          const reviewCount=remaining.filter(c=>{const p=progress?.[c.id];return p&&p.state==="review";}).length;
          return <div style={{display:"flex",justifyContent:"center",gap:18,marginTop:14,paddingTop:12,borderTop:`1px solid ${C.border}`}}>
            <span style={{fontSize:11,color:"var(--c-easy)",fontWeight:600}}>{newCount} nouvelle{newCount!==1?"s":""}</span>
            <span style={{fontSize:11,color:"var(--c-danger)",fontWeight:600}}>{learningCount} en attente</span>
            <span style={{fontSize:11,color:C.good,fontWeight:600}}>{reviewCount} à réviser</span>
          </div>;
        })()}
        {!isAdmin&&onChangePacket&&<div style={{marginTop:14}}>
          <button onClick={()=>setShowPktChange(s=>!s)} style={{fontFamily:font,fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${showPktChange?C.accent:C.border}`,background:showPktChange?C.accentBg:"transparent",color:showPktChange?C.accent:C.textLt,display:"flex",alignItems:"center",gap:5}}>📦 Changer l'importance (pour moi uniquement) {showPktChange?"▲":"▼"}</button>
          {showPktChange&&<div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            {PACKETS.map(pk=>{
              const currentPkt=progress?.[card.id]?.packetOverride||card.packetId;
              const isActive=currentPkt===pk.id;
              const isOriginal=!progress?.[card.id]?.packetOverride&&card.packetId===pk.id;
              return<button key={pk.id} onClick={()=>{onChangePacket(card,pk.id);setShowPktChange(false);}} style={{fontFamily:font,fontSize:12,fontWeight:isActive?600:400,padding:"7px 14px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${isActive?pC(pk.id):C.border}`,background:isActive?pB(pk.id):"transparent",color:isActive?pC(pk.id):C.textMed,display:"flex",alignItems:"center",gap:5}}>
                {isActive&&"✓ "}{pk.label}{isOriginal&&<span style={{fontSize:9,color:C.textLt}}>(original)</span>}
              </button>;
            })}
            {progress?.[card.id]?.packetOverride&&<button onClick={()=>{onChangePacket(card,card.packetId);setShowPktChange(false);}} style={{fontFamily:font,fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${C.again}`,background:C.againBg,color:C.again}}>↩ Rétablir l'original</button>}
          </div>}
        </div>}

function PriorityBadges(){

      const newCards=prev.map(c=>c.id===card.id?updated:c);
      setUCache(currentUser.username,newCards);
      return newCards;
    });
    supa.upsertUserCard(updated).catch(e=>console.error("upsertUserCard failed:",e));
  },[currentUser]);
  // Les cartes personnelles se révisent avec les trois mêmes méthodes que les
  // cartes officielles. « method » vient du sélecteur de l'onglet Mes cartes ;
  // sans lui, on retombe sur Anki — le comportement d'avant.
  const startUserCardStudy=useCallback((gid,num,chapterId,pkId,method="anki")=>{
    const filtered=userCards.filter(c=>
      c.groupId===gid&&c.num===num&&
      (chapterId===null||c.chapterId===chapterId)&&
      (pkId===null||c.packetId===pkId)
    );
    const {queue,mode}=buildQueueForMethod(filtered,method,prog,settings,jplans);
    if(!queue.length){alert(METHOD_EMPTY_MSG[mode]);return;}
    const grp=GROUPS.find(g=>g.id===gid);
    const chName=chapterId?getChapters(gid,num)[chapterId-1]:"";
    const pkLabel=pkId?PACKETS.find(p=>p.id===pkId)?.label:"Tout";
    const label=`${METHOD_PREFIX[mode]} Personnel · ${grp?.label} · Cours ${num}${chName?" · "+chName:""}${pkLabel?" · "+pkLabel:""}`;
    setStudyCtx({label,queue,mode});
    setView("study");
  },[userCards,prog,settings,jplans]);
  const startPersonalCourseStudy=useCallback((courseName,pkId,method="anki")=>{
    const filtered=userCards.filter(c=>c.personalCourseName===courseName&&(pkId===null||c.packetId===pkId));
    const {queue,mode}=buildQueueForMethod(filtered,method,prog,settings,jplans);
    if(!queue.length){alert(METHOD_EMPTY_MSG[mode]);return;}
    const pkLabel=pkId?PACKETS.find(p=>p.id===pkId)?.label:"Tout";
    setStudyCtx({label:`${METHOD_PREFIX[mode]} Cours perso · ${courseName}${pkLabel?" · "+pkLabel:""}`,queue,mode});
    setView("study");
  },[userCards,prog,settings,jplans]);
  const allCards=useMemo(()=>[
    ...cards,
    ...userCards.filter(c=>c.integrated)
  ],[cards,userCards]);
  const getNewShownToday=useCallback(()=>{
    if(!currentUser||currentUser.role==="admin")return 0;
    return getStats(currentUser.username).days[dateKey()]?.newShown||0;
  },[currentUser]);
  // ─── Préparation d'une session ──────────────────────────────────────────────
  // Avant, on attendait le contenu de TOUTES les cartes avant d'ouvrir la
  // session : sur un paquet illustré, cela représentait plusieurs mégaoctets et
  // de longues secondes d'écran figé. Désormais on ne charge que les premières
  // cartes — de quoi commencer immédiatement — et le reste arrive en arrière-plan
  // pendant que l'étudiant travaille, sans jamais l'interrompre.
  const HEAD_BATCH=8;
  const enrichCards=useCallback(async(queue)=>{
    const need=queue.filter(c=>!c.front);
    const head=need.slice(0,HEAD_BATCH).map(c=>c.id);
    const headContent=head.length?await supa.getCardsContent(head):{};
    // L'adaptation personnelle est posée PAR-DESSUS le contenu officiel, juste
    // après son chargement. La version d'origine reste attachée à la carte, ce
    // qui permet à l'étudiant de la consulter et d'y revenir quand il veut.
    const out=queue
      .map(c=>c.front?c:{...c,...(headContent[c.id]||{front:null,back:null})})
      .map(c=>c.front?applyOverride(c,overrides):c);
    // Les images des deux premières cartes sont décodées AVANT l'ouverture :
    // la première carte s'affiche donc complète, sans transition de chargement.
    try{
      await Promise.all(out.slice(0,2).map(async c=>{
        if(!c.front)return;
        if(isOcclusion(c))await prefetchOcclusionCard(c.front);
        else { prefetchPlainImage(parseContent(c.front).img); prefetchPlainImage(parseContent(c.back).img); }
      }));
    }catch{}
    // Le reste de la file part se charger en arrière-plan dès que la session est
    // ouverte : l'étudiant révise pendant ce temps, et comme le cache est
    // persistant, la prochaine session sur ce paquet s'ouvrira instantanément.
    const rest=out.filter(c=>!c.front).map(c=>c.id);
    if(rest.length)setTimeout(()=>{ supa.getCardsContent(rest).catch(()=>{}); },600);
    return out;
  },[overrides]);
  // ─── Reprise de session ─────────────────────────────────────────────────────
  // Appelé par StudyView à chaque carte notée : on ne garde que les identifiants
  // des cartes restantes, ce qui reste minuscule même sur une session de 500 cartes.
  const persistStudyQueue=useCallback(ids=>{
    if(!currentUser||!studyCtx)return;
    saveStudySession(currentUser.username,studyCtx.label,ids,studyCtx.mode||"anki");
    if(!ids||!ids.length)setResumeInfo(null);
  },[currentUser,studyCtx]);
  // Sortie volontaire de la session : on efface la sauvegarde. C'est ce qui permet
  // de distinguer « j'ai décidé d'arrêter » (rien à reprendre) de « la page a été
  // rechargée ou l'onglet fermé » (la sauvegarde survit et la reprise est proposée).
  const leaveStudy=useCallback(()=>{
    if(currentUser)clearStudySession(currentUser.username);
    setResumeInfo(null);
    setStudyCtx(null);
    setView("dashboard");
  },[currentUser]);
  const resumeStudySession=useCallback(async()=>{
    if(!currentUser)return;
    const saved=getStudySession(currentUser.username);
    if(!saved){setResumeInfo(null);return;}
    const byId={};
    [...allCards,...userCards].forEach(c=>{byId[c.id]=c;});
    // Une carte supprimée entre-temps est simplement ignorée, la reprise n'échoue pas.
    const queue=saved.ids.map(id=>byId[id]).filter(Boolean);
    if(!queue.length){
      clearStudySession(currentUser.username);setResumeInfo(null);
      alert("Les cartes de cette session ne sont plus disponibles.");
      return;
    }
    const full=await enrichCards(queue);
    setStudyCtx({label:saved.label,queue:full,mode:saved.mode||"anki"});
    setView("study");
  },[currentUser,allCards,userCards,enrichCards]);
  const dismissResume=useCallback(()=>{
    if(currentUser)clearStudySession(currentUser.username);
    setResumeInfo(null);
  },[currentUser]);
  const startStudy=useCallback(async(gid,num,chapterId,pkId)=>{
    if(gid==="__user__"){
      const queue=buildQueue(userCards,prog,settings,getNewShownToday(),true);
      if(!queue.length){alert(getEmptyQueueMsg(userCards,prog,settings,getNewShownToday()));return;}
      setStudyCtx({label:"Mes flashcards personnelles",queue});setView("study");return;
    }
    // ─── Garde-fou d'accès ────────────────────────────────────────────────────
    // La restriction ne repose pas seulement sur l'interface : même en forçant
    // l'appel (console, lien direct, état résiduel), un cours non débloqué ne
    // peut pas démarrer. La liste de cartes est en plus refiltrée ci-dessous.
    const isAdminUser=currentUser?.role==="admin";
    const uGroups=currentUser?.plan?.groups||[];
    const uFull=currentUser?.plan?.fullGroups||[];
    const canAccess=(g,n)=>isAdminUser||isCourseAccessible(g,n,uGroups,uFull);
    if(!canAccess(gid,num)){
      alert("Ce cours n'est pas inclus dans ton offre actuelle.\nDébloque-le depuis « Changer d'abonnement » pour y accéder.");
      return;
    }
    const grp=GROUPS.find(g=>g.id===gid);
    if(pkId==="__all__"||pkId==="__course__"){
      const isCourse=pkId==="__course__";
      const filtered=allCards.filter(c=>c.groupId===gid&&c.num===num&&(isCourse||c.chapterId===chapterId)&&canAccess(c.groupId,c.num));
      const queue=buildQueue(filtered,prog,settings,getNewShownToday(),true);
      if(!queue.length){alert(getEmptyQueueMsg(filtered,prog,settings,getNewShownToday()));return;}
      const fullQueue=await enrichCards(queue);
      const chName=!isCourse&&chapterId?getChapters(gid,num)[chapterId-1]:`Ch.${chapterId}`;
      const label=isCourse?`${grp?.label} · Cours ${num} · Cours complet`:`${grp?.label} · Cours ${num} · ${chName} · Tout`;
      setStudyCtx({label,queue:fullQueue});setView("study");return;
    }
    const scopeFiltered=allCards.filter(c=>c.groupId===gid&&c.num===num&&c.chapterId===chapterId&&effPkt(c,prog)===pkId&&canAccess(c.groupId,c.num));
    const queue=buildQueue(scopeFiltered,prog,settings,getNewShownToday(),true);
    if(!queue.length){alert(getEmptyQueueMsg(scopeFiltered,prog,settings,getNewShownToday()));return;}
    const fullQueue=await enrichCards(queue);
    const chName=getChapters(gid,num)[chapterId-1]||`Ch. ${chapterId}`;
    setStudyCtx({label:`${grp?.label} · Cours ${num} · ${chName} · ${PACKETS.find(p=>p.id===pkId)?.label}`,queue:fullQueue});
    setView("study");
  },[allCards,userCards,prog,settings,getNewShownToday,enrichCards,currentUser]);
  // ─── Révision en avance ────────────────────────────────────────────────────
  // Contrairement à startStudy, aucune notion d'échéance n'entre en jeu : la
  // carte est simplement montrée. Le garde-fou d'accès reste identique — un
  // cours non débloqué ne s'ouvre pas plus ici qu'en révision normale.
  const startCramStudy=useCallback(async(gid,num,chapterId,pkId)=>{
    const isAdminUser=currentUser?.role==="admin";
    const uGroups=currentUser?.plan?.groups||[];
    const uFull=currentUser?.plan?.fullGroups||[];
    if(!(isAdminUser||isCourseAccessible(gid,num,uGroups,uFull))){
      alert("Ce cours n'est pas inclus dans ton offre actuelle.\nDébloque-le depuis « Changer d'abonnement » pour y accéder.");
      return;
    }
    const grp=GROUPS.find(g=>g.id===gid);
    const scopeFiltered=allCards.filter(c=>c.groupId===gid&&c.num===num);
    const queue=buildCramQueue(scopeFiltered,prog,{chapterId,packetId:pkId,settings,newShownToday:getNewShownToday()});
    if(!queue.length){alert("Aucune carte dans cette sélection.");return;}
    const fullQueue=await enrichCards(queue);
    const chName=chapterId!=="__all__"?(getChapters(gid,num)[chapterId-1]||`Ch. ${chapterId}`):"Cours complet";
    const pkLabel=pkId&&pkId!=="__all__"?PACKETS.find(p=>p.id===pkId)?.label:"Tous paquets";
    setStudyCtx({label:`🗓️ En avance · ${grp?.label} · Cours ${num} · ${chName} · ${pkLabel}`,queue:fullQueue,cram:true});
    setView("study");
  },[allCards,prog,currentUser,enrichCards,settings,getNewShownToday]);
  const startGlobalStudy=useCallback(async pkId=>{
    const ids=currentUser?.plan?.groups||[];
    const fGroups=currentUser?.plan?.fullGroups||[];
    const isAdminUser=currentUser?.role==="admin";
    const globalFiltered=allCards.filter(c=>ids.includes(c.groupId)&&(!pkId||effPkt(c,prog)===pkId)&&(isAdminUser||isCourseAccessible(c.groupId,c.num,ids,fGroups)));
    // Révision globale : uniquement les cartes déjà passées à maturation (état "révision") et dues, pas de nouvelles cartes.
    const dueReview=globalFiltered.filter(c=>{const p=prog[c.id];return p&&!p.buried&&p.state==="review"&&isDue(p);});
    if(!dueReview.length){alert("Aucune flashcard en attente d'être révisée pour le moment.");return;}
    const sorted=[...dueReview].sort((a,b)=>new Date(prog[a.id].next)-new Date(prog[b.id].next));
    const queue=sorted.slice(0,settings?.maxReviewsPerDay||100);
    const fullQueue=await enrichCards(queue);
    setStudyCtx({label:pkId?`Révision globale · ${PACKETS.find(p=>p.id===pkId)?.label}`:"Révision globale · Toutes",queue:fullQueue});
    setView("study");
  },[allCards,prog,currentUser,settings,enrichCards]);
  // Une carte en attente que la fin du paquet remet en jeu : on lève son report
  // dans la progression, sinon elle resterait comptée « en attente » sur le
  // tableau de bord alors qu'elle vient d'être reproposée.
  const handleJUnsnooze=useCallback(cards=>{
    if(!cards||!cards.length)return;
    setProg(prev=>{
      const next={...prev};
      let touche=false;
      cards.forEach(c=>{
        const e=next[c.id];
        if(e&&e.j&&e.j.snoozeUntil){
          const v={...e,j:{...e.j,snoozeUntil:null}};
          next[c.id]=v; touche=true;
          if(currentUser)supa.upsertProgress(currentUser.username,c.id,v);
        }
      });
      if(touche&&currentUser)storage.set(`mx6-prog-${currentUser.username}`,next);
      return touche?next:prev;
    });
  },[currentUser]);
  // ─── Lancer une session en méthode des J ────────────────────────────────────
  // La sélection est déjà filtrée par le tableau de bord (matière, cours,
  // chapitre, paquet) ; ici on ne garde que les cartes dont un J tombe, en
  // remettant les retards devant.
  const startJStudy=useCallback(async(cardList,label)=>{
    const queue=buildJQueue(cardList,prog,jplans);
    if(!queue.length){alert("Aucun J ne tombe aujourd'hui dans cette sélection.");return;}
    const fullQueue=await enrichCards(queue);
    setStudyCtx({label,queue:fullQueue,mode:"j"});
    setView("study");
  },[prog,jplans,enrichCards]);
  // ─── Lancer une session de révision personnalisée ───────────────────────────
  // Aucune échéance : on prend les cartes les plus fragiles de la sélection.
  const startPersoStudy=useCallback(async(cardList,size,label)=>{
    const queue=buildPersoQueue(cardList,prog,{limit:size||30});
    if(!queue.length){alert("Aucune carte dans cette sélection.");return;}
    const fullQueue=await enrichCards(queue);
    setStudyCtx({label,queue:fullQueue,mode:"perso"});
    setView("study");
  },[prog,enrichCards]);
  const handleRate=useCallback(async(card,rating,elapsedMs=0)=>{
    const existing=prog[card.id]||{};
    // ─── Révision personnalisée ───────────────────────────────────────────────
    // Elle ne reprogramme RIEN : ni l'échéance FSRS, ni le planning de J. La note
    // n'est écrite que dans l'espace .p, qui sert au calcul du taux de maîtrise.
    // Aucun point non plus : les cartes y sont librement répétables.
    if((studyCtx&&studyCtx.mode)==="perso"){
      const merged={...existing,p:persoPush(existing,rating)};
      saveProg({...prog,[card.id]:merged},card.id);
      if(currentUser&&currentUser.role!=="admin"){
        recordStat(currentUser.username,rating>=3,elapsedMs,false);
        recordModeStat(currentUser.username,"perso",rating>=3);
      }
      return merged;
    }
    const wasNew=isNew(existing);
    const np=computeNext(existing,rating,settings);
    const preserved={};
    if(existing.packetOverride)preserved.packetOverride=existing.packetOverride;
    if(existing.buried)preserved.buried=existing.buried;
    // Les états des deux autres méthodes sont recopiés tels quels : une révision
    // Anki ne doit jamais faire bouger un planning de J ni un taux de maîtrise.
    if(existing.j)preserved.j=existing.j;
    if(existing.p)preserved.p=existing.p;
    // Date de premiere decouverte : sert au calcul de l'anciennete (points).
    const firstSeen=existing.firstSeen||new Date().toISOString();
    saveProg({...prog,[card.id]:{...np,...preserved,firstSeen}},card.id);
    let gain=null;
    if(currentUser&&currentUser.role!=="admin"){
      recordStat(currentUser.username,rating>=3,elapsedMs,wasNew);
      recordModeStat(currentUser.username,"anki",rating>=3);
      // Gamification : n'influence en rien l'algorithme ci-dessus.
      gain=awardPoints(currentUser.username,card.id,existing,np,effPkt(card,prog));
      if(gain){setPointsTick(t=>t+1);syncDailyPoints(currentUser.username);}
    }
    return gain?{...np,__gain:gain}:np;
  },[prog,saveProg,settings,currentUser,syncDailyPoints,studyCtx]);
  // ─── Méthode des J : enregistrement d'un geste de session ───────────────────
  // Seul « validate » coche le J suivant et fait sortir la carte de la journée.
  // Les autres gestes n'écrivent qu'un report et une trace dans l'historique :
  // l'échéance du mode Anki n'est jamais touchée.
  const handleJAction=useCallback(async(card,action,mins=0,elapsedMs=0)=>{
    const existing=prog[card.id]||{};
    const plan=jPlanFor(jplans,card.groupId,card.num,card.chapterId,effPkt(card,prog));
    const info=jDueInfo(existing,plan);
    const late=info.late||0;
    const jNew=action==="validate"
      ? jAdvance(existing,plan,late)
      : jDelay(existing,plan,action==="delay"?mins:0,late);
    const merged={...existing,j:jNew};
    saveProg({...prog,[card.id]:merged},card.id);
    let gain=null;
    if(currentUser&&currentUser.role!=="admin"){
      recordStat(currentUser.username,action==="validate",elapsedMs,false);
      recordModeStat(currentUser.username,"j",action==="validate");
      if(action==="validate"){
        gain=awardJPoints(currentUser.username,card.id,info.j||0,effPkt(card,prog));
        if(gain){setPointsTick(t=>t+1);syncDailyPoints(currentUser.username);}
      }
    }
    return gain?{...merged,__gain:gain}:merged;
  },[prog,saveProg,jplans,currentUser,syncDailyPoints]);
  // ─── Retour à la carte précédente ───────────────────────────────────────────
  // Annule complètement la dernière notation : la progression FSRS revient à son
  // état exact d'avant (y compris « jamais vue »), les points du jour gagnés sur
  // cette carte sont retirés du classement, et les statistiques sont corrigées.
  // La carte redevient notable : si elle est renotée, elle peut de nouveau
  // rapporter des points — une seule fois, comme la règle anti-farming l'impose.
  const handleUndoRate=useCallback((snapshot)=>{
    if(!snapshot||!snapshot.cardId)return null;
    const {cardId,prevProg,gain,elapsedMs,wasCorrect,wasNew}=snapshot;
    setProg(prev=>{
      const next={...prev};
      // prevProg vaut undefined si la carte n'avait jamais été vue : on la
      // retire alors complètement pour qu'elle redevienne « Nouveau ».
      if(prevProg===undefined||prevProg===null)delete next[cardId];
      else next[cardId]=prevProg;
      if(currentUser)storage.set(`mx6-prog-${currentUser.username}`,next);
      return next;
    });
    if(currentUser){
      if(prevProg===undefined||prevProg===null){
        supa.deleteProgressBatch(currentUser.username,[cardId]).catch(()=>{});
      } else {
        supa.upsertProgress(currentUser.username,cardId,prevProg);
      }
    }
    let revoked=null;
    if(currentUser&&currentUser.role!=="admin"){
      revokeStat(currentUser.username,wasCorrect,elapsedMs,wasNew);
      if(gain){
        revoked=revokePoints(currentUser.username,cardId);
        setPointsTick(t=>t+1);
        syncDailyPoints(currentUser.username);
      }
    }
    return revoked;
  },[currentUser,syncDailyPoints]);
  const handleBury=useCallback((card)=>{
    const existing=prog[card.id]||{};
    saveProg({...prog,[card.id]:{...existing,buried:true}},card.id);
  },[prog,saveProg]);
  const handleUnbury=useCallback((cardId)=>{
    const existing=prog[cardId]||{};
    const {buried:_,...rest}=existing;
    saveProg({...prog,[cardId]:rest},cardId);
  },[prog,saveProg]);
  const handleChangePacket=useCallback((card,newPktId)=>{
    const existing=prog[card.id]||{};
    if(newPktId===card.packetId){
      const {packetOverride:_,...rest}=existing;
      saveProg({...prog,[card.id]:rest},card.id);
    } else {
      saveProg({...prog,[card.id]:{...existing,packetOverride:newPktId}},card.id);
    }
  },[prog,saveProg]);
  // Les vues sont rendues via cette fonction plutôt que par des `return` directs,
  // afin de pouvoir superposer le bandeau « nouvelle version » à n'importe laquelle
  // d'entre elles sans le dupliquer dix fois.
  const renderView=()=>{
  if(view==="loading") return <div style={{fontFamily:font,background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
    <img src={LANDING_LOGO} style={{height:44,width:"auto"}} alt="MyFlashCard"/>
    <p style={{fontFamily:serif,fontSize:28,letterSpacing:-0.5}}>MyFlashcard</p>
    <p style={{color:C.textLt,fontSize:13,display:"flex",alignItems:"center",gap:3}}>Chargement<span style={{animation:"dotPulse 1.4s infinite",animationDelay:"0s"}}>.</span><span style={{animation:"dotPulse 1.4s infinite",animationDelay:"0.2s"}}>.</span><span style={{animation:"dotPulse 1.4s infinite",animationDelay:"0.4s"}}>.</span></p>
    {supaError&&<div style={{marginTop:12,maxWidth:400,background:"var(--c-dangerBg)",border:"1px solid #fca5a5",borderRadius:10,padding:"16px 20px",textAlign:"center"}}>
      <p style={{fontSize:14,fontWeight:600,color:"var(--c-danger)",margin:"0 0 8px"}}>⚠️ Supabase ne répond pas</p>
      <p style={{fontSize:12,color:"var(--c-dangerDeep)",margin:"0 0 12px",lineHeight:1.6}}>Erreur : <code>{supaError}</code><br/>Ton projet Supabase est peut-être <strong>en pause</strong> (plan gratuit).</p>
      <a href="https://supabase.com/dashboard" target="_blank" style={{fontFamily:font,fontSize:12,fontWeight:600,padding:"8px 16px",borderRadius:6,background:"var(--c-danger)",color:"var(--c-onSolid)",textDecoration:"none",display:"inline-block"}}>→ Ouvrir Supabase Dashboard</a>
      <p style={{fontSize:11,color:"var(--c-dangerDeep)",margin:"10px 0 0"}}>Cherche "Restore project" ou "Unpause" sur ton projet.</p>
    </div>}
  </div>;
  if(view==="landing")   return <Landing onBack={()=>setView("login")} onRegister={()=>setView("register")} theme={theme} onToggleTheme={toggleTheme}/>;
  if(view==="login")     return <LoginView onLogin={handleLogin} onShowLanding={()=>setView("landing")} onRegister={()=>setView("register")} accounts={accounts} theme={theme} onToggleTheme={toggleTheme} onPasswordReset={(em,pwd)=>setAccounts(p=>p.map(a=>a.username===em?{...a,password:pwd}:a))}/>;
  if(view==="register")  return <RegisterView onRegister={acc=>{handleRegister(acc);setView("dashboard");}} onBack={()=>setView("login")} accounts={accounts}/>;
  if(userCardEditor!==null&&currentUser?.role!=="admin")return <CardEditor key={userCardKey} card={userCardEditor||null} onSave={handleSaveUserCard} onCancel={()=>setUserCardEditor(null)} userGroups={currentUser?.plan?.groups||[]} officialCards={cards} userCards={userCards} theme={theme} onToggleTheme={toggleTheme}/>;
  if(view==="dashboard"&&currentUser) return <Dashboard currentUser={currentUser} cards={cards} userCards={userCards} progress={prog} settings={settings} onStudy={startStudy} onStudyCram={startCramStudy} onGlobalStudy={startGlobalStudy} onAdmin={()=>setView("admin")} onSettings={()=>setView("settings")} onLogout={logout} onNewUserCard={()=>setUserCardEditor(false)} onEditUserCard={c=>setUserCardEditor(c)} onDeleteUserCard={handleDeleteUserCard} onToggleIntegration={handleToggleIntegration} onStudyUser={startUserCardStudy} onStudyPersonal={startPersonalCourseStudy} onUnbury={handleUnbury} allCards={allCards} paymentStatus={paymentStatus} onClosePaymentBanner={()=>setPaymentStatus(null)} pointsTick={pointsTick} pseudo={pseudo||getPseudo(currentUser.username)} theme={theme} onToggleTheme={toggleTheme} resumeInfo={resumeInfo} onResume={resumeStudySession} onDismissResume={dismissResume} studyMode={studyMode} onChangeMode={changeStudyMode} jplans={jplans} onSaveJPlan={handleSaveJPlan} onStudyJ={startJStudy} onStudyPerso={startPersoStudy} promo={promo}/>;
  if(view==="study"&&studyCtx) return <StudyView label={studyCtx.label} queue={studyCtx.queue} cram={!!studyCtx.cram} mode={studyCtx.mode||"anki"} jplans={jplans} onJAction={handleJAction} onJUnsnooze={handleJUnsnooze} onRate={handleRate} onBury={handleBury} onChangePacket={handleChangePacket} onDeleteUserCard={handleDeleteOwnCardFromStudy} onSaveOverride={handleSaveOverride} onResetOverride={handleResetOverride} overrides={overrides} onBack={leaveStudy} settings={settings} isAdmin={currentUser?.role==="admin"} progress={prog} theme={theme} onToggleTheme={toggleTheme} onUndo={handleUndoRate} onQueueChange={persistStudyQueue}/>;
  if(view==="admin")     return <AdminView cards={cards} accounts={accounts} onSaveCard={handleSaveCard} onDeleteCard={handleDeleteCard} onSaveUser={handleSaveUser} onDeleteUser={handleDeleteUser} onSortCards={handleBatchSortCards} onBack={()=>setView("dashboard")} theme={theme} onToggleTheme={toggleTheme}/>;
  if(view==="settings")  return <SettingsView settings={settings} onSave={saveSet} onBack={()=>setView("dashboard")} currentUser={currentUser} accounts={accounts} cards={cards} onResetProgress={handleResetProgress} onDeleteAccount={handleDeleteAccount} pseudo={pseudo||getPseudo(currentUser?.username)} onSavePseudo={savePseudo} theme={theme} onToggleTheme={toggleTheme}/>;
  return null;
  };
  if(recoveryMode)return <ResetPasswordView onDone={()=>{ setRecoveryMode(false); setView("login"); }}/>;
  return <>
    {renderView()}
    {needCgu&&<CguGateModal onAccepted={()=>setNeedCgu(false)} onLogout={logout}/>}
    {sessionExpired&&<SessionExpiredModal onReconnect={async()=>{ try{await sb.auth.signOut();}catch{} storage.del("mx6-session"); window.location.reload(); }}/>}
    {updateReady&&!updateDismissed&&<UpdateBanner
      pending={pendingSaves}
      onDismiss={()=>setUpdateDismissed(true)}
      onReload={()=>{ if(pendingSavesRef.current>0)return; window.location.reload(); }}
    />}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
