    /* Le basculement se fait en douceur, sans animer les changements de position */

    /* ─── Système responsive ───────────────────────────────────────────────
       L'application est stylée en inline-styles ; ces classes utilitaires
       apportent les points de rupture que les styles inline ne peuvent pas
       exprimer. Breakpoints : mobile < 640px · tablette 640-1024px · desktop.
       Le mobile est traité en priorité (les règles desktop sont les valeurs
       inline par défaut, surchargées ici vers le bas).                      */

    html { -webkit-text-size-adjust: 100%; }
    /* « clip » et non « hidden » : overflow-x:hidden ferait du body un conteneur
       de défilement, ce qui casserait la barre de navigation en position sticky.
       clip empêche le défilement latéral sans créer ce conteneur.             */
    body { overflow-x: clip; }
    /* Rien ne doit jamais déborder horizontalement */
    img, svg, canvas, video { max-width: 100%; }

    /* ─── Zoom automatique iOS ──────────────────────────────────────────────
       Safari sur iPhone zoome AUTOMATIQUEMENT dès qu'on tape dans un champ dont
       la police fait moins de 16px, et ce zoom reste ensuite actif : la page
       paraît agrandie et défile latéralement. Les champs du site étaient en 14px
       (et certains sélecteurs en 12px), d'où le zoom subi à la connexion.
       On impose donc 16px sur mobile pour TOUS les champs de saisie.
       Le pincer-pour-zoomer reste possible : on ne désactive pas le zoom manuel,
       on supprime seulement le zoom involontaire.                             */
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
      /* Le champ de code de vérification garde sa police déjà plus grande */
      input[inputmode="numeric"] { font-size: 28px !important; }
    }

    /* Conteneur principal : marges qui se resserrent sur petit écran */
    .mfc-page { padding-left: 24px; padding-right: 24px; }
    @media (max-width: 640px) { .mfc-page { padding-left: 14px; padding-right: 14px; } }

    /* Barre de navigation : passe en colonne centrée sur mobile */
    @media (max-width: 640px) {
      .mfc-nav { flex-wrap: wrap; gap: 8px; padding: 10px 14px !important; }
      .mfc-nav > * { min-width: 0; }
      .mfc-nav-center { display: none; }
    }

    /* Grilles de 4 colonnes (révision globale, boutons de notation) */
    @media (max-width: 640px) { .mfc-grid-4 { grid-template-columns: repeat(2, 1fr) !important; } }

    /* Éditeur de carte, sur ordinateur : la saisie à gauche, le panneau de
       classification à droite. Le panneau reste collant et défile avec la page,
       et devient lui-même défilant si la liste des chapitres est longue.
       L'ordre du HTML n'est pas modifié — seul le placement en grille l'est —
       pour que l'empilement mobile ci-dessous continue de fonctionner.       */
    /* Éditeur de carte, dès qu'il y a deux colonnes (ordinateur ET écran
       divisé) : la saisie à gauche, et à droite un bandeau collant qui suit le
       défilement, avec l'ORDRE D'IMPORTANCE tout en haut. C'est le réglage le
       plus souvent modifié : il doit rester atteignable sans faire défiler.
       Le bandeau défile de lui-même si son contenu dépasse l'écran.          */
    .mfc-editor-packet { flex-shrink: 0; }
    .mfc-editor-side { flex-shrink: 0; }
    @media (min-width: 641px) {
      .mfc-editor-main { grid-column: 1; grid-row: 1; }
      .mfc-editor-rail { grid-column: 2; grid-row: 1; position: sticky; top: 72px;
                         max-height: calc(100vh - 96px); overflow-y: auto; overscroll-behavior: contain; }
    }
    /* Écran divisé : bandeau resserré, mais l'ordre d'importance reste visible. */
    @media (min-width: 641px) and (max-width: 900px) {
      .mfc-editor-grid { grid-template-columns: minmax(0,1fr) 186px !important; }
      .mfc-occlusion-grid { grid-template-columns: 1fr !important; }
    }
    /* Téléphone : tout empilé, la saisie d'abord — comportement inchangé. */
    @media (max-width: 640px) {
      .mfc-editor-grid { grid-template-columns: 1fr !important; }
      .mfc-occlusion-grid { grid-template-columns: 1fr !important; }
      .mfc-editor-main { order: 1; }
      .mfc-editor-rail { order: 2; position: static !important; max-height: none; overflow: visible; }
    }

    /* Barres d'onglets : défilement horizontal plutôt que chevauchement */
    .mfc-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 640px) {
      .mfc-tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
      .mfc-tabs::-webkit-scrollbar { display: none; }
      .mfc-tabs > button { flex: 0 0 auto; padding-left: 14px !important; padding-right: 14px !important; }
    }

    /* Cartes de statistiques : minimum plus petit sur mobile */
    @media (max-width: 640px) {
      .mfc-autofill { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)) !important; }
    }

    /* Bandeau d'abonnement : le bouton passe sous le libellé sur mobile,
       au lieu de chevaucher le badge « Gratuit ».                            */
    @media (max-width: 640px) {
      .mfc-planbar { align-items: stretch !important; }
      .mfc-planbtn { width: 100%; }
    }

    /* Zone de révision : la carte occupe toute la largeur utile sur mobile */
    @media (max-width: 640px) {
      .mfc-study { padding: 16px 14px !important; }
      .mfc-rate-grid { gap: 6px !important; }
      .mfc-rate-grid button { padding: 12px 4px !important; }
    }

    /* Page d'accueil : titres et statistiques adaptés */
    @media (max-width: 640px) {
      .mfc-hero-title { font-size: 27px !important; }
      .mfc-hero-sub { font-size: 14.5px !important; }
      .mfc-hero-stats { gap: 18px !important; }
      /* Les sections de la page d'accueil alternent numéro à gauche / à droite
         sur ordinateur. Empilées sur mobile, cette alternance plaçait un numéro
         sur deux SOUS le texte. « order:-1 » le remet systématiquement en haut,
         sans toucher à l'ordre du HTML ni à la mise en page sur ordinateur.   */
      .mfc-arg-row { flex-direction: column !important; gap: 6px !important; }
      .mfc-arg-num { flex: 0 0 auto !important; justify-content: flex-start !important; order: -1 !important; }
      .mfc-arg-num > span { font-size: 26px !important; line-height: 1 !important; }
    }

    /* Modales : plein écran utile sur mobile, jamais de débordement */
    @media (max-width: 640px) {
      .mfc-modal { width: 100% !important; padding: 22px 16px !important; max-height: 88vh; }
    }

    /* Éléments tactiles : cible minimale confortable */
    @media (hover: none) and (pointer: coarse) {
      button, .mfc-tabs > button { touch-action: manipulation; }
    }

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
// ─── Supabase ────────────────────────────────────────────────────────────────
// Le classement public (onglet Rang) utilise la table optionnelle "daily_points".
// SQL à exécuter séparément dans Supabase : voir le fichier supabase_daily_points.sql
const SUPA_URL = "https://cytdlgvtwvofwrgqnkhe.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5dGRsZ3Z0d3ZvZndyZ3Fua2hlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTU4MTIsImV4cCI6MjA5NDU5MTgxMn0.QLQrzrkAjDjEY1x0VJwMguteUYdcGJ_pREX03VElyOs";
const EDGE_URL = `${SUPA_URL}/functions/v1`;
const H = { "Content-Type":"application/json", "apikey":SUPA_KEY, "Authorization":`Bearer ${SUPA_KEY}` };
const supa = {
  // Load metadata only — NO front/back. Fast even for 100k cards.
  // First page tells us the total count (Prefer: count=exact), then every
  // remaining page is fetched in parallel instead of one-by-one.
  getCardsMeta: async () => {
    const BATCH=1000; // metadata rows are tiny (~100 bytes each)
    const base=`${SUPA_URL}/rest/v1/cards?select=id,group_id,num,chapter_id,packet_id,sort_order,card_type`;
    try {
      const first=await fetch(`${base}&limit=${BATCH}&offset=0`,{headers:{...H,"Prefer":"count=exact"}});
      const firstData=await first.json();
      if(!first.ok||!Array.isArray(firstData))return null;
      let total=firstData.length;
      const range=first.headers.get("content-range"); // "0-999/3456"
      if(range&&range.includes("/")){const t=parseInt(range.split("/")[1],10);if(!isNaN(t))total=t;}
      let allRows=firstData;
      if(total>firstData.length){
        const offsets=[];
        for(let off=BATCH;off<total;off+=BATCH)offsets.push(off);
        const pages=await Promise.all(offsets.map(off=>
          fetch(`${base}&limit=${BATCH}&offset=${off}`,{headers:H}).then(r=>r.json()).catch(()=>[])
        ));
        pages.forEach(rows=>{if(Array.isArray(rows))allRows=allRows.concat(rows);});
      }
      return allRows.map(c=>({id:c.id,groupId:c.group_id,num:c.num,chapterId:c.chapter_id||1,packetId:c.packet_id,sort_order:c.sort_order??null,card_type:c.card_type||'text',front:null,back:null}));
    } catch(e){console.warn("getCardsMeta error:",e);return null;}
  },
  // Load front+back for specific card IDs only (called when starting a study session).
  // All chunks are fetched in parallel rather than awaited one after another.
  getCardsContent: async (ids) => {
    if(!ids||ids.length===0)return {};
    const CHUNK=100; // PostgREST URL length limit
    const result={};
    try {
      const chunks=[];
      for(let i=0;i<ids.length;i+=CHUNK)chunks.push(ids.slice(i,i+CHUNK));
      await Promise.all(chunks.map(async chunk=>{
        const idList=chunk.map(id=>`"${id}"`).join(',');
        const r=await fetch(`${SUPA_URL}/rest/v1/cards?select=id,front,back&id=in.(${idList})`,{headers:H});
        const d=await r.json();
        if(r.ok&&Array.isArray(d))d.forEach(c=>{result[c.id]={front:c.front,back:c.back};});
      }));
    } catch(e){console.warn("getCardsContent error:",e);}
    return result;
  },
  getCards: async () => { return null; }, // deprecated — use getCardsMeta
  upsertCard: async (card) => {
    const r=await fetch(`${SUPA_URL}/rest/v1/cards`, {
      method:"POST", headers:{...H,"Prefer":"resolution=merge-duplicates"},
      body: JSON.stringify({ id:card.id, front:card.front, back:card.back, group_id:card.groupId, num:card.num, chapter_id:card.chapterId||1, packet_id:card.packetId, sort_order:card.sort_order??0, card_type:card.card_type||'text' }),
    });
    if(!r.ok){
      let msg=`HTTP ${r.status}`;
      try{const t=await r.text();if(t)msg+=` — ${t}`;}catch{}
      throw new Error(msg);
    }
  },
  batchUpdateSort: async (updates) => {
    // All PATCH requests fire in parallel — Supabase/PostgREST handles this fine,
    // and the browser's HTTP/2 connection to it multiplexes them anyway.
    await Promise.all(updates.map(async({id,sort_order})=>{
      try{
        const r=await fetch(`${SUPA_URL}/rest/v1/cards?id=eq.${encodeURIComponent(id)}`,{
          method:"PATCH",headers:{...H,"Prefer":"return=minimal"},
          body:JSON.stringify({sort_order})
        });
        if(!r.ok){const t=await r.text();console.warn(`sort_order PATCH failed ${id}:`,t);}
      }catch(e){console.warn(`sort_order PATCH error ${id}:`,e);}
    }));
  },
  deleteCard: async (id) => { try { await fetch(`${SUPA_URL}/rest/v1/cards?id=eq.${id}`,{method:"DELETE",headers:H}); } catch {} },
  // ─── Enregistrement groupé des cartes ──────────────────────────────────────
  // PostgREST accepte un tableau : on envoie donc UNE requête pour tout un lot
  // au lieu d'une requête par carte. Les lots sont découpés pour rester sous les
  // limites de taille, et chaque envoi est retenté en cas d'échec passager.
  upsertCardsBatch: async (cards, {chunkSize=20, attempts=3, onProgress}={}) => {
    const rows=cards.map(card=>({ id:card.id, front:card.front, back:card.back, group_id:card.groupId,
      num:card.num, chapter_id:card.chapterId||1, packet_id:card.packetId,
      sort_order:card.sort_order??0, card_type:card.card_type||'text' }));
    const chunks=[];
    for(let i=0;i<rows.length;i+=chunkSize)chunks.push(rows.slice(i,i+chunkSize));
    let done=0;
    for(const chunk of chunks){
      let lastErr=null, ok=false;
      for(let a=1;a<=attempts;a++){
        try{
          const r=await fetch(`${SUPA_URL}/rest/v1/cards`,{
            method:"POST", headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},
            body:JSON.stringify(chunk),
          });
          if(r.ok){ ok=true; break; }
          let msg=`HTTP ${r.status}`;
          try{const t=await r.text();if(t)msg+=` — ${t.slice(0,200)}`;}catch{}
          lastErr=new Error(msg);
        }catch(e){ lastErr=e; }
        // Attente progressive : 0,6 s puis 1,8 s. Absorbe les coupures brèves.
        if(a<attempts)await new Promise(res=>setTimeout(res,600*Math.pow(3,a-1)));
      }
      if(!ok)throw lastErr||new Error("Enregistrement impossible");
      done+=chunk.length;
      if(onProgress)onProgress(done,rows.length);
    }
  },
  // Vérifie lesquelles de ces cartes sont RÉELLEMENT présentes côté serveur.
  // Sert après un échec : on ne retire de l'affichage que celles qui manquent
  // vraiment, au lieu de tout supprimer par précaution.
  checkCardsExist: async (ids) => {
    const found=new Set();
    const CHUNK=100;
    for(let i=0;i<ids.length;i+=CHUNK){
      const slice=ids.slice(i,i+CHUNK);
      try{
        const list=slice.map(id=>`"${id}"`).join(',');
        const r=await fetch(`${SUPA_URL}/rest/v1/cards?select=id&id=in.(${list})`,{headers:H});
        if(!r.ok)continue;
        const d=await r.json();
        if(Array.isArray(d))d.forEach(c=>found.add(c.id));
      }catch{}
    }
    return found;
  },
  // ─── Images d'occlusion mutualisées (table optionnelle « occlusion_images ») ─
  // Une image d'occlusion génère souvent 7 à 20 cartes. La stocker dans chaque
  // carte multipliait son poids d'autant. Elle est désormais enregistrée UNE
  // seule fois, et les cartes n'en gardent qu'une référence.
  upsertOcclusionImage: async (id, dataUrl, attempts=3) => {
    let lastErr=null;
    for(let a=1;a<=attempts;a++){
      try{
        const r=await fetch(`${SUPA_URL}/rest/v1/occlusion_images`,{
          method:"POST", headers:{...H,"Prefer":"resolution=merge-duplicates,return=minimal"},
          body:JSON.stringify([{id,data:dataUrl,created_at:new Date().toISOString()}]),
        });
        if(r.ok)return true;
        // 404 / 42P01 : la table n'existe pas encore → repli sur l'ancien format.
        if(r.status===404)return false;
        let msg=`HTTP ${r.status}`;
        try{const t=await r.text();if(t){ if(/does not exist|42P01|PGRST205/i.test(t))return false; msg+=` — ${t.slice(0,200)}`; }}catch{}
        lastErr=new Error(msg);
      }catch(e){ lastErr=e; }
      if(a<attempts)await new Promise(res=>setTimeout(res,600*Math.pow(3,a-1)));
    }
    throw lastErr||new Error("Enregistrement de l'image impossible");
  },

  getProgress: async (username) => {
    // Same pattern as getCardsMeta: first page gives the total count, then every
    // remaining page is fetched in parallel.
    const BATCH=1000;
    const base=`${SUPA_URL}/rest/v1/progress?username=eq.${encodeURIComponent(username)}&select=card_id,data`;
    try {
      const first=await fetch(`${base}&limit=${BATCH}&offset=0`,{headers:{...H,"Prefer":"count=exact"}});
      if(!first.ok)throw new Error(`HTTP ${first.status}`);
      const firstRows=await first.json();
      if(!Array.isArray(firstRows))throw new Error("Unexpected response");
      let total=firstRows.length;
      const range=first.headers.get("content-range");
      if(range&&range.includes("/")){const t=parseInt(range.split("/")[1],10);if(!isNaN(t))total=t;}
      let all=firstRows;
      if(total>firstRows.length){
        const offsets=[];
        for(let off=BATCH;off<total;off+=BATCH)offsets.push(off);
        const pages=await Promise.all(offsets.map(off=>
          fetch(`${base}&limit=${BATCH}&offset=${off}`,{headers:H}).then(r=>r.json()).catch(()=>[])
        ));
        pages.forEach(rows=>{if(Array.isArray(rows))all=all.concat(rows);});
      }
      const prog={};
      all.forEach(row=>{ try{ prog[row.card_id]=typeof row.data==="string"?JSON.parse(row.data):row.data; }catch{} });
      return prog;
    } catch(e){ console.error("getProgress failed:",e); return null; }
  },

// À INCRÉMENTER À CHAQUE MISE EN LIGNE, en même temps que le fichier version.json

// leur propre version à celle du serveur : si elles diffèrent, un bandeau discret

const APP_VERSION="2026-08-09-2";

// ─── Reprise de session de révision ───────────────────────────────────────────
// La progression de chaque carte part déjà en base à la notation. Ce qui manquait,
// c'est la FILE en cours : elle ne vivait qu'en mémoire, donc un rechargement (ou
// un onglet fermé par erreur) renvoyait l'étudiant au tableau de bord. On mémorise
// donc uniquement les IDENTIFIANTS des cartes restantes — jamais leur contenu, qui
// peut peser plusieurs Mo avec les images d'occlusion et saturerait localStorage.
// Les cartes sont reconstruites depuis la base au moment de la reprise.
const STUDY_KEY=u=>`mx6-studysession-${u}`;
const STUDY_MAX_AGE=12*3600*1000; // au-delà de 12 h, la session est considérée abandonnée
const saveStudySession=(u,label,ids)=>{
  if(!u)return;
  try{
    if(!ids||!ids.length){localStorage.removeItem(STUDY_KEY(u));return;}
    localStorage.setItem(STUDY_KEY(u),JSON.stringify({label,ids,ts:Date.now()}));
  }catch{}
};
const getStudySession=u=>{
  if(!u)return null;
  try{
    const v=JSON.parse(localStorage.getItem(STUDY_KEY(u))||"null");
    if(!v||!Array.isArray(v.ids)||!v.ids.length)return null;
    if(Date.now()-(v.ts||0)>STUDY_MAX_AGE){localStorage.removeItem(STUDY_KEY(u));return null;}
    return v;
  }catch{ return null; }
};
const clearStudySession=u=>{ if(!u)return; try{ localStorage.removeItem(STUDY_KEY(u)); }catch{} };
// ─── Thème clair / sombre ─────────────────────────────────────────────────────
// Le thème est appliqué en posant data-theme sur <html> : toutes les couleurs
// passant par des variables CSS, un seul attribut repeint l'application entière.
// Mémorisé par utilisateur ; au tout premier lancement on suit la préférence
// système du téléphone ou de l'ordinateur.
const THEME_KEY="mx6-theme";
const systemPrefersDark = () => { try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch { return false; } };
const getStoredTheme = () => { try { const v=localStorage.getItem(THEME_KEY); return v==="dark"||v==="light"?v:null; } catch { return null; } };

// Appliqué immédiatement, avant le premier rendu, pour éviter tout flash blanc.

// ─── Pseudonymes ──────────────────────────────────────────────────────────────
// Disponible pour TOUS les utilisateurs (étudiants comme administrateurs).
// Utilisé partout où un nom doit être affiché (forum, classement, tableau de
// bord). Par défaut, dérivé du nom d'utilisateur — comme avant — tant que
// personne n'a choisi de pseudo personnalisé dans les Réglages.
const PSEUDO_MAX=10;
// Le pseudo par défaut est lui aussi tronqué à 10 caractères, pour que l'affichage
// reste cohérent partout, y compris pour les comptes qui n'en ont jamais choisi.
const defaultPseudo = username => !username ? "" : (String(username).includes("@") ? String(username).split("@")[0] : String(username)).slice(0,PSEUDO_MAX);
const getPseudo = username => { if(!username)return ""; try{ return (localStorage.getItem(`mx6-pseudo-${username}`)||"").slice(0,PSEUDO_MAX) || defaultPseudo(username); }catch{ return defaultPseudo(username); } };

// ─── Individual purchase persistence ─────────────────────────────────────────
const getExtraGroups = u => { try { return JSON.parse(localStorage.getItem(`mx6-extra-${u}`) || "[]"); } catch { return []; } };
const saveExtraGroups = (u, gs) => { try { localStorage.setItem(`mx6-extra-${u}`, JSON.stringify([...new Set(gs)])); } catch {} };
const toSubscriptionPlan = pid => ["sem1","sem2","both","prerentree"].includes(pid) ? pid : "prerentree";
// ─── Droits d'accès ───────────────────────────────────────────────────────────
// Deux notions DISTINCTES, à ne jamais confondre :
//
//  · groups     → matières VISIBLES sur le tableau de bord. Contient toujours les
//                 5 matières offertes, car tout le monde y a droit au cours 1.
//  · paidGroups → matières RÉELLEMENT PAYÉES, seules à donner accès aux cours 2+.
//
// Un abonnement actif ("sem1"/"sem2"/"both") ou l'achat d'une matière à l'unité
// alimente paidGroups. Le plan gratuit ("prerentree") n'y ajoute jamais rien.
const isPaidPlan = planId => ["sem1","sem2","both"].includes(planId);
const computeGroups = (subscriptionPlanId, supaGroups, extraGroups) => {
  const basePlan = PLANS.find(p => p.id === subscriptionPlanId);
  const baseGroups = basePlan?.groups || [];
  return [...new Set([...FREE_GROUP_IDS, ...baseGroups, ...(supaGroups||[]), ...(extraGroups||[])])];
};
// Accès COMPLET (tous les cours d'une matière). N'accepte QUE des droits payants :
// le second argument doit être la liste des matières achetées, jamais la colonne
// "groups" de Supabase (qui contient aussi les matières offertes).
const computeFullGroups = (subscriptionPlanId, paidGroups, extraGroups) => {
  const basePlan = PLANS.find(p => p.id === subscriptionPlanId);
  const fullBase = isPaidPlan(subscriptionPlanId) ? (basePlan?.groups || []) : [];
  return [...new Set([...fullBase, ...(paidGroups||[]), ...(extraGroups||[])])];
};
// Reconstitue les matières payées d'un compte, de façon fiable et rétro-compatible.
// C'est LE point d'entrée unique : tous les chemins (connexion, rechargement,
// synchronisation différée) doivent passer par ici pour rester cohérents.
//
//  1. accounts.paid_groups → source de vérité si la colonne existe ;
//  2. sinon, repli hérité : accounts.groups PRIVÉ des matières offertes. Cela
//     restitue tous les achats de matières non gratuites déjà effectués, sans
//     jamais accorder d'accès complet aux 5 matières offertes ;
//  3. les achats mémorisés localement (mx6-extra-*) sont toujours ajoutés, ce qui
//     couvre l'achat d'une matière pourtant offerte (ex. Biophysique) — cas que
//     le repli hérité ne peut pas deviner.
const derivePaidGroups = (acc, username) => {
  const planId = toSubscriptionPlan(acc?.plan_id || acc?.planId);
  const planGroups = isPaidPlan(planId) ? (PLANS.find(p => p.id === planId)?.groups || []) : [];
  const explicit = Array.isArray(acc?.paid_groups) ? acc.paid_groups : null;
  const legacy = explicit === null
    ? (Array.isArray(acc?.groups) ? acc.groups : []).filter(g => !FREE_GROUP_IDS.includes(g))
    : explicit;
  const local = username ? getExtraGroups(username) : [];
  return [...new Set([...planGroups, ...legacy, ...local])];
};
// Un cours est accessible si la matière est payée (accès complet), ou si c'est le
// cours 1 d'une des matières offertes. La Biostatistique n'étant pas dans
// FREE_GROUP_IDS, aucun de ses cours n'est offert.
const isCourseAccessible = (groupId, num, userGroups, fullGroups) => {
  if ((fullGroups||[]).includes(groupId)) return true;
  if (num === 1 && FREE_GROUP_IDS.includes(groupId) && (userGroups||[]).includes(groupId)) return true;
  return false;
};

// Plafond du temps comptabilisé pour une carte. Si l'étudiant laisse une carte

const MAX_CARD_SECONDS = 60;
const cappedCardSeconds = elapsedMs => Math.min(Math.max(0,Math.round((elapsedMs||0)/1000)), MAX_CARD_SECONDS);
const recordStat = (username, correct, elapsedMs, isNewCard=false) => {
  if(!username)return;
  const st = getStats(username);
  const key = dateKey();
  const secs = cappedCardSeconds(elapsedMs);
  if(!st.days[key]) st.days[key] = {cards:0,correct:0,seconds:0,newShown:0};
  st.days[key].cards++;
  if(correct) st.days[key].correct++;
  st.days[key].seconds += secs;
  if(isNewCard) st.days[key].newShown=(st.days[key].newShown||0)+1;
  st.total.cards++;
  if(correct) st.total.correct++;
  st.total.seconds += secs;
  saveStats(username, st);
};
const computeStreak = (days) => {
  let streak=0;
  const today=dateKey();
  const yesterday=dateKey(new Date(Date.now()-86400000));
  let cur=new Date(days[today]?.cards>0?today:yesterday);
  if(!days[dateKey(cur)]?.cards)return 0;
  while(true){const k=dateKey(cur);if(!days[k]?.cards)break;streak++;cur=new Date(cur.getTime()-86400000);}
  return streak;
};

  if(s<60)return `${s}s`;

  return `${h}h ${m}min`;
};

// Valeur de base selon l'ancienneté de la carte
const AGE_VALUES = {new:10, young:6, mid:3, old:1};
const AGE_LABELS = {new:"Nouvelle", young:"Jeune", mid:"Intermédiaire", old:"Ancienne"};
const AGE_DESC   = {new:"jamais vue auparavant", young:"découverte il y a 7 jours ou moins", mid:"découverte entre 7 et 30 jours", old:"découverte il y a 30 jours ou plus"};

const IMP_BONUS  = {prioritaire:3, important:2, utile:1};
const IMP_LABELS = {prioritaire:"Prioritaire", important:"Importante", utile:"Utile"};
// Ancienneté = temps écoulé depuis la première découverte de la carte.
function cardAgeClass(prev){
  if(!prev || !prev.state || prev.state==="new") return "new";
  let fs = prev.firstSeen ? new Date(prev.firstSeen).getTime() : NaN;
  if(isNaN(fs)){
    // Cartes révisées avant l'arrivée du système de points : on estime la date de
    // découverte à partir de l'intervalle courant. Elles ne sont jamais traitées
    // comme « Nouvelles », pour ne pas offrir 10 points à des cartes déjà acquises.
    fs = (prev.state==="review"||prev.state==="relearning")
      ? Date.now()-((prev.interval||1)+1)*86400000
      : Date.now();
  }
  const days=(Date.now()-fs)/86400000;
  if(days<=7)  return "young";
  if(days<30)  return "mid";
  return "old";
}
// Prochain intervalle généré par l'algorithme, exprimé en jours.
function nextIntervalDays(np){
  if(!np) return 0;
  if(np.state==="learning"||np.state==="relearning") return 0; // minutes → 0 point
  if(np.next){
    const d=(new Date(np.next).getTime()-Date.now())/86400000;
    if(!isNaN(d)) return d;
  }
  return np.interval||0;
}
// Combien vaut cette notation ? (avant application de l'anti-farming)
function cardPointValue(prev,np,packetId){
  const age=cardAgeClass(prev);
  if(nextIntervalDays(np)<0.999) return {points:0,age,base:0,bonus:0,reason:"short"};
  const base=AGE_VALUES[age]||0;
  const bonus=IMP_BONUS[packetId]||0;
  return {points:base+bonus,age,base,bonus,packetId,reason:"ok"};
}
// ─── Stockage des points (localStorage, par utilisateur) ─────────────────────
const emptyPointsDay = () => ({points:0,cards:0,byAge:{new:0,young:0,mid:0,old:0},byImp:{prioritaire:0,important:0,utile:0},scored:{}});
const getPoints = u => { try{ const v=JSON.parse(localStorage.getItem(`mx6-points-${u}`)||"null"); return (v&&v.days)?v:{days:{}}; }catch{ return {days:{}}; } };
const savePoints = (u,p) => { try{
  const keys=Object.keys(p.days).sort();
  if(keys.length>60) keys.slice(0,keys.length-60).forEach(k=>{ delete p.days[k]; }); // on garde 60 jours
  localStorage.setItem(`mx6-points-${u}`,JSON.stringify(p));
}catch{} };
const todayPoints = u => { const p=getPoints(u); return p.days[dateKey()]||emptyPointsDay(); };
// Attribution effective. Renvoie null si la carte ne rapporte rien.
// Anti-farming : une même carte ne peut rapporter des points qu'UNE SEULE FOIS
// par jour, même si elle repasse plusieurs fois dans la file de révision.
function awardPoints(username,cardId,prev,np,packetId){
  if(!username) return null;
  const res=cardPointValue(prev,np,packetId);
  if(res.points<=0) return null;
  const store=getPoints(username), key=dateKey();
  const day=store.days[key]||emptyPointsDay();
  if(!day.scored) day.scored={};
  if(day.scored[cardId]) return null; // déjà comptabilisée aujourd'hui
  day.scored[cardId]=res.points;
  // Détail mémorisé pour pouvoir annuler proprement en cas de retour arrière.
  if(!day.scoredInfo) day.scoredInfo={};
  day.scoredInfo[cardId]={age:res.age,packetId:packetId||null};
  day.points+=res.points;
  day.cards+=1;
  day.byAge[res.age]=(day.byAge[res.age]||0)+res.points;
  if(packetId&&day.byImp[packetId]!==undefined) day.byImp[packetId]+=res.points;
  store.days[key]=day;
  savePoints(username,store);
  return {...res,total:day.points};
}
// Annule les points d'une carte pour la journée en cours (retour arrière).
// La carte redevient « non comptabilisée aujourd'hui » : si l'étudiant la renote
// ensuite, elle peut de nouveau rapporter des points, une seule fois.
function revokePoints(username,cardId){
  if(!username)return null;
  const store=getPoints(username), key=dateKey();
  const day=store.days[key];
  if(!day||!day.scored||!day.scored[cardId])return null;
  const pts=day.scored[cardId];
  const info=day.scoredInfo&&day.scoredInfo[cardId];
  day.points=Math.max(0,day.points-pts);
  day.cards=Math.max(0,day.cards-1);
  if(info){
    if(info.age&&day.byAge[info.age]!==undefined)day.byAge[info.age]=Math.max(0,day.byAge[info.age]-pts);
    if(info.packetId&&day.byImp[info.packetId]!==undefined)day.byImp[info.packetId]=Math.max(0,day.byImp[info.packetId]-pts);
    delete day.scoredInfo[cardId];
  }
  delete day.scored[cardId];
  store.days[key]=day;
  savePoints(username,store);
  return {points:pts,total:day.points};
}
// Annule une révision dans les statistiques (retour arrière).
const revokeStat = (username, correct, elapsedMs, wasNewCard=false) => {
  if(!username)return;
  const st=getStats(username), key=dateKey();
  const secs=cappedCardSeconds(elapsedMs);
  const d=st.days[key];
  if(d){
    d.cards=Math.max(0,d.cards-1);
    if(correct)d.correct=Math.max(0,d.correct-1);
    d.seconds=Math.max(0,d.seconds-secs);
    if(wasNewCard)d.newShown=Math.max(0,(d.newShown||0)-1);
  }
  st.total.cards=Math.max(0,st.total.cards-1);
  if(correct)st.total.correct=Math.max(0,st.total.correct-1);
  st.total.seconds=Math.max(0,st.total.seconds-secs);
  saveStats(username,st);
};

  const m=Math.round(diff/60000);
  if(m<2)return"dans moins d'une minute";
  if(m<60)return`dans ${m} min`;
  const h=Math.round(m/60);
  if(h<24)return`dans ${h}h`;

const getEmptyQueueMsg = (filtered, prog, settings, newShownToday) => {
  const {newCardsPerDay=20}=settings;
  const dueCards=filtered.filter(c=>!prog[c.id]?.buried&&isDue(prog[c.id]));
  if(dueCards.length===0){
    const dates=filtered.filter(c=>!prog[c.id]?.buried&&prog[c.id]?.next).map(c=>new Date(prog[c.id].next)).sort((a,b)=>a-b);
    if(dates.length){
      return`✨ Toutes tes cartes sont à jour !\nProchaine révision ${formatNextDue(dates[0])}.`;
    }
    return"✨ Aucune carte dans cette sélection pour l'instant.";
  }
  const newDue=dueCards.filter(c=>isNew(prog[c.id]));
  const reviewDue=dueCards.filter(c=>!isNew(prog[c.id]));
  if(reviewDue.length===0&&newDue.length>0&&newShownToday>=(newCardsPerDay||20)){
    return`🎯 Plafond de nouvelles cartes atteint !\nTu as déjà découvert ${newShownToday} nouvelle${newShownToday>1?"s":""} carte${newShownToday>1?"s":""} aujourd'hui (plafond : ${newCardsPerDay||20}).\n💡 Reviens demain ou augmente le plafond dans les Paramètres.`;
  }
  if(dueCards.length>0){
    return`📋 ${dueCards.length} carte${dueCards.length>1?"s":""} disponible${dueCards.length>1?"s":""} mais exclue${dueCards.length>1?"s":""} par tes filtres de matières ou de paquets.\nModifie les filtres dans les Paramètres.`;

  return"✨ Aucune carte à réviser pour le moment.";
};

const sortCardsGlobally = cards => [...cards].sort((a,b)=>{
  const gi=GROUPS.findIndex(g=>g.id===a.groupId)-GROUPS.findIndex(g=>g.id===b.groupId);
  if(gi)return gi;
  if(a.num!==b.num)return a.num-b.num;
  if(a.chapterId!==b.chapterId)return a.chapterId-b.chapterId;
  const aOrd=a.sort_order>0?a.sort_order:null;
  const bOrd=b.sort_order>0?b.sort_order:null;
  if(aOrd!==null&&bOrd!==null)return aOrd-bOrd;
  if(aOrd!==null)return -1;
  if(bOrd!==null)return 1;
  return getCardTimestamp(a.id)-getCardTimestamp(b.id);
});

// les cartes qu'elle a générées, elle n'est donc téléchargée qu'une fois par session.
const _occImgCache=new Map();
const resolveOcclusionImage=async data=>{
  if(!data)return null;

  if(!data.imageRef)return null;
  if(_occImgCache.has(data.imageRef))return _occImgCache.get(data.imageRef);
  const url=await supa.getOcclusionImage(data.imageRef);

        const data=JSON.parse(cardFront);

  },[cardFront]);

            }

            if(isTarget){
              ctx.fillStyle="#dc2626";ctx.fillRect(z.x,z.y,z.w,z.h);
              ctx.strokeStyle="#991b1b";ctx.lineWidth=2;ctx.strokeRect(z.x,z.y,z.w,z.h);
              ctx.fillStyle="white";const fs=Math.min(z.h*0.5,30);ctx.font=`bold ${fs}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("?",z.x+z.w/2,z.y+z.h/2);
            } else if(!showOthers){
              ctx.fillStyle="#000000";ctx.fillRect(z.x,z.y,z.w,z.h);
              ctx.strokeStyle="#222222";ctx.lineWidth=1;ctx.strokeRect(z.x,z.y,z.w,z.h);
              ctx.fillStyle="white";ctx.font=`bold ${Math.min(z.h*0.45,18)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(i+1),z.x+z.w/2,z.y+z.h/2);

  if(!imgSrc)return <p style={{fontSize:12,color:C.textLt,textAlign:"center",margin:"12px 0"}}>⏳ Chargement de l'image…</p>;
  return <canvas ref={canvasRef} style={{maxWidth:"100%",maxHeight:300,borderRadius:8,display:"block",margin:"0 auto"}}/>;
}

      try{ shared=await supa.upsertOcclusionImage(imageRef,image); }
      catch(e){
        console.error("upsertOcclusionImage failed:",e);
        alert(`⚠️ L'IMAGE N'A PAS PU ÊTRE ENREGISTRÉE\n\n${e.message||e}\n\nAucune carte n'a été créée — recommence dans un instant.`);
        setOccSaving(false);return;
      }
      // Si la table partagée n'existe pas encore côté Supabase, on retombe sur
      // l'ancien format (image incluse dans chaque carte). L'image étant
      // désormais compressée, cela reste largement gérable.
      const base=shared?{type:"occlusion",imageRef}:{type:"occlusion",image};
      const cards=zones.map((zone,i)=>({
        id:`occ-${stamp}-${i}`,
        front:JSON.stringify({...base,imgW,imgH,zones,targetZone:zone.id,title:occlusionTitle}),
        back:"__occlusion__",groupId:form.groupId,num:pcName?null:form.num,
        chapterId:pcName?1:form.chapterId,packetId:zone.packetId||form.packetId,
        card_type:"occlusion",personalCourseName:pcName,
      }));
      await onSave(cards);
      setSaved(true);
    } finally { setOccSaving(false); }
  };
  // Change the packet (Prioritaire/Important/Utile) of a single zone — each masked
  // element on the same image can belong to a different packet.
  const setZonePacket=(zoneId,pktId)=>{
    const nz=zones.map(z=>z.id===zoneId?{...z,packetId:pktId}:z);
    setZones(nz);pushHist(nz);
  };
  const selGroup=GROUPS.find(g=>g.id===form.groupId);
  // En mode étudiant, on ne propose que les cours ayant déjà au moins une carte
  // créée par un administrateur (+ le cours actuellement sélectionné, pour ne
  // jamais casser l'édition d'une carte existante).
  const availNums=isStudentMode
    ?(selGroup?.nums||[]).filter(n=>existingNumsForGroup(form.groupId).has(n)||n===form.num)
    :(selGroup?.nums||[1]);
  const availChapters=getChapters(form.groupId,form.num);
  const selPacket=PACKETS.find(p=>p.id===form.packetId);
  // Listes d'options mémoïsées : sans cela, chaque lettre tapée dans la question
  // recréait tous les tableaux, donc tous les boutons de classification.
  const packetOptions=useMemo(()=>PACKETS.map(pk=>({value:pk.id,label:pk.label,color:pC(pk.id),bg:pB(pk.id)})),[]);
  const groupOptions=useMemo(()=>availableGroups.map(g=>({value:g.id,label:groupLabel(g)})),[availableGroups]);
  const numOptions=useMemo(()=>availNums.map(nn=>({value:nn,label:`Cours ${nn}`})),[availNums.join(',')]);
  const chapterOptions=useMemo(()=>availChapters.map((ch,i)=>({value:i+1,label:`${i+1}. ${ch}`})),[availChapters.join('|')]);
  const availPersonalNames=isStudentMode?personalCourseNamesForGroup(form.groupId):[];
  const handleGroupChange=v=>{
    const g=GROUPS.find(g=>g.id===v);
    const newAvail=isStudentMode?g?.nums.filter(n=>existingNumsForGroup(v).has(n)):g?.nums;
    const newNum=newAvail?.includes(form.num)?form.num:newAvail?.[0]||g?.nums?.[0]||1;
    setForm(p=>({...p,groupId:v,num:newNum,chapterId:1}));
    setPersonalCourseName("");setPersonalErr(false);
  };
  const handleNumChange=v=>setForm(p=>({...p,num:v,chapterId:1}));
  const validate=()=>{
    const e={};
    if(!formFront.trim()&&!frontImg)e.front=true;
    if(!formBack.trim()&&!backImg)e.back=true;
    setErrors(e);
    if(personalMode&&!personalCourseName.trim()){setPersonalErr(true);return false;}
    return!Object.keys(e).length;
  };
  const handleSaveText=()=>{
    if(!validate())return;
    saveLastClass(form.groupId,form.num,form.chapterId,form.packetId);
    const pcName=personalMode?personalCourseName.trim():null;
    onSave({...form,num:pcName?null:form.num,chapterId:pcName?1:form.chapterId,personalCourseName:pcName,front:serializeContent(formFront,frontImg),back:serializeContent(formBack,backImg),id:card?.id||`card-${Date.now()}`,sort_order:card?.sort_order,card_type:card?.card_type||'text'});
    setSaved(true);
  };
  const renderModeToggle=()=>!isStudentMode?null:(
    <div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}>
      <Lbl>Type de cours</Lbl>
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={()=>{setPersonalMode(false);setPersonalErr(false);}} style={{flex:1,fontFamily:font,fontSize:12,fontWeight:!personalMode?600:400,padding:"9px 10px",cursor:"pointer",borderRadius:7,border:`2px solid ${!personalMode?C.accent:C.border}`,background:!personalMode?C.accentBg:C.surface,color:!personalMode?C.accent:C.textMed}}>{!personalMode&&"✓ "}📚 Cours officiel</button>
        <button onClick={()=>setPersonalMode(true)} style={{flex:1,fontFamily:font,fontSize:12,fontWeight:personalMode?600:400,padding:"9px 10px",cursor:"pointer",borderRadius:7,border:`2px solid ${personalMode?"var(--c-violet)":C.border}`,background:personalMode?"var(--c-violetBg)":C.surface,color:personalMode?"var(--c-violet)":C.textMed}}>{personalMode&&"✓ "}✏️ Mon cours personnel</button>
      </div>
      <p style={{fontSize:11,color:C.textLt,margin:"8px 0 0",lineHeight:1.5}}>{personalMode?"Ce cours n'est visible que par toi — donne-lui le nom que tu veux (ex. \"Bio Cell perso\").":"Uniquement les cours déjà créés par un administrateur."}</p>
    </div>
  );
  const renderPersonalCoursePicker=()=>(
    <div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}>
      <Lbl color={personalErr?C.again:undefined}>Nom du cours personnel{personalErr?" (requis)":""}</Lbl>
      {availPersonalNames.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
        {availPersonalNames.map(n=><button key={n} onClick={()=>{setPersonalCourseName(n);setPersonalErr(false);}} style={{fontFamily:font,fontSize:11,fontWeight:personalCourseName===n?600:400,padding:"5px 10px",cursor:"pointer",borderRadius:20,border:`1.5px solid ${personalCourseName===n?"var(--c-violet)":C.border}`,background:personalCourseName===n?"var(--c-violetBg2)":"transparent",color:personalCourseName===n?"var(--c-violet)":C.textMed}}>{personalCourseName===n&&"✓ "}{n}</button>)}
      </div>}
      <input style={{...iLine,borderColor:personalErr?C.again:C.border}} placeholder="Ex. Bio Cell perso" value={personalCourseName} onChange={e=>{setPersonalCourseName(e.target.value);setPersonalErr(false);}}/>
      <p style={{fontSize:11,color:C.textLt,margin:"6px 0 0",lineHeight:1.5}}>{availPersonalNames.length>0?"Choisis un cours existant ci-dessus ou tape un nouveau nom pour en créer un autre.":"Tape le nom que tu veux — ce sera ton propre cours, personnel."}</p>
    </div>
  );
  // Bloc « ordre d'importance » isolé : sur écran divisé il se place à droite
  // du contenu, pour rester atteignable sans faire défiler la page.
  const renderPacketPanel=()=>(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px",height:"fit-content"}}><div><ClassSelector label={cardType==="occlusion"?"Paquet par défaut (nouvelles zones)":"Paquet"} value={form.packetId} onChange={v=>setForm(p=>({...p,packetId:v}))} options={packetOptions} columns={1}/>{cardType==="occlusion"&&<p style={{fontSize:11,color:C.textLt,margin:"8px 0 0",lineHeight:1.5}}>Chaque zone peut ensuite avoir son propre paquet — modifie-le dans la liste des zones à droite.</p>}</div></div>);
  const renderClassPanel=(withPacket)=>(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px",height:"fit-content"}}><p style={{fontFamily:serif,fontSize:16,margin:"0 0 20px"}}>Classification</p><div style={{display:"flex",flexDirection:"column",gap:20}}>{withPacket&&<div><ClassSelector label={cardType==="occlusion"?"Paquet par défaut (nouvelles zones)":"Paquet"} value={form.packetId} onChange={v=>setForm(p=>({...p,packetId:v}))} options={packetOptions} columns={1}/>{cardType==="occlusion"&&<p style={{fontSize:11,color:C.textLt,margin:"8px 0 0",lineHeight:1.5}}>Chaque zone peut ensuite avoir son propre paquet — modifie-le dans la liste des zones à droite.</p>}</div>}<div style={withPacket?{borderTop:`1px solid ${C.border}`,paddingTop:18}:undefined}><ClassSelector label="Matière" value={form.groupId} onChange={handleGroupChange} options={groupOptions}/></div>{renderModeToggle()}{personalMode?renderPersonalCoursePicker():<>{availNums.length===0?<div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}><p style={{fontSize:12,color:C.textLt,margin:0,lineHeight:1.6}}>Aucun cours officiel n'existe encore pour cette matière — passe en "Mon cours personnel" pour créer le tien.</p></div>:<div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}><ClassSelector label="Cours" value={form.num} onChange={handleNumChange} options={numOptions} columns={Math.min(availNums.length,4)}/></div>}{availChapters.length>0&&(<div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}><ClassSelector label="Chapitre" value={form.chapterId} onChange={v=>setForm(p=>({...p,chapterId:v}))} options={chapterOptions} columns={1}/></div>)}</>}</div></div>);
  return <div style={{fontFamily:font,background:C.bg,minHeight:"100vh"}}><Nav theme={theme} onToggleTheme={onToggleTheme} left={<button onClick={onCancel} style={{fontFamily:font,fontSize:13,background:"none",border:"none",cursor:"pointer",color:C.textMed}}>← Retour</button>} center={isNew?"Nouvelle flashcard":"Modifier"} right={cardType==="text"?<Btn fill onClick={handleSaveText}>{saved?"✓ Enregistré":isNew?"Créer":"Mettre à jour"}</Btn>:zones.length>0?<Btn fill onClick={handleSaveOcclusion} disabled={occSaving}>{occSaving?<><span style={{display:"inline-block",animation:"spin 0.8s linear infinite"}}>↻</span> Enregistrement…</>:saved?`✓ Créées !`:`Générer ${zones.length} carte${zones.length>1?"s":""} →`}</Btn>:null}/>
    <div className="mfc-page" style={{maxWidth:960,margin:"0 auto",padding:"28px 24px"}}>
      {isNew&&lastClass&&<div style={{background:C.accentBg,border:`1px solid var(--c-accentSoft)`,borderRadius:8,padding:"8px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>📌</span><p style={{fontSize:12,color:C.accent,margin:0}}>Classification pré-remplie depuis la dernière carte — modifie uniquement ce qui change.</p></div>}
      {isNew&&(<div style={{marginBottom:24}}><Lbl>Type de carte</Lbl><div style={{display:"flex",gap:8,marginTop:8}}>{[["text","📝 Texte","Recto / Verso classique"],["occlusion","🖼 Image Occlusion","Masquer des zones sur une image"]].map(([t,lbl,desc])=>(<button key={t} onClick={()=>setCardType(t)} style={{fontFamily:font,fontSize:13,fontWeight:cardType===t?600:400,padding:"12px 20px",cursor:"pointer",borderRadius:8,border:`2px solid ${cardType===t?C.accent:C.border}`,background:cardType===t?C.accentBg:C.surface,color:cardType===t?C.accent:C.textMed,display:"flex",flexDirection:"column",alignItems:"flex-start",gap:3}}><span>{cardType===t&&"✓ "}{lbl}</span><span style={{fontSize:11,fontWeight:400,color:cardType===t?C.accent:C.textLt}}>{desc}</span></button>))}</div></div>)}
      {cardType==="text"&&(<div className="mfc-editor-grid" style={{display:"grid",gridTemplateColumns:"1fr 360px",gap:16,alignItems:"start"}}>
        <div className="mfc-editor-rail" style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="mfc-editor-packet">{renderPacketPanel()}</div>
          <div className="mfc-editor-side">{renderClassPanel(false)}</div>
        </div>
        <div className="mfc-editor-main" style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px"}}>
            <p style={{fontFamily:serif,fontSize:16,margin:"0 0 16px"}}>Contenu</p>
            <div style={{marginBottom:20}}>
              <Lbl color={errors.front?C.again:undefined}>Recto — Question{errors.front?" (requis)":""}</Lbl>
              <textarea style={{...iBox,minHeight:80,marginTop:6,display:"block",borderColor:errors.front?C.again:C.border}} value={formFront} onChange={e=>{setFormFront(e.target.value);setErrors(er=>({...er,front:false}));}} placeholder="La question..." rows={3}/>
              <div style={{marginTop:10}}><ImageDropZone value={frontImg} onChange={img=>{setFrontImg(img);setErrors(er=>({...er,front:false}));}} label="Image recto (optionnelle)"/></div>
            </div>
            <div>
              <Lbl color={errors.back?C.again:undefined}>Verso — Réponse{errors.back?" (requis)":""}</Lbl>
              <textarea style={{...iBox,minHeight:90,marginTop:6,display:"block",borderColor:errors.back?C.again:C.border}} value={formBack} onChange={e=>{setFormBack(e.target.value);setErrors(er=>({...er,back:false}));}} placeholder="La réponse..." rows={4}/>
              <div style={{marginTop:10}}><ImageDropZone value={backImg} onChange={img=>{setBackImg(img);setErrors(er=>({...er,back:false}));}} label="Image verso (optionnelle)"/></div>
            </div>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"14px 16px"}}>
            <Lbl>Aperçu classification</Lbl>
            <div style={{display:"flex",flexWrap:"wrap",gap:6,margin:"8px 0 0"}}>
              <Tag color={pC(form.packetId)} bg={pB(form.packetId)}>{selPacket?.label}</Tag>
              <Tag color={C.accent} bg={C.accentBg}>{selGroup?.label}</Tag>
              {personalMode?<Tag color="var(--c-violet)" bg="var(--c-violetBg)">✏️ {personalCourseName.trim()||"Cours personnel"}</Tag>:<><Tag color={C.textMed} bg={C.bg}>Cours {form.num}</Tag>{availChapters[form.chapterId-1]&&<Tag color={C.textMed} bg={C.bg}>Ch. {form.chapterId} — {availChapters[form.chapterId-1]}</Tag>}</>}
            </div>
            {formFront&&<p style={{fontFamily:serif,fontSize:13,color:C.textMed,margin:"10px 0 0",lineHeight:1.5}}>{formFront.slice(0,100)}{formFront.length>100?"…":""}</p>}
            {frontImg&&<img src={frontImg} style={{maxWidth:"100%",maxHeight:80,borderRadius:6,marginTop:8,display:"block"}}/>}
          </div>
          <div style={{display:"flex",gap:10}}><Btn fill full onClick={handleSaveText}>{saved?"✓":isNew?"Créer la carte":"Mettre à jour"}</Btn><Btn full onClick={onCancel}>Annuler</Btn></div>
        </div>
      </div>)}
      {cardType==="occlusion"&&(<div className="mfc-occlusion-grid" style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:20,alignItems:"start"}}>
        <div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"14px 16px",marginBottom:14}}>
            <Lbl>Titre au-dessus de l'image (optionnel)</Lbl>
            <input style={iLine} placeholder="Ex : Tableau des cytokines pro-inflammatoires" value={occlusionTitle} onChange={e=>setOcclusionTitle(e.target.value)}/>
            <p style={{fontSize:11,color:C.textLt,margin:"6px 0 0",lineHeight:1.5}}>Affiché au-dessus de l'image sur toutes les cartes générées à partir de celle-ci — pratique pour indiquer le nom du tableau.</p>
          </div>
          {!image?(
          <div
            onDragOver={e=>{e.preventDefault();e.stopPropagation();setImgDrag(true);}}
            onDragLeave={e=>{e.preventDefault();e.stopPropagation();setImgDrag(false);}}
            onDrop={e=>{e.preventDefault();e.stopPropagation();setImgDrag(false);loadImageFile(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${imgDrag?C.accent:C.border}`,borderRadius:12,padding:"60px 24px",textAlign:"center",background:imgDrag?C.accentBg:C.surface,transition:"all 0.15s"}}>
            <p style={{fontSize:40,margin:"0 0 12px"}}>🖼</p>
            <p style={{fontFamily:serif,fontSize:18,margin:"0 0 8px"}}>{imgLoading?"Préparation de l'image…":imgDrag?"Dépose l'image ici":"Importer une image"}</p>
            <p style={{fontSize:13,color:C.textMed,margin:"0 0 20px",lineHeight:1.6}}>Glisse-dépose une image ou clique pour l'importer. Dessine ensuite des zones à masquer. Fonctionne sur tablette.</p>
            <label style={{fontFamily:font,fontSize:13,fontWeight:500,padding:"10px 20px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.accent}`,background:C.accentBg,color:C.accent,display:"inline-block"}}>Choisir une image<input type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/></label>
          </div>
        ):(
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:C.bg,flexWrap:"wrap",gap:8}}>
              <p style={{fontSize:12,color:C.textMed,margin:0}}>
                {selectedZoneId?"✓ Zone sélectionnée — glisser pour déplacer · poignées aux coins pour redimensionner":"Dessiner ou cliquer une zone pour la modifier"}
              </p>
              <div style={{display:"flex",gap:6}}>
                <button onClick={undoZones} disabled={!canUndo} title="Annuler (Ctrl+Z)" style={{fontFamily:font,fontSize:14,padding:"4px 9px",cursor:canUndo?"pointer":"default",borderRadius:5,border:`1px solid ${C.border}`,background:"transparent",color:canUndo?C.text:C.textLt,opacity:canUndo?1:0.35}}>↩</button>
                <button onClick={redoZones} disabled={!canRedo} title="Rétablir (Ctrl+Y)" style={{fontFamily:font,fontSize:14,padding:"4px 9px",cursor:canRedo?"pointer":"default",borderRadius:5,border:`1px solid ${C.border}`,background:"transparent",color:canRedo?C.text:C.textLt,opacity:canRedo?1:0.35}}>↪</button>
                <label style={{fontFamily:font,fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${C.border}`,color:C.textMed,background:C.surface}}>Changer<input type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/></label>
              </div>
            </div>
            <div
              onDragOver={e=>{e.preventDefault();e.stopPropagation();}}
              onDrop={e=>{e.preventDefault();e.stopPropagation();loadImageFile(e.dataTransfer.files[0]);}}
              style={{position:"relative",userSelect:"none",WebkitUserSelect:"none",lineHeight:0,touchAction:"none"}}>
              <img src={image} onLoad={e=>{setImgW(e.target.naturalWidth);setImgH(e.target.naturalHeight);}} style={{width:"100%",display:"block",pointerEvents:"none",WebkitUserDrag:"none"}} draggable={false}/>
              {imgW>0&&<svg
                ref={svgRef}
                viewBox={`0 0 ${imgW} ${imgH}`}
                preserveAspectRatio="none"
                style={{position:"absolute",inset:0,width:"100%",height:"100%",touchAction:"none",userSelect:"none",cursor:selectedZoneId?"default":"crosshair"}}
                onMouseDown={pointerDown} onMouseMove={pointerMove} onMouseUp={pointerUp} onMouseLeave={pointerUp}
                onTouchStart={pointerDown} onTouchMove={pointerMove} onTouchEnd={pointerUp}
              >
                {zones.map((z,i)=>{
                  const isSel=z.id===selectedZoneId;
                  const HR=getHandleR();
                  return<g key={z.id}>
                    <rect x={z.x} y={z.y} width={z.w} height={z.h}
                      fill={isSel?z.color+"66":z.color+"44"}
                      stroke={isSel?"var(--c-blueDeep)":z.color}

                    <text x={z.x+HR*0.4} y={z.y+HR*1.4} fill="white" fontSize={Math.max(14,HR)} fontWeight="bold" style={{pointerEvents:"none"}}>{i+1}</text>
                    {isSel&&[{t:'nw',x:z.x,y:z.y},{t:'ne',x:z.x+z.w,y:z.y},{t:'sw',x:z.x,y:z.y+z.h},{t:'se',x:z.x+z.w,y:z.y+z.h}].map(h=>(

                        style={{cursor:'nwse-resize'}}
                      />
                    ))}
                  </g>;
                })}
                {currentRect&&currentRect.w>0&&(
                  <rect x={currentRect.x} y={currentRect.y} width={currentRect.w} height={currentRect.h}
                    fill="var(--c-accentSoft)" stroke="var(--c-blueDeep)" strokeWidth={Math.max(1.5,imgW*0.002)} strokeDasharray={`${imgW*0.012} ${imgW*0.006}`}
                  />

              </svg>}

          </div>

        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>

            {zones.length===0?<p style={{fontSize:12,color:C.textLt,margin:0,lineHeight:1.6}}>Dessine des rectangles sur l'image.<br/>Chaque rectangle = 1 flashcard.<br/><span style={{color:C.accent}}>Tablette : toucher et glisser.</span></p>:
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {zones.map((z,i)=><div key={z.id} style={{borderRadius:6,border:`1.5px solid ${z.id===selectedZoneId?"var(--c-blueDeep)":z.color}`,background:z.id===selectedZoneId?"var(--c-easyBg)":z.color+"11",overflow:"hidden"}}>
                <div onClick={()=>setSelectedZoneId(z.id===selectedZoneId?null:z.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",cursor:"pointer"}}>
                  <div style={{width:14,height:14,borderRadius:3,background:z.color,flexShrink:0}}/>
                  <span style={{fontSize:13,flex:1}}>Zone {i+1}</span>
                  <Tag color={pC(z.packetId||form.packetId)} bg={pB(z.packetId||form.packetId)} small>{PACKETS.find(p=>p.id===(z.packetId||form.packetId))?.label}</Tag>
                  <button onClick={e=>{e.stopPropagation();const nz=zones.filter(x=>x.id!==z.id);setZones(nz);pushHist(nz);if(selectedZoneId===z.id)setSelectedZoneId(null);}} style={{background:"none",border:"none",cursor:"pointer",color:C.textLt,fontSize:16,lineHeight:1}}>×</button>
                </div>
                <div style={{display:"flex",gap:5,padding:"0 10px 8px 32px",flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                  {PACKETS.map(pk=>{
                    const active=(z.packetId||form.packetId)===pk.id;
                    return<button key={pk.id} onClick={()=>setZonePacket(z.id,pk.id)} style={{fontFamily:font,fontSize:10,fontWeight:active?600:400,padding:"3px 8px",cursor:"pointer",borderRadius:5,border:`1.5px solid ${active?pC(pk.id):C.border}`,background:active?pB(pk.id):"transparent",color:active?pC(pk.id):C.textMed}}>{active&&"✓ "}{pk.label}</button>;
                  })}
                </div>
              </div>)}
              <p style={{fontSize:11,color:C.textMed,margin:"6px 0 0"}}>{zones.length} zone{zones.length>1?"s":""} → {zones.length} flashcard{zones.length>1?"s":""} · chaque zone garde son propre paquet</p>
            </div>}

}
// ─── StatsTab ─────────────────────────────────────────────────────────────────
function StatsTab({username,progress,allCards,onUnbury}){
  const stats=useMemo(()=>getStats(username),[username]);
  const today=dateKey();
  const todayCards=stats.days[today]?.cards||0;
  const todayCorrect=stats.days[today]?.correct||0;
  const streak=computeStreak(stats.days);
  const totalCards=stats.total.cards;
  const totalCorrect=stats.total.correct;
  const successRate=totalCards>0?Math.round(totalCorrect/totalCards*100):0;
  const totalSeconds=stats.total.seconds;
  const buriedCards=useMemo(()=>{
    if(!progress||!allCards)return[];
    return allCards.filter(c=>progress[c.id]?.buried===true);
  },[progress,allCards]);
  const flameCount=Math.min(streak,10);
  const flames=streak>0?"🔥".repeat(flameCount):"-";
  const heatDays=useMemo(()=>{
    const days=[];
    for(let i=181;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const k=dateKey(d);
      const n=stats.days[k]?.cards||0;
      days.push({date:k,n,label:`${d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}: ${n} carte${n!==1?"s":""}`});
    }
    return days;
  },[stats]);
  const heatColor=(n)=>{
    if(n===0)return"var(--c-borderSoft2)";
    if(n<=2)return"var(--c-greenSoft2)";
    if(n<=5)return"var(--c-green1)";
    if(n<=15)return"var(--c-green2)";
    return"var(--c-green3)";
  };
  const weeks=useMemo(()=>{
    const ws=[];
    let week=[];
    heatDays.forEach((d,i)=>{
      week.push(d);
      if(week.length===7){ws.push(week);week=[];}
    });
    if(week.length)ws.push(week);
    return ws;
  },[heatDays]);
  const monthLabels=useMemo(()=>{
    const labels=[];
    let lastMonth=-1;
    weeks.forEach((week,wi)=>{
      const mid=week[Math.floor(week.length/2)];
      const m=new Date(mid.date).getMonth();
      if(m!==lastMonth){
        labels.push({wi,label:new Date(mid.date).toLocaleDateString("fr-FR",{month:"short"})});
        lastMonth=m;
      }
    });
    return labels;
  },[weeks]);
  const StatCard=({label,value,sub,accent})=>(
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"18px 16px"}}>
      <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 10px"}}>{label}</p>
      <p style={{fontFamily:serif,fontSize:30,fontWeight:400,margin:"0 0 4px",color:accent||C.text,lineHeight:1.1}}>{value}</p>
      {sub&&<p style={{fontSize:11,color:C.textMed,margin:0}}>{sub}</p>}
    </div>
  );
  return(
    <div style={{animation:"fadeIn 0.18s ease"}}>
      <p style={{fontFamily:serif,fontSize:18,margin:"0 0 4px"}}>Statistiques</p>
      <p style={{fontSize:13,color:C.textMed,margin:"0 0 22px"}}>Sauvegardées sur cet appareil · réinitialisées si tu vides le cache</p>
      {totalCards===0?(
        <div style={{border:`1.5px dashed ${C.border}`,borderRadius:12,padding:"48px 24px",textAlign:"center",background:C.surface}}>
          <p style={{fontSize:36,margin:"0 0 12px"}}>📊</p>
          <p style={{fontFamily:serif,fontSize:18,margin:"0 0 8px"}}>Aucune statistique pour l'instant</p>
          <p style={{fontSize:13,color:C.textMed,margin:0,lineHeight:1.6}}>Commence à réviser des flashcards pour voir tes stats !</p>
        </div>
      ):(
        <>
          <div className="mfc-autofill" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12,marginBottom:28}}>
            <StatCard label="Streak" value={`${streak} ${streak>0?"🔥":""}`} sub={`${streak===0?"Pas encore actif":streak===1?"1 jour d'affilée":streak+" jours d'affilée"}`} accent={streak>0?"var(--c-streak)":C.text}/>
            <StatCard label="Aujourd'hui" value={todayCards} sub={todayCards>0?`${Math.round(todayCorrect/todayCards*100)}% de réussite`:"Pas encore révisé"} accent={todayCards>0?C.accent:C.text}/>
            <StatCard label="Total révisées" value={totalCards.toLocaleString("fr-FR")} sub="cartes au total"/>
            <StatCard label="Taux de réussite" value={`${successRate}%`} sub={`${totalCorrect} correctes / ${totalCards}`} accent={successRate>=80?C.good:successRate>=60?C.hard:C.again}/>
            <StatCard label="Temps total" value={formatSeconds(totalSeconds)} sub={`≈ ${Math.round(totalSeconds/totalCards)} s / carte`}/>
            <StatCard label="Jours actifs" value={Object.keys(stats.days).filter(k=>stats.days[k]?.cards>0).length} sub="jours de révision"/>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px"}}>
            <p style={{fontFamily:serif,fontSize:16,margin:"0 0 14px"}}>Activité (26 dernières semaines)</p>
            <div style={{display:"flex",marginBottom:4,paddingLeft:20,position:"relative",height:16}}>
              {monthLabels.map(({wi,label})=>(
                <div key={wi} style={{position:"absolute",left:`${wi*(12+2)+20}px`,fontFamily:mono,fontSize:9,letterSpacing:1,color:C.textLt,textTransform:"uppercase"}}>{label}</div>
              ))}
            </div>
            <div style={{display:"flex",gap:2}}>
              <div style={{display:"flex",flexDirection:"column",gap:2,paddingTop:0,marginRight:4}}>
                {["L","M","M","J","V","S","D"].map((d,i)=>(
                  <div key={i} style={{width:12,height:12,fontFamily:mono,fontSize:8,color:C.textLt,display:"flex",alignItems:"center",justifyContent:"center"}}>{i%2===0?d:""}</div>
                ))}
              </div>
              <div style={{display:"flex",gap:2,overflowX:"auto",paddingBottom:4}}>
                {weeks.map((week,wi)=>(
                  <div key={wi} style={{display:"flex",flexDirection:"column",gap:2}}>
                    {Array(7).fill(null).map((_,di)=>{
                      const day=week[di];
                      if(!day)return<div key={di} style={{width:12,height:12}}/>;
                      return(
                        <div key={di} title={day.label} style={{width:12,height:12,borderRadius:2,background:heatColor(day.n),cursor:"default",transition:"transform 0.1s"}}
                          onMouseEnter={e=>e.currentTarget.style.transform="scale(1.5)"}
                          onMouseLeave={e=>e.currentTarget.style.transform="none"}
                        />
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:12,justifyContent:"flex-end"}}>
              <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>Moins</span>
              {[0,2,5,15,20].map(n=><div key={n} style={{width:12,height:12,borderRadius:2,background:heatColor(n)}}/>)}
              <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>Plus</span>
            </div>
          </div>
        </>
      )}
      {buriedCards.length>0&&(
        <div style={{marginTop:24,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
          <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.border}`,background:C.bg,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:16}}>🙈</span>
              <p style={{fontFamily:serif,fontSize:15,margin:0}}>Cartes enfouies</p>
              <span style={{fontFamily:mono,fontSize:9,padding:"2px 7px",borderRadius:10,background:"var(--c-toast)",color:"var(--c-onSolid)",fontWeight:700}}>{buriedCards.length}</span>
            </div>
            <p style={{fontSize:11,color:C.textLt,margin:0}}>Exclues de tes révisions · clique pour désenfouir</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:0}}>
            {buriedCards.map((card,i)=>{
              const grp=GROUPS.find(g=>g.id===card.groupId);
              const chName=getChapters(card.groupId,card.num)[card.chapterId-1];
              return(
                <div key={card.id} style={{display:"flex",alignItems:"center",padding:"10px 18px",gap:12,borderTop:i>0?`1px solid ${C.border}`:"none"}}>
                  <div style={{width:3,background:pC(card.packetId),borderRadius:2,alignSelf:"stretch",flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:4}}>
                      <Tag color={pC(card.packetId)} bg={pB(card.packetId)} small>{PACKETS.find(p=>p.id===card.packetId)?.label}</Tag>
                      {grp&&<Tag color={C.textMed} bg={C.bg} small>{grp.label}</Tag>}
                      <Tag color={C.textMed} bg={C.bg} small>Cours {card.num}</Tag>
                      {chName&&<Tag color={C.textMed} bg={C.bg} small>Ch.{card.chapterId} {chName}</Tag>}
                      {card.isUserCard&&<Tag color={"var(--c-violet)"} bg={"var(--c-violetBg)"} small>✏️ Perso</Tag>}
                    </div>
                    {isOcclusion(card)?<p style={{fontFamily:serif,fontSize:12,color:C.textMed,margin:0}}>🖼 Image Occlusion</p>:<p style={{fontFamily:serif,fontSize:13,color:C.textMed,margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{card.front}</p>}
                  </div>
                  <button onClick={()=>onUnbury&&onUnbury(card.id)} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 12px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.good}`,background:C.goodBg,color:C.good,whiteSpace:"nowrap",flexShrink:0}}>👁 Désenfouir</button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}
// ─── MyCardsTab ──────────────────────────────────────────────────────────────
function MyCardsTab({userCards,onNew,onEdit,onDelete,onToggleIntegration,progress,onStudyUser,onStudyPersonal}){

  // Cartes sur un cours officiel (numéroté, créé par un administrateur) vs

  // l'étudiant qui l'a créé). Les deux sont strictement séparées à l'affichage.
  const officialUserCards=useMemo(()=>userCards.filter(c=>!c.personalCourseName),[userCards]);

  const activeGroups=useMemo(()=>
    GROUPS.filter(g=>officialUserCards.some(c=>c.groupId===g.id))
  ,[officialUserCards]);

    [...new Set(personalUserCards.map(c=>c.personalCourseName))].sort((a,b)=>a.localeCompare(b,"fr"))

          <Tag color={C.textMed} bg={C.bg} small>{groupCards.length} carte{groupCards.length>1?"s":""}</Tag>
        </div>

        {availNums.map(n=>{

  // ─── Cours personnel (nom libre, flat — pas de chapitres) ──────────────────

  const pts=today.points;
  const ri=rankIndexFor(pts),rank=RANKS[ri],next=RANKS[ri+1]||null;
  const pctToNext=next?Math.min(1,(pts-rank.min)/(next.min-rank.min)):1;

    let alive=true;
    (async()=>{

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12,margin:"0 0 18px"}}>
