  // Bloc « ordre d'importance » isolé : sur écran divisé il se place à droite
  // du contenu, pour rester atteignable sans faire défiler la page.
  const renderPacketPanel=()=>(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px",height:"fit-content"}}><div><ClassSelector label={cardType==="occlusion"?"Paquet par défaut (nouvelles zones)":"Paquet"} value={form.packetId} onChange={v=>setForm(p=>({...p,packetId:v}))} options={packetOptions} columns={1}/>{cardType==="occlusion"&&<p style={{fontSize:11,color:C.textLt,margin:"8px 0 0",lineHeight:1.5}}>Chaque zone peut ensuite avoir son propre paquet — modifie-le dans la liste des zones à droite.</p>}</div></div>);
  const renderClassPanel=(withPacket)=>(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px",height:"fit-content"}}><p style={{fontFamily:serif,fontSize:16,margin:"0 0 20px"}}>Classification</p><div style={{display:"flex",flexDirection:"column",gap:20}}>{withPacket&&<div><ClassSelector label={cardType==="occlusion"?"Paquet par défaut (nouvelles zones)":"Paquet"} value={form.packetId} onChange={v=>setForm(p=>({...p,packetId:v}))} options={packetOptions} columns={1}/>{cardType==="occlusion"&&<p style={{fontSize:11,color:C.textLt,margin:"8px 0 0",lineHeight:1.5}}>Chaque zone peut ensuite avoir son propre paquet — modifie-le dans la liste des zones à droite.</p>}</div>}<div style={withPacket?{borderTop:`1px solid ${C.border}`,paddingTop:18}:undefined}><ClassSelector label="Matière" value={form.groupId} onChange={handleGroupChange} options={groupOptions}/></div>{renderModeToggle()}{personalMode?renderPersonalCoursePicker():<>{availNums.length===0?<div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}><p style={{fontSize:12,color:C.textLt,margin:0,lineHeight:1.6}}>Aucun cours officiel n'existe encore pour cette matière — passe en "Mon cours personnel" pour créer le tien.</p></div>:<div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}><ClassSelector label="Cours" value={form.num} onChange={handleNumChange} options={numOptions} columns={Math.min(availNums.length,4)}/></div>}{availChapters.length>0&&(<div style={{borderTop:`1px solid ${C.border}`,paddingTop:18}}><ClassSelector label="Chapitre" value={form.chapterId} onChange={v=>setForm(p=>({...p,chapterId:v}))} options={chapterOptions} columns={1}/></div>)}</>}</div></div>);
  return <div style={{fontFamily:font,background:C.bg,minHeight:"100vh"}}><Nav theme={theme} onToggleTheme={onToggleTheme} left={<button onClick={onCancel} style={{fontFamily:font,fontSize:13,background:"none",border:"none",cursor:"pointer",color:C.textMed}}>← Retour</button>} center={isNew?"Nouvelle flashcard":"Modifier"} right={cardType==="text"?<Btn fill onClick={handleSaveText}>{saved?"✓ Enregistré":isNew?"Créer":"Mettre à jour"}</Btn>:zones.length>0?<Btn fill onClick={handleSaveOcclusion} disabled={occSaving}>{occSaving?<><span style={{display:"inline-block",animation:"spin 0.8s linear infinite"}}>↻</span> Enregistrement…</>:saved?`✓ Créées !`:`Générer ${zones.length} carte${zones.length>1?"s":""} →`}</Btn>:null}/>
    <div className="mfc-page" style={{maxWidth:960,margin:"0 auto",padding:"28px 24px"}}>
      {isNew&&lastClass&&<div style={{background:C.accentBg,border:`1px solid var(--c-accentSoft)`,borderRadius:8,padding:"8px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>📌</span><p style={{fontSize:12,color:C.accent,margin:0}}>Classification pré-remplie depuis la dernière carte — modifie uniquement ce qui change.</p></div>}
      {isNew&&(<div style={{marginBottom:24}}><Lbl>Type de carte</Lbl><div style={{display:"flex",gap:8,marginTop:8}}>{[["text","📝 Texte","Recto / Verso classique"],["occlusion","🖼 Image Occlusion","Masquer des zones sur une image"]].map(([t,lbl,desc])=>(<button key={t} onClick={()=>setCardType(t)} style={{fontFamily:font,fontSize:13,fontWeight:cardType===t?600:400,padding:"12px 20px",cursor:"pointer",borderRadius:8,border:`2px solid ${cardType===t?C.accent:C.border}`,background:cardType===t?C.accentBg:C.surface,color:cardType===t?C.accent:C.textMed,display:"flex",flexDirection:"column",alignItems:"flex-start",gap:3}}><span>{cardType===t&&"✓ "}{lbl}</span><span style={{fontSize:11,fontWeight:400,color:cardType===t?C.accent:C.textLt}}>{desc}</span></button>))}</div></div>)}
      {cardType==="text"&&(<div className="mfc-editor-grid" style={{display:"grid",gridTemplateColumns:"1fr 360px",gap:16,alignItems:"start"}}>
        <div className="mfc-editor-rail" style={{display:"flex",flexDirection:"column",gap:12}}>

            <div style={{marginBottom:20}}>

              <div style={{marginTop:10}}><ImageDropZone value={frontImg} onChange={img=>{setFrontImg(img);setErrors(er=>({...er,front:false}));}} label="Image recto (optionnelle)"/></div>

              {personalMode?<Tag color="var(--c-violet)" bg="var(--c-violetBg)">✏️ {personalCourseName.trim()||"Cours personnel"}</Tag>:<><Tag color={C.textMed} bg={C.bg}>Cours {form.num}</Tag>{availChapters[form.chapterId-1]&&<Tag color={C.textMed} bg={C.bg}>Ch. {form.chapterId} — {availChapters[form.chapterId-1]}</Tag>}</>}

      {cardType==="occlusion"&&(<div className="mfc-occlusion-grid" style={{display:"grid",gridTemplateColumns:"1fr 300px",gap:20,alignItems:"start"}}>
        <div>

            <p style={{fontSize:11,color:C.textLt,margin:"6px 0 0",lineHeight:1.5}}>Affiché au-dessus de l'image sur toutes les cartes générées à partir de celle-ci — pratique pour indiquer le nom du tableau.</p>
          </div>
          {!image?(
          <div
            onDragOver={e=>{e.preventDefault();e.stopPropagation();setImgDrag(true);}}
            onDragLeave={e=>{e.preventDefault();e.stopPropagation();setImgDrag(false);}}
            onDrop={e=>{e.preventDefault();e.stopPropagation();setImgDrag(false);loadImageFile(e.dataTransfer.files[0]);}}

            <p style={{fontSize:40,margin:"0 0 12px"}}>🖼</p>
            <p style={{fontFamily:serif,fontSize:18,margin:"0 0 8px"}}>{imgLoading?"Préparation de l'image…":imgDrag?"Dépose l'image ici":"Importer une image"}</p>
            <p style={{fontSize:13,color:C.textMed,margin:"0 0 20px",lineHeight:1.6}}>Glisse-dépose une image ou clique pour l'importer. Dessine ensuite des zones à masquer. Fonctionne sur tablette.</p>
            <label style={{fontFamily:font,fontSize:13,fontWeight:500,padding:"10px 20px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.accent}`,background:C.accentBg,color:C.accent,display:"inline-block"}}>Choisir une image<input type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/></label>
          </div>
        ):(
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>

              <p style={{fontSize:12,color:C.textMed,margin:0}}>

              </p>
              <div style={{display:"flex",gap:6}}>

function AdminLessons({cards}){

      <span style={{fontFamily:mono,fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.textLt}}>{totalOnline} document{totalOnline>1?"s":""} en ligne</span>

// Le compte à rebours, à la seconde. Il s'arrête tout seul quand l'offre expire,
// et le bandeau qui l'entoure disparaît au rendu suivant.
function PromoCountdown({tone="var(--c-imp)",compact}){
  const [now,setNow]=useState(()=>Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),1000); return()=>clearInterval(t); },[]);
  const reste=Math.max(0,new Date(PROMO.endsAt).getTime()-now);
  const j=Math.floor(reste/86400000), h=Math.floor(reste/3600000)%24,
        m=Math.floor(reste/60000)%60,  sec=Math.floor(reste/1000)%60;
  const pad=n=>String(n).padStart(2,"0");
  const cases=[[j,"j"],[h,"h"],[m,"min"],[sec,"s"]];
  if(compact)return <span style={{fontFamily:mono,fontSize:12,fontWeight:700,color:tone,whiteSpace:"nowrap"}}>{j>0?`${j} j `:""}{pad(h)}:{pad(m)}:{pad(sec)}</span>;
  return <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
    {cases.map(([v,u],i)=><div key={u} style={{background:"var(--c-surface)",border:`1.5px solid ${tone}`,borderRadius:8,padding:"6px 10px",minWidth:52,textAlign:"center"}}>
      <div style={{fontFamily:mono,fontSize:19,fontWeight:700,color:tone,lineHeight:1.1}}>{i===0?v:pad(v)}</div>
      <div style={{fontFamily:mono,fontSize:8,letterSpacing:1.5,textTransform:"uppercase",color:C.textLt,marginTop:2}}>{u}</div>
    </div>)}
  </div>;
}

                  </div>

                </div>

      )}
    </div>
  );
}
// ─── MyCardsTab ──────────────────────────────────────────────────────────────
function MyCardsTab({userCards,onNew,onEdit,onDelete,onToggleIntegration,progress,onStudyUser,onStudyPersonal,jplans}){
  const [delId,setDelId]=useState(null);
  // Cartes sur un cours officiel (numéroté, créé par un administrateur) vs
  // cartes sur un cours personnel (nommé librement, visible uniquement par
  // l'étudiant qui l'a créé). Les deux sont strictement séparées à l'affichage.
  const officialUserCards=useMemo(()=>userCards.filter(c=>!c.personalCourseName),[userCards]);
  const personalUserCards=useMemo(()=>userCards.filter(c=>c.personalCourseName),[userCards]);
  const activeGroups=useMemo(()=>
    GROUPS.filter(g=>officialUserCards.some(c=>c.groupId===g.id))
  ,[officialUserCards]);
  const personalCourseNames=useMemo(()=>
    [...new Set(personalUserCards.map(c=>c.personalCourseName))].sort((a,b)=>a.localeCompare(b,"fr"))
  ,[personalUserCards]);
  // ─── Méthode de révision choisie pour les cartes personnelles ──────────────
  // Le choix ne modifie aucune donnée : il change la file construite au
  // lancement, et donc ce que « à réviser » veut dire dans les compteurs
  // ci-dessous. En Anki c'est l'échéance FSRS, en méthode des J c'est le J du
  // jour, en révision personnalisée il n'y a pas d'échéance du tout : toute
  // carte non enterrée est disponible.
  const [method,setMethod]=useState("anki");
  const countFor=useCallback((list,m)=>list.filter(c=>{
    const p=progress[c.id];
    if(p?.buried)return false;
    if(m==="perso")return true;
    if(m==="j")return jIsDue(p,jPlanFor(jplans||{},c.groupId,c.num,c.chapterId,effPkt(c,progress)));
    return isDue(p);
  }).length,[progress,jplans]);
  const dueIn=useCallback(list=>countFor(list,method),[countFor,method]);
  const cardDueIn=useCallback(c=>countFor([c],method)>0,[countFor,method]);
  const totalDue=dueIn(userCards);
  const integratedCount=officialUserCards.filter(c=>c.integrated).length;
  function GroupPanel({group}){
    const [activeCours,setActiveCours]=useState(null);
    const [expandedCh,setExpandedCh]=useState(null);
    const groupCards=officialUserCards.filter(c=>c.groupId===group.id);
    const availNums=[...new Set(groupCards.map(c=>c.num))].sort((a,b)=>a-b);
    const courseCards=activeCours?groupCards.filter(c=>c.num===activeCours):[];
    const chapterIds=[...new Set(courseCards.map(c=>c.chapterId))].sort((a,b)=>a-b);
    function UserPktBtn({chapterId,pk}){
      const pkCards=courseCards.filter(c=>c.chapterId===chapterId&&c.packetId===pk.id);

        <span style={{fontSize:9}}>{pk.label}</span>

      </button>;
    }
    return<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"11px 18px",borderBottom:`1px solid ${C.border}`,background:C.bg,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <p style={{fontFamily:serif,fontSize:15,margin:0}}>{group.label}</p>
          <Tag color={group.sem===1?C.accent:C.imp} bg={group.sem===1?C.accentBg:C.impBg} small>{group.sem===1?"Sem. 1":"Sem. 2"}</Tag>
          <Tag color={C.textMed} bg={C.bg} small>{groupCards.length} carte{groupCards.length>1?"s":""}</Tag>
        </div>
      </div>
      <div style={{display:"flex",gap:8,padding:"10px 18px",flexWrap:"wrap",borderBottom:activeCours?`1px solid ${C.border}`:"none",background:C.surface}}>
        {availNums.map(n=>{
          const active=activeCours===n;
          const due=dueIn(groupCards.filter(c=>c.num===n));
          return<button key={n} onClick={()=>{setActiveCours(active?null:n);setExpandedCh(null);}} style={{fontFamily:font,fontSize:12,fontWeight:active?600:400,padding:"8px 14px",cursor:"pointer",borderRadius:7,border:`1.5px solid ${active?"var(--c-violet)":due>0?C.good:C.border}`,background:active?"var(--c-violetBg2)":due>0?C.goodBg:"transparent",color:active?"var(--c-violet)":due>0?C.good:C.textMed,display:"flex",alignItems:"center",gap:7}}>
            <span>Cours {n}</span>
            {due>0&&!active&&<span style={{fontFamily:mono,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:10,background:C.good,color:"var(--c-onSolid)"}}>{due}</span>}
            <span style={{fontSize:10,opacity:0.6}}>{active?"▲":"▼"}</span>
          </button>;
        })}
      </div>
      {activeCours&&<div style={{animation:"fadeIn 0.18s ease"}}>
        {chapterIds.length===0?<div style={{padding:"14px 18px"}}><p style={{fontSize:12,color:C.textLt,margin:0}}>Aucun chapitre défini pour ce cours.</p></div>:
        chapterIds.map(chId=>{
          const chCards=courseCards.filter(c=>c.chapterId===chId);
          const chDue=dueIn(chCards);

          const expanded=expandedCh===chId;
          return<div key={chId}>
            <div style={{display:"flex",alignItems:"center",padding:"9px 18px",gap:10,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>

                {chDue>0&&<span style={{fontFamily:mono,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:10,background:"var(--c-violet)",color:"var(--c-onSolid)"}}>{chDue}</span>}
              </div>
              <div style={{display:"flex",gap:5,flexShrink:0}}>

                <button onClick={()=>setExpandedCh(expanded?null:chId)} style={{fontFamily:font,fontSize:10,padding:"5px 8px",cursor:"pointer",borderRadius:6,border:`1px solid ${C.border}`,background:expanded?C.bg:"transparent",color:C.textMed}}>{expanded?"▲ Masquer":`▼ Voir (${chCards.length})`}</button>
              </div>
            </div>
            {expanded&&<div style={{background:"var(--c-listBg)"}}>
              {chCards.map(card=>{

                  <div style={{width:3,height:"100%",background:pC(card.packetId),borderRadius:2,flexShrink:0,marginTop:2}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:5}}>
                      <Tag color={pC(card.packetId)} bg={pB(card.packetId)} small>{pkLabel}</Tag>
                      {dueCard&&<Tag color={C.accent} bg={C.accentBg} small>À réviser</Tag>}
                      {isIntegrated&&<Tag color={C.good} bg={C.goodBg} small>🔗 Intégré</Tag>}
                    </div>
                    {isOcclusion(card)?<p style={{fontFamily:serif,fontSize:13,color:C.textMed,margin:0}}>🖼 Image Occlusion</p>:<>
                      <p style={{fontFamily:serif,fontSize:13,color:C.text,margin:"0 0 2px",lineHeight:1.4}}>{card.front}</p>

      <p style={{fontFamily:mono,fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.textLt,margin:"0 0 9px"}}>Méthode de révision</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {MYCARD_METHODS.map(m=>{
          const active=method===m.id;
          const n=countFor(userCards,m.id);
          return<button key={m.id} onClick={()=>setMethod(m.id)} style={{fontFamily:font,fontSize:12,fontWeight:active?600:400,padding:"8px 14px",cursor:"pointer",borderRadius:7,border:`1.5px solid ${active?"var(--c-violet)":C.border}`,background:active?"var(--c-violetBg2)":"transparent",color:active?"var(--c-violet)":C.textMed,display:"flex",alignItems:"center",gap:7}}>
            <span>{m.icon} {m.label}</span>
            <span style={{fontFamily:mono,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:10,background:n>0?(active?"var(--c-violet)":C.border):"transparent",color:n>0?(active?"var(--c-onSolid)":C.textMed):C.textLt}}>{n}</span>
          </button>;
        })}
      </div>
      <p style={{fontSize:11,color:C.textLt,margin:"9px 0 0",lineHeight:1.5}}>{MYCARD_METHODS.find(m=>m.id===method)?.help}</p>
    </div>}
    {integratedCount>0&&<div style={{background:C.goodBg,border:`1px solid var(--c-goodSoft)`,borderRadius:8,padding:"10px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:8}}><span>🔗</span><p style={{fontSize:12,color:C.good,margin:0}}><strong>{integratedCount} carte{integratedCount>1?"s":""} intégrée{integratedCount>1?"s":""}</strong> — apparaissent dans les onglets Semestre 1/2 aux côtés des cartes officielles</p></div>}
    {userCards.length===0?<div style={{border:`1.5px dashed ${C.border}`,borderRadius:12,padding:"48px 24px",textAlign:"center",background:C.surface}}>
      <p style={{fontSize:36,margin:"0 0 12px"}}>✏️</p>
      <p style={{fontFamily:serif,fontSize:18,margin:"0 0 8px"}}>Aucune carte personnelle</p>
      <p style={{fontSize:13,color:C.textMed,margin:"0 0 20px",lineHeight:1.6}}>Crée tes propres flashcards pour compléter les cours officiels, ou lance-toi un cours personnel rien qu'à toi.</p>
      <Btn fill onClick={onNew}>Créer ma première carte →</Btn>
    </div>:<div>
      {activeGroups.map(g=><GroupPanel key={g.id} group={g}/>)}
      {personalCourseNames.length>0&&<>
        <p style={{fontFamily:serif,fontSize:16,margin:"20px 0 10px"}}>Mes cours personnels</p>
        {personalCourseNames.map(name=><PersonalCoursePanel key={name} courseName={name}/>)}
      </>}
    </div>}
    {delId&&<Modal onClose={()=>setDelId(null)} width={320}><p style={{fontFamily:serif,fontSize:20,margin:"0 0 8px"}}>Supprimer cette carte ?</p><p style={{fontSize:13,color:C.textMed,margin:"0 0 24px"}}>Action irréversible.</p><div style={{display:"flex",gap:10}}><Btn fill danger onClick={()=>{onDelete(delId);setDelId(null);}}>Supprimer</Btn><Btn onClick={()=>setDelId(null)}>Annuler</Btn></div></Modal>}
  </div>;
}
// ─── Rang (gamification) ──────────────────────────────────────────────────────
function RankBadge({pts,size=92}){
  const i=rankIndexFor(pts),r=RANKS[i];
  return <div style={{width:size,height:size,borderRadius:"50%",background:r.bg,border:`3px solid ${r.col}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
    <span style={{fontSize:size*0.3,lineHeight:1}}>{RANK_ICONS[r.tier]||"🏆"}</span>
    <span style={{fontFamily:mono,fontSize:size*0.11,letterSpacing:1,color:r.col,fontWeight:700,marginTop:4,textAlign:"center",padding:"0 4px"}}>{r.name.toUpperCase()}</span>
  </div>;
}
function RankTab({username,tick}){
  const [refresh,setRefresh]=useState(0);
  const [sub,setSub]=useState("board");
  const [prefs,setPrefs]=useState(()=>getRankPrefs(username));
  const [board,setBoard]=useState(undefined); // undefined = chargement · null = indisponible
  const data=useMemo(()=>getPoints(username),[username,tick,refresh]);
  const today=data.days[dateKey()]||emptyPointsDay();
  const pts=today.points;
  const ri=rankIndexFor(pts),rank=RANKS[ri],next=RANKS[ri+1]||null;
  const pctToNext=next?Math.min(1,(pts-rank.min)/(next.min-rank.min)):1;
  useEffect(()=>{
    let alive=true;
    (async()=>{
      setBoard(b=>b===undefined?undefined:b);
      if(prefs.share){
        const d=todayPoints(username);
        await supa.upsertDailyPoints(username,dateKey(),d.points,d.cards,rankDisplayName(username,prefs.anon),prefs.anon);
      }
      const rows=await supa.getLeaderboard(dateKey());
      if(alive) setBoard(rows);
    })();
    return()=>{alive=false;};
  },[username,prefs.share,prefs.anon,tick,refresh]);
  const applyPrefs=async p=>{
    setPrefs(p); saveRankPrefs(username,p);
    if(p.share){
      const d=todayPoints(username);
      await supa.upsertDailyPoints(username,dateKey(),d.points,d.cards,rankDisplayName(username,p.anon),p.anon);
    } else {
      await supa.deleteDailyPoints(username);
    }
    setRefresh(r=>r+1);
  };
  // Historique 30 jours
  const history=useMemo(()=>{
    const out=[];
    for(let i=29;i>=0;i--){
      const k=dateKey(new Date(Date.now()-i*86400000));
      out.push({key:k,pts:data.days[k]?.points||0,cards:data.days[k]?.cards||0});
    }
    return out;
  },[data]);
  const maxHist=Math.max(1,...history.map(h=>h.pts));
  const best=history.reduce((a,h)=>Math.max(a,h.pts),0);
  const sum30=history.reduce((a,h)=>a+h.pts,0);
  const Toggle=({on,onClick,children,col})=>(
    <button onClick={onClick} style={{fontFamily:font,fontSize:12,fontWeight:500,padding:"8px 14px",cursor:"pointer",borderRadius:7,border:`1.5px solid ${on?(col||C.accent):C.border}`,background:on?(col?col+"14":C.accentBg):"transparent",color:on?(col||C.accent):C.textMed,display:"flex",alignItems:"center",gap:8}}>
      <span style={{width:15,height:15,borderRadius:4,border:`1.5px solid ${on?(col||C.accent):C.border}`,background:on?(col||C.accent):"transparent",color:"var(--c-onSolid)",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on?"✓":""}</span>
      {children}
    </button>
  );
  const SubTab=({id,label})=><button onClick={()=>setSub(id)} style={{fontFamily:font,fontSize:12,fontWeight:sub===id?600:400,padding:"7px 14px",cursor:"pointer",border:"none",borderBottom:`2px solid ${sub===id?"var(--c-gold)":"transparent"}`,background:"transparent",color:sub===id?"var(--c-gold)":C.textMed,marginBottom:-1}}>{label}</button>;
  const myName=rankDisplayName(username,prefs.anon);
  return(
    <div style={{animation:"fadeIn 0.18s ease"}}>
      <p style={{fontFamily:serif,fontSize:18,margin:"0 0 4px"}}>Rang du jour</p>
      <p style={{fontSize:13,color:C.textMed,margin:"0 0 22px"}}>Les points sont remis à zéro chaque jour à minuit · seules les cartes réellement consolidées en rapportent</p>

      {/* Carte principale */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"22px",display:"flex",gap:22,alignItems:"center",flexWrap:"wrap",marginBottom:16}}>
        <RankBadge pts={pts}/>
        <div style={{flex:1,minWidth:220}}>
          <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 6px"}}>Rang actuel</p>
          <p style={{fontFamily:serif,fontSize:26,margin:"0 0 2px",color:rank.col}}>{rank.name}</p>
          <p style={{fontSize:13,color:C.textMed,margin:"0 0 14px"}}><strong style={{color:C.text,fontSize:16}}>{pts}</strong> point{pts>1?"s":""} aujourd'hui · {today.cards} carte{today.cards>1?"s":""} comptabilisée{today.cards>1?"s":""}</p>
          <div style={{height:9,background:"var(--c-track)",borderRadius:6,overflow:"hidden"}}>
            <div style={{height:9,width:`${pctToNext*100}%`,background:rank.col,borderRadius:6,transition:"width 0.4s"}}/>
          </div>
          <p style={{fontSize:11,color:C.textLt,margin:"7px 0 0"}}>
            {next?<>Encore <strong style={{color:C.text}}>{next.min-pts}</strong> point{next.min-pts>1?"s":""} pour atteindre <strong style={{color:next.col}}>{next.name}</strong></>:<>Rang maximum atteint — bravo 🔥</>}
          </p>
        </div>
      </div>

      {/* Détail des points du jour */}
      {pts>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:12,marginBottom:20}}>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px"}}>
          <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 12px"}}>Points par ancienneté</p>
          {["new","young","mid","old"].map(a=><div key={a} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",fontSize:12,color:C.textMed}}>
            <span>{AGE_LABELS[a]} <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>({AGE_VALUES[a]} pt{AGE_VALUES[a]>1?"s":""})</span></span>
            <strong style={{color:today.byAge[a]?C.text:C.textLt}}>{today.byAge[a]||0}</strong>
          </div>)}
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px"}}>
          <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 12px"}}>Points par importance</p>
          {["prioritaire","important","utile"].map(k=><div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",fontSize:12,color:C.textMed}}>
            <span style={{color:pC(k)}}>{IMP_LABELS[k]} <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>(+{IMP_BONUS[k]})</span></span>
            <strong style={{color:today.byImp[k]?C.text:C.textLt}}>{today.byImp[k]||0}</strong>
          </div>)}
        </div>
      </div>}

      <div style={{display:"flex",gap:0,marginBottom:16,borderBottom:`1px solid ${C.border}`,flexWrap:"wrap"}}>
        <SubTab id="board" label="🌍 Classement"/>
        <SubTab id="history" label="📈 Historique 30 j"/>
        <SubTab id="ladder" label="🏅 Les 18 rangs"/>
        <SubTab id="help" label="❓ Comment gagner des points"/>
      </div>

      {sub==="board"&&<div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px",marginBottom:14}}>
          <p style={{fontSize:13,color:C.textMed,margin:"0 0 12px",lineHeight:1.6}}>Le classement public est <strong>facultatif</strong>. Tu peux y participer sous ton nom d'utilisateur ou de façon anonyme, et te retirer à tout moment (ta ligne est alors supprimée).</p>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Toggle on={prefs.share} col="var(--c-gold)" onClick={()=>applyPrefs({...prefs,share:!prefs.share})}>Participer au classement public</Toggle>
            <Toggle on={prefs.anon} col={C.accent} onClick={()=>prefs.share&&applyPrefs({...prefs,anon:!prefs.anon})}>Apparaître comme « Anonyme »</Toggle>
          </div>
          {prefs.share&&<p style={{fontSize:11,color:C.textLt,margin:"10px 0 0"}}>Tu apparais sous le nom : <strong style={{color:C.text}}>{myName}</strong></p>}
        </div>
        {board===undefined?(
          <p style={{fontSize:13,color:C.textLt,padding:"20px 0",textAlign:"center"}}>Chargement du classement…</p>
        ):board===null?(
          <div style={{border:`1.5px dashed ${C.border}`,borderRadius:10,padding:"22px",background:C.surface}}>
            <p style={{fontSize:13,color:C.textMed,margin:"0 0 10px",lineHeight:1.6}}>⚠️ Le classement collectif n'est pas disponible : la table <code style={{fontFamily:mono,fontSize:11,background:"var(--c-chipBg)",padding:"1px 5px",borderRadius:4}}>daily_points</code> n'existe pas encore dans Supabase. Ton rang personnel fonctionne normalement.</p>
            <p style={{fontSize:11,color:C.textLt,margin:0,lineHeight:1.6}}>À créer une fois dans l'éditeur SQL Supabase (voir le fichier <code style={{fontFamily:mono,fontSize:10}}>supabase_daily_points.sql</code>).</p>
          </div>
        ):board.length===0?(
          <p style={{fontSize:13,color:C.textLt,padding:"20px 0",textAlign:"center"}}>Personne n'a encore marqué de points aujourd'hui. Sois le premier !</p>
        ):(
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
            {board.map((row,i)=>{
              const me=!!row.user_id&&row.user_id===sbUserId();
              const r=rankFor(row.points||0);
              const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":null;
              return <div key={(row.user_id||"x")+i}style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderTop:i?`1px solid ${C.border}`:"none",background:me?C.accentBg:"transparent"}}>
                <span style={{fontFamily:mono,fontSize:12,color:C.textLt,minWidth:30,textAlign:"right"}}>{medal||`#${i+1}`}</span>
                <span style={{flex:1,fontSize:13,fontWeight:me?600:400,color:me?C.accent:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {row.anonymous?"Anonyme":(row.display_name||"Étudiant")}{me&&<span style={{fontFamily:mono,fontSize:9,marginLeft:8,color:C.accent}}>TOI</span>}
                </span>
                <span style={{fontFamily:mono,fontSize:10,padding:"2px 8px",borderRadius:10,background:r.bg,color:r.col,fontWeight:700,whiteSpace:"nowrap"}}>{RANK_ICONS[r.tier]} {r.name}</span>
                <strong style={{fontFamily:serif,fontSize:16,minWidth:52,textAlign:"right"}}>{row.points}</strong>
              </div>;
            })}
          </div>
        )}
      </div>}

      {sub==="history"&&<div>
        <div className="mfc-autofill" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12,marginBottom:18}}>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px"}}>
            <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 8px"}}>Meilleur jour</p>
            <p style={{fontFamily:serif,fontSize:26,margin:"0 0 2px"}}>{best}</p>
            <p style={{fontSize:11,color:C.textMed,margin:0}}>{rankFor(best).name}</p>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px"}}>
            <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 8px"}}>Total 30 jours</p>
            <p style={{fontFamily:serif,fontSize:26,margin:"0 0 2px"}}>{sum30}</p>
            <p style={{fontSize:11,color:C.textMed,margin:0}}>points cumulés</p>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px"}}>
            <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 8px"}}>Jours marqués</p>
            <p style={{fontFamily:serif,fontSize:26,margin:"0 0 2px"}}>{history.filter(h=>h.pts>0).length}</p>
            <p style={{fontSize:11,color:C.textMed,margin:0}}>sur 30</p>
          </div>
        </div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px"}}>
          <p style={{fontFamily:serif,fontSize:16,margin:"0 0 16px"}}>Points par jour</p>
          <div style={{display:"flex",alignItems:"flex-end",gap:3,height:130}}>
            {history.map(h=>{
              const r=rankFor(h.pts);
              return <div key={h.key} title={`${h.key} · ${h.pts} pts · ${h.cards} cartes`} style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",height:"100%"}}>
                <div style={{height:`${Math.max(h.pts?4:1,(h.pts/maxHist)*100)}%`,background:h.pts?r.col:"var(--c-borderSoft)",borderRadius:"3px 3px 0 0",transition:"height 0.3s"}}/>
              </div>;
            })}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
            <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>il y a 30 j</span>
            <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>aujourd'hui</span>
          </div>
        </div>
      </div>}

      {sub==="ladder"&&<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
        {RANKS.map((r,i)=>{
          const cur=i===ri, reached=pts>=r.min;
          return <div key={r.name} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderTop:i?`1px solid ${C.border}`:"none",background:cur?r.bg:"transparent",opacity:reached||cur?1:0.65}}>
            <span style={{fontSize:16,width:24,textAlign:"center"}}>{RANK_ICONS[r.tier]}</span>
            <span style={{flex:1,fontSize:13,fontWeight:cur?700:400,color:cur?r.col:C.text}}>{r.name}{cur&&<span style={{fontFamily:mono,fontSize:9,marginLeft:8,color:r.col}}>RANG ACTUEL</span>}</span>
            <span style={{fontFamily:mono,fontSize:11,color:reached?C.good:C.textLt}}>{reached?"✓ ":""}{r.min.toLocaleString("fr-FR")} pts</span>
          </div>;
        })}
      </div>}

      {sub==="help"&&<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"22px",fontSize:13,color:C.textMed,lineHeight:1.75}}>
        <p style={{fontFamily:serif,fontSize:17,color:C.text,margin:"0 0 10px"}}>1 · Seules les cartes réellement acquises rapportent</p>
        <p style={{margin:"0 0 8px"}}>Quand tu cliques sur un bouton, on regarde le <strong>prochain intervalle</strong> proposé par l'algorithme (celui affiché sur le bouton) :</p>
        <ul style={{margin:"0 0 18px 18px"}}>
          <li>intervalle <strong>inférieur à 1 jour</strong> (minutes, heures) → <strong>0 point</strong> ;</li>
          <li>intervalle <strong>d'au moins 1 jour</strong> → la carte rapporte des points.</li>
        </ul>
        <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px",margin:"0 0 18px"}}>
          <p style={{fontFamily:mono,fontSize:10,letterSpacing:1,color:C.textLt,margin:"0 0 6px",textTransform:"uppercase"}}>Exemple — carte en apprentissage</p>
          <p style={{fontSize:12,margin:0}}>À revoir 1 min · Difficile 5 min · Correct 10 min · <strong style={{color:C.easy}}>Facile 4 jours</strong> → seul <strong>Facile</strong> rapporte des points.</p>
          <p style={{fontFamily:mono,fontSize:10,letterSpacing:1,color:C.textLt,margin:"12px 0 6px",textTransform:"uppercase"}}>Exemple — carte bien connue</p>
          <p style={{fontSize:12,margin:0}}>À revoir 10 min · <strong style={{color:C.hard}}>Difficile 1 j</strong> · <strong style={{color:C.good}}>Correct 5 j</strong> · <strong style={{color:C.easy}}>Facile 20 j</strong> → les trois derniers rapportent des points.</p>
        </div>
        <p style={{fontFamily:serif,fontSize:17,color:C.text,margin:"0 0 10px"}}>2 · Valeur d'une carte</p>
        <p style={{margin:"0 0 8px"}}><strong>Points = valeur d'ancienneté + bonus d'importance</strong></p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12,margin:"0 0 18px"}}>
          <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px"}}>
            <p style={{fontFamily:mono,fontSize:9,letterSpacing:1,color:C.textLt,margin:"0 0 8px",textTransform:"uppercase"}}>Ancienneté</p>
            {["new","young","mid","old"].map(a=><div key={a} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0"}}><span>{AGE_LABELS[a]} <span style={{color:C.textLt,fontSize:11}}>— {AGE_DESC[a]}</span></span><strong style={{whiteSpace:"nowrap",marginLeft:8}}>{AGE_VALUES[a]} pt{AGE_VALUES[a]>1?"s":""}</strong></div>)}
          </div>
          <div style={{border:`1px solid ${C.border}`,borderRadius:8,padding:"12px 14px"}}>
            <p style={{fontFamily:mono,fontSize:9,letterSpacing:1,color:C.textLt,margin:"0 0 8px",textTransform:"uppercase"}}>Importance</p>
            {["prioritaire","important","utile"].map(k=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"3px 0"}}><span style={{color:pC(k)}}>{IMP_LABELS[k]}</span><strong>+{IMP_BONUS[k]}</strong></div>)}
          </div>
        </div>
        <p style={{fontSize:12,color:C.textLt,margin:"0 0 18px"}}>Exemple : une carte <strong>nouvelle</strong> (10) et <strong>prioritaire</strong> (+3) notée « Facile » (4 jours) rapporte <strong style={{color:C.text}}>13 points</strong>.</p>
        <p style={{fontFamily:serif,fontSize:17,color:C.text,margin:"0 0 10px"}}>3 · Protections anti-triche</p>
        <ul style={{margin:"0 0 18px 18px"}}>
          <li><strong>Une carte = des points une seule fois par jour.</strong> Repasser dix fois la même carte dans la journée ne rapporte rien de plus.</li>
          <li><strong>La phase d'apprentissage ne rapporte rien.</strong> Cliquer en boucle sur « À revoir » ou « Difficile » pendant l'apprentissage laisse l'intervalle sous la journée : 0 point.</li>
          <li><strong>Le farming de cartes faciles est peu rentable.</strong> Une carte ancienne, déjà consolidée, ne vaut qu'1 point : l'effort utile (nouvelles cartes, cartes difficiles, cartes prioritaires) est mieux payé.</li>
          <li><strong>Remise à zéro quotidienne.</strong> Le classement porte uniquement sur la journée en cours : c'est la régularité qui compte, pas le cumul.</li>
        </ul>
        <p style={{fontSize:12,color:C.textLt,margin:0}}>L'algorithme de répétition espacée (boutons et intervalles) reste strictement inchangé : le système de points ne fait que l'observer.</p>
      </div>}
    </div>
  );
}
// ─── Forum ────────────────────────────────────────────────────────────────────
// Commun à tous les utilisateurs de MyFlashCard (étudiants ET administrateurs).
// Pseudo des administrateurs en rouge, pseudo des étudiants en bleu. Nécessite
// la table optionnelle "forum_posts" — voir supabase_forum_posts.sql. Sans elle,
// l'onglet affiche un message explicatif au lieu de planter.
function ForumTab({currentUser,pseudo,onRead}){
  const isAdmin=currentUser.role==="admin";
  const [posts,setPosts]=useState(undefined); // undefined = chargement · null = table indisponible
  const [body,setBody]=useState("");
  const [replyTo,setReplyTo]=useState(null);
  const [replyBody,setReplyBody]=useState("");
  const [posting,setPosting]=useState(false);
  const [err,setErr]=useState("");
  // Suppression de ses propres messages : id du message en attente de confirmation.
  const [confirmDel,setConfirmDel]=useState(null);
  const [deleting,setDeleting]=useState(false);
  const [reportFor,setReportFor]=useState(null),[reportReason,setReportReason]=useState("illicite"),[reportComment,setReportComment]=useState(""),[reporting,setReporting]=useState(false),[reportDone,setReportDone]=useState(false);
  const REPORT_REASONS=[["illicite","Contenu illicite ou haineux"],["donnees","Données personnelles d'un tiers"],["spam","Spam ou publicité"],["droits","Atteinte aux droits d'autrui"],["autre","Autre"]];
  const sendReport=async()=>{
    if(!reportFor||reporting)return;
    setReporting(true);
    const ok=await supa.createForumReport({
      post_id:String(reportFor.id),
      reason:reportReason,
      comment:reportComment.trim()||null,
      post_excerpt:(reportFor.body||"").slice(0,500),
      post_author:reportFor.display_name||null,
    });
    setReporting(false);
    if(ok){setReportFor(null);setReportComment("");setReportReason("illicite");setReportDone(true);setTimeout(()=>setReportDone(false),5000);}
    else setErr("Le signalement n'a pas pu être enregistré. Réessaie dans un instant.");
  };
  const toggleHidden=async p=>{
    const ok=await supa.setForumPostHidden(p.id,!p.hidden);
    if(ok)setPosts(list=>Array.isArray(list)?list.map(x=>x.id===p.id?{...x,hidden:!p.hidden}:x):list);
  };
  const load=useCallback(async()=>{
    const rows=await supa.getForumPosts(isAdmin);
    setPosts(rows);
    // Consulter le forum marque tout comme lu — uniquement dans ce navigateur.
    if(onRead&&Array.isArray(rows))onRead(latestOtherPost(rows,sbUserId()));
  },[onRead,currentUser.username]);
  useEffect(()=>{load();},[load]);
  const nameColor=role=>role==="admin"?C.again:C.easy;
  const submit=async(text,parentId)=>{
    const trimmed=(text||"").trim();
    if(!trimmed||posting)return;
    setPosting(true);setErr("");
    try{
      const created=await supa.createForumPost({
        username:currentUser.username,
        display_name:pseudo||defaultPseudo(currentUser.username),
        role:isAdmin?"admin":"student",
        body:trimmed,
        parent_id:parentId||null,
      });
      if(created)setPosts(p=>Array.isArray(p)?[...p,created]:[created]);
      else await load();
      if(parentId){setReplyBody("");setReplyTo(null);} else {setBody("");}
    }catch(e){
      setErr("Impossible d'envoyer le message. Réessaie dans un instant.");
    }finally{setPosting(false);}
  };
  // Un message ne peut être supprimé que par son auteur.
  const canDelete=p=>!!p&&!!p.user_id&&p.user_id===sbUserId();
  // Supprime un message. S'il s'agit d'un message principal, ses réponses sont
  // supprimées avec lui : sans cela elles resteraient en base sans parent et
  // disparaîtraient silencieusement de l'affichage.
  const handleDelete=async id=>{
    if(deleting)return;
    const target=Array.isArray(posts)?posts.find(p=>p.id===id):null;
    if(!target||!canDelete(target))return;
    const replyIds=Array.isArray(posts)&&!target.parent_id
      ? posts.filter(p=>p.parent_id===id).map(p=>p.id)
      : [];
    const toRemove=new Set([id,...replyIds]);
    setDeleting(true);setErr("");
    try{
      await Promise.all([...toRemove].map(x=>supa.deleteForumPost(x)));
      setPosts(p=>Array.isArray(p)?p.filter(x=>!toRemove.has(x.id)):p);
      setConfirmDel(null);
      if(replyTo===id)setReplyTo(null);
    }catch(e){
      setErr("Impossible de supprimer le message. Réessaie dans un instant.");
    }finally{setDeleting(false);}
  };
  const fmtDate=iso=>{
    try{
      const d=new Date(iso);
      const now=Date.now();
      const diffH=(now-d.getTime())/3600000;
      if(diffH<24)return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
    }catch{return"";}
  };
  const topLevel=useMemo(()=>Array.isArray(posts)?posts.filter(p=>!p.parent_id):[],[posts]);
  const repliesOf=useMemo(()=>{
    const m={};
    if(Array.isArray(posts))posts.filter(p=>p.parent_id).forEach(p=>{(m[p.parent_id]=m[p.parent_id]||[]).push(p);});
    return m;
  },[posts]);
  const renderPost=(p,isReply)=><div style={{padding:isReply?"10px 0 0 28px":"14px 0",borderTop:isReply?"none":`1px solid ${C.border}`}}>
    <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap",marginBottom:4}}>
      <strong style={{fontSize:13,color:nameColor(p.role)}}>{p.display_name||defaultPseudo(p.username)}</strong>
      {p.role==="admin"&&<Tag color={C.again} bg={C.againBg} small>Admin</Tag>}
      <span style={{fontSize:11,color:C.textLt}}>{fmtDate(p.created_at)}</span>
    </div>
    {p.hidden&&<p style={{fontFamily:mono,fontSize:10,letterSpacing:1.5,textTransform:"uppercase",color:C.imp,background:C.impBg,borderRadius:4,padding:"3px 8px",display:"inline-block",margin:"0 0 6px"}}>Masqué — visible des seuls administrateurs</p>}
    <p style={{fontSize:13.5,color:C.text,margin:"0 0 6px",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{p.body}</p>
    <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
      {!isReply&&<button onClick={()=>{setReplyTo(replyTo===p.id?null:p.id);setReplyBody("");}} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,textDecoration:"underline",padding:0}}>{replyTo===p.id?"Annuler":"↩ Répondre"}</button>}
      {!canDelete(p)&&<button onClick={()=>{setReportFor(p);setReportComment("");}} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,textDecoration:"underline",padding:0}}>⚑ Signaler</button>}
      {isAdmin&&<button onClick={()=>toggleHidden(p)} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:p.hidden?C.good:C.imp,textDecoration:"underline",padding:0}}>{p.hidden?"↩ Réafficher":"👁 Masquer"}</button>}
      {canDelete(p)&&confirmDel!==p.id&&<button onClick={()=>setConfirmDel(p.id)} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,textDecoration:"underline",padding:0}}>🗑 Supprimer</button>}
      {canDelete(p)&&confirmDel===p.id&&<span style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:C.again}}>{!isReply&&(repliesOf[p.id]||[]).length>0?`Supprimer ce message et ses ${(repliesOf[p.id]||[]).length} réponse${(repliesOf[p.id]||[]).length>1?"s":""} ?`:"Supprimer définitivement ce message ?"}</span>
        <button onClick={()=>handleDelete(p.id)} disabled={deleting} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"4px 10px",cursor:deleting?"wait":"pointer",borderRadius:5,border:`1.5px solid ${C.again}`,background:C.againBg,color:C.again}}>{deleting?"Suppression…":"Confirmer"}</button>
        <button onClick={()=>setConfirmDel(null)} disabled={deleting} style={{fontFamily:font,fontSize:11,padding:"4px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${C.border}`,background:"transparent",color:C.textMed}}>Annuler</button>
      </span>}
    </div>
    {!isReply&&replyTo===p.id&&<div style={{marginTop:8,display:"flex",gap:8}}>
      <input style={{...iLine,flex:1}} placeholder={isAdmin?"Ta réponse (pseudo en rouge)…":"Ta réponse…"} value={replyBody} onChange={e=>setReplyBody(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit(replyBody,p.id)} autoFocus/>
      <Btn small fill onClick={()=>submit(replyBody,p.id)} disabled={!replyBody.trim()||posting}>Envoyer</Btn>
    </div>}
    {!isReply&&(repliesOf[p.id]||[]).map(r=><React.Fragment key={r.id}>{renderPost(r,true)}</React.Fragment>)}
  </div>;
  return <div style={{animation:"fadeIn 0.18s ease"}}>
    <p style={{fontFamily:serif,fontSize:18,margin:"0 0 4px"}}>Forum</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 20px"}}>Espace d'échange commun à tous les utilisateurs de MyFlashCard.</p>
    <div style={{background:C.impBg,border:`1px solid var(--c-goldSoft)`,borderRadius:8,padding:"10px 14px",marginBottom:20}}>
      <p style={{fontSize:12,color:C.imp,margin:0,lineHeight:1.6}}>Les messages ci-dessous sont publiés par des étudiants. Ce ne sont pas des réponses pédagogiques officielles de MyFlashCard et ils peuvent contenir des erreurs.</p>
    </div>
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"16px 18px",marginBottom:20}}>
      <p style={{fontSize:12,color:C.textLt,margin:"0 0 8px"}}>Tu postes sous le pseudo : <strong style={{color:nameColor(isAdmin?"admin":"student")}}>{pseudo||defaultPseudo(currentUser.username)}</strong> {isAdmin&&<span style={{color:C.textLt}}>(modifiable dans Réglages → Profil)</span>}</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <textarea style={{...iBox,flex:"1 1 260px",minHeight:60}} placeholder="Pose ta question ou partage quelque chose avec la communauté…" value={body} onChange={e=>setBody(e.target.value)} rows={2}/>
        <Btn fill onClick={()=>submit(body,null)} disabled={!body.trim()||posting} style={{alignSelf:"flex-end"}}>{posting?"Envoi…":"Publier"}</Btn>
      </div>
      {err&&<p style={{fontSize:12,color:C.again,margin:"8px 0 0"}}>{err}</p>}
      {reportDone&&<p style={{fontSize:12,color:C.good,margin:"8px 0 0"}}>✓ Signalement transmis aux administrateurs. Merci.</p>}
      <p style={{fontSize:11,color:C.textLt,margin:"10px 0 0",lineHeight:1.6}}>En publiant, tu acceptes de respecter les <a href="/cgu.html" target="_blank" rel="noopener noreferrer" style={{color:C.accent}}>CGU MyFlashCard</a>. Ne publie pas de données personnelles sensibles ni de contenu illicite ou portant atteinte aux droits d'autrui.</p>
    </div>
    {posts===undefined?(
      <p style={{fontSize:13,color:C.textLt,padding:"24px 0",textAlign:"center"}}>Chargement du forum…</p>
    ):posts===null?(
      <div style={{border:`1.5px dashed ${C.border}`,borderRadius:10,padding:"22px",background:C.surface}}>
        <p style={{fontSize:13,color:C.textMed,margin:"0 0 10px",lineHeight:1.6}}>⚠️ Le forum n'est pas encore disponible : la table <code style={{fontFamily:mono,fontSize:11,background:"var(--c-chipBg)",padding:"1px 5px",borderRadius:4}}>forum_posts</code> n'existe pas encore dans Supabase.</p>
        <p style={{fontSize:11,color:C.textLt,margin:0,lineHeight:1.6}}>À créer une fois dans l'éditeur SQL Supabase — voir le fichier <code style={{fontFamily:mono,fontSize:10}}>supabase_forum_posts.sql</code>.</p>
      </div>
    ):topLevel.length===0?(
      <p style={{fontSize:13,color:C.textLt,padding:"24px 0",textAlign:"center"}}>Aucun message pour l'instant — sois le premier à écrire !</p>
    ):(
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"0 18px"}}>
        {[...topLevel].reverse().map(p=><React.Fragment key={p.id}>{renderPost(p,false)}</React.Fragment>)}
      </div>
    )}
        {reportFor&&<Modal onClose={()=>setReportFor(null)} width={420}>
      <p style={{fontFamily:serif,fontSize:20,margin:"0 0 6px"}}>Signaler ce message</p>
      <p style={{fontSize:12,color:C.textMed,margin:"0 0 16px",lineHeight:1.6}}>Le message et son auteur sont transmis aux administrateurs, qui décideront de la suite. Aucune sanction n'est automatique.</p>
      <div style={{background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 12px",marginBottom:16,maxHeight:120,overflowY:"auto"}}>
        <p style={{fontSize:12,color:C.textMed,margin:0,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{(reportFor.body||"").slice(0,300)}</p>
      </div>
      <Lbl>Motif</Lbl>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
        {REPORT_REASONS.map(([id,lbl])=>(
          <label key={id} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",fontSize:12.5,padding:"8px 10px",borderRadius:7,border:`1.5px solid ${reportReason===id?C.accent:C.border}`,background:reportReason===id?C.accentBg:"transparent",color:reportReason===id?C.accent:C.text}}>
            <input type="radio" checked={reportReason===id} onChange={()=>setReportReason(id)} style={{accentColor:C.accent,flexShrink:0}}/>{lbl}
          </label>
        ))}
      </div>
      <Lbl>Précision (facultatif)</Lbl>
      <textarea style={{...iBox,minHeight:60,marginTop:4}} value={reportComment} onChange={e=>setReportComment(e.target.value.slice(0,500))} placeholder="Ce qui te paraît problématique…"/>
      <div style={{display:"flex",gap:10,marginTop:18}}>
        <Btn fill full onClick={sendReport} disabled={reporting}>{reporting?"Envoi…":"Envoyer le signalement"}</Btn>
        <Btn full onClick={()=>setReportFor(null)}>Annuler</Btn>
      </div>
    </Modal>}
  </div>;
}
// ─── Signalements (espace administrateur) ─────────────────────────────────────
function AdminReports(){
  const [rows,setRows]=useState(undefined),[busy,setBusy]=useState(null);
  const load=useCallback(async()=>{ setRows(await supa.getForumReports()); },[]);
  useEffect(()=>{load();},[load]);
  const LABELS={illicite:"Contenu illicite ou haineux",donnees:"Données personnelles d'un tiers",spam:"Spam ou publicité",droits:"Atteinte aux droits d'autrui",autre:"Autre"};
  const act=async(rep,action)=>{
    setBusy(rep.id);
    try{
      if(action==="hide")   await supa.setForumPostHidden(rep.post_id,true);
      if(action==="show")   await supa.setForumPostHidden(rep.post_id,false);
      if(action==="delete") await supa.deleteForumPost(rep.post_id);
      await supa.setForumReportStatus(rep.id, action==="reject"?"rejected":"handled");
      await load();
    } finally { setBusy(null); }
  };
  const open=(rows||[]).filter(r=>r.status==="open");
  const done=(rows||[]).filter(r=>r.status!=="open");
  const Card=({r})=>(
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"14px 16px",marginBottom:8}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:8}}>
        <Tag color={C.again} bg={C.againBg} small>{LABELS[r.reason]||r.reason}</Tag>
        <span style={{fontSize:11,color:C.textLt}}>{new Date(r.created_at).toLocaleString("fr-FR")}</span>
        {r.post_author&&<span style={{fontSize:11,color:C.textLt}}>· auteur : {r.post_author}</span>}
        {r.status!=="open"&&<Tag color={C.textMed} bg={C.bg} small>{r.status==="handled"?"Traité":"Écarté"}</Tag>}
      </div>
      <p style={{fontSize:12.5,color:C.text,margin:"0 0 8px",lineHeight:1.6,whiteSpace:"pre-wrap",background:C.bg,border:`1px solid ${C.border}`,borderRadius:6,padding:"8px 10px"}}>{r.post_excerpt||"(message vide)"}</p>
      {r.comment&&<p style={{fontSize:12,color:C.textMed,margin:"0 0 8px",lineHeight:1.6}}>Précision : {r.comment}</p>}
      {r.status==="open"&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <Btn small onClick={()=>act(r,"hide")} disabled={busy===r.id}>👁 Masquer le message</Btn>
        <Btn small onClick={()=>act(r,"show")} disabled={busy===r.id}>↩ Réafficher</Btn>
        <Btn small danger onClick={()=>act(r,"delete")} disabled={busy===r.id}>🗑 Supprimer</Btn>
        <Btn small onClick={()=>act(r,"reject")} disabled={busy===r.id}>Écarter</Btn>
      </div>}
    </div>
  );
  return <div style={{maxWidth:700,margin:"0 auto",padding:24}}>
    <p style={{fontFamily:serif,fontSize:18,margin:"0 0 4px"}}>Signalements</p>
    <p style={{fontSize:12,color:C.textMed,margin:"0 0 20px",lineHeight:1.6}}>Masquer retire le message aux étudiants sans l'effacer. Supprimer est définitif. Écarter classe le signalement sans rien changer.</p>
    {rows===undefined?<p style={{fontSize:13,color:C.textLt,textAlign:"center",padding:"24px 0"}}>Chargement…</p>
     :rows===null?<p style={{fontSize:13,color:C.again,textAlign:"center",padding:"24px 0"}}>La table forum_reports n'est pas accessible.</p>
     :rows.length===0?<p style={{fontSize:13,color:C.textLt,textAlign:"center",padding:"24px 0"}}>Aucun signalement.</p>
     :<>
        {open.length>0&&<p style={{fontFamily:mono,fontSize:10,letterSpacing:2,textTransform:"uppercase",color:C.again,margin:"0 0 8px"}}>À traiter — {open.length}</p>}
        {open.map(r=><Card key={r.id} r={r}/>)}
        {done.length>0&&<p style={{fontFamily:mono,fontSize:10,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"20px 0 8px"}}>Historique</p>}
        {done.map(r=><Card key={r.id} r={r}/>)}
      </>}
  </div>;
}
// ─── Cours PDF : composants partagés ──────────────────────────────────────────
// Liste des chapitres d'un cours pour la partie « Cours ». On repart de la même
// table que les flashcards, étendue si un PDF a été déposé sur un chapitre qui
// n'y figure pas encore. Une matière sans chapitres déclarés retombe sur une
// entrée unique « Cours complet ».
const getLessonChapters = (groupId, num, cards, lessons) => {
  const base = getDisplayChapters(groupId, num, cards||[]);
  const maxL = (lessons||[]).filter(l=>l.groupId===groupId&&l.num===num).reduce((m,l)=>Math.max(m,l.chapterId||1),0);
  if (base.length === 0) return maxL > 1 ? Array.from({length:maxL},(_,i)=>`Partie ${i+1}`) : ["Cours complet"];
  if (maxL <= base.length) return base;
  const ext = [...base];
  for (let i = base.length + 1; i <= maxL; i++) ext.push(`Chapitre ${i}`);
  return ext;
};

// ─── Lecteur PDF intégré (rendu par PDF.js) ──────────────────────────────────
// Pourquoi ne pas se contenter d'une <iframe> ? Sur iPad / iPhone (et sur la
// plupart des navigateurs de tablette), WebKit n'affiche qu'un *aperçu* du PDF
// dans une iframe : la première page seulement, sans défilement possible. Le
// document est aussi téléchargé d'un bloc, ce qui bloque l'affichage plusieurs
// secondes sur un cours de 20 Mo. On rend donc les pages nous-mêmes :
//   • PDF.js lit le fichier en flux (requêtes Range) → la page 1 s'affiche
//     presque tout de suite, le reste arrive au fil du défilement ;
//   • chaque page est dessinée seulement quand elle approche de l'écran, et
//     libérée quand elle s'en éloigne → mémoire maîtrisée sur tablette ;
//   • le défilement est un simple scroll vertical, identique partout.
// En cas de problème (CDN injoignable, PDF corrompu…), on retombe sur l'ancien
// comportement : iframe sur ordinateur, ouverture dans un nouvel onglet ailleurs.
const PDFJS_VERSION = "3.11.174";
const PDFJS_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}`;
const isAppleTouch = () => {
  try{
    const ua = navigator.userAgent || "";
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
  }catch{ return false; }
};
// Chargement paresseux de la bibliothèque : rien n'est téléchargé tant que
// l'étudiant n'a pas ouvert un cours. La promesse est mise en cache, donc le
// second cours s'ouvre instantanément.
let pdfjsPromise = null;
function loadPdfJs(){
  if (window.pdfjsLib && window.pdfjsLib.getDocument) {
    try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/legacy/build/pdf.worker.min.js`; }catch{}
    return Promise.resolve(window.pdfjsLib);
  }
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = `${PDFJS_BASE}/legacy/build/pdf.min.js`;
    s.async = true;
    s.onload = () => {
      if (!window.pdfjsLib || !window.pdfjsLib.getDocument) { pdfjsPromise = null; reject(new Error("pdfjs")); return; }
      try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/legacy/build/pdf.worker.min.js`; }catch{}
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { pdfjsPromise = null; reject(new Error("cdn")); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
// Surface maximale d'un canvas. Safari iOS refuse d'allouer au-delà d'environ
// 16 millions de pixels et rend alors une page blanche : on reste largement en
// dessous, quitte à baisser la finesse sur les très grands écrans.
const MAX_CANVAS_PIXELS = 6.5e6;
// Une page du document. Elle n'existe à l'écran que sous forme de bloc vide
// (aux bonnes proportions) tant qu'elle est loin du regard ; le canvas est créé
// à l'approche puis détruit une fois la page repartie, ce qui évite de garder
// 200 images en mémoire.
function PdfPageView({pdf,pageNum,cssWidth,ratio,onRatio,onActive}){
  const holderRef = useRef(null);
  const canvasRef = useRef(null);
  const [near,setNear] = useState(pageNum <= 2);
  const [drawn,setDrawn] = useState(false);
  // Proximité de l'écran : on prépare une bonne hauteur d'avance pour que le
  // défilement rapide ne montre pas de blanc.
  useEffect(()=>{
    const el = holderRef.current;
    if(!el || typeof IntersectionObserver === "undefined"){ setNear(true); return; }
    const root = el.closest("[data-pdf-scroll]") || null;
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>setNear(e.isIntersecting));
    },{root,rootMargin:"900px 0px 900px 0px",threshold:0});
    io.observe(el);
    return ()=>io.disconnect();
  },[]);
  // Page « courante » pour le compteur du bandeau : celle qui occupe le centre.
  useEffect(()=>{
    const el = holderRef.current;
    if(!el || !onActive || typeof IntersectionObserver === "undefined") return;
    const root = el.closest("[data-pdf-scroll]") || null;
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting) onActive(pageNum); });
    },{root,rootMargin:"-45% 0px -45% 0px",threshold:0});
    io.observe(el);
    return ()=>io.disconnect();
  },[pageNum,onActive]);
  // Dessin effectif.
  useEffect(()=>{
    if(!near || !pdf || !cssWidth) return;
    let cancelled = false, task = null;
    setDrawn(false);
    (async()=>{
      try{
        const page = await pdf.getPage(pageNum);
        if(cancelled) return;
        const base = page.getViewport({scale:1});
        if(onRatio && base.width) onRatio(pageNum, base.height/base.width);
        // Résolution : on suit la densité de l'écran (plafonnée à 2) puis on
        // rabote si la surface dépasse ce que la tablette sait allouer.
        let dpr = Math.min(window.devicePixelRatio || 1, 2);
        const cssHeight = cssWidth * (base.height / base.width);
        const area = cssWidth * cssHeight * dpr * dpr;
        if(area > MAX_CANVAS_PIXELS) dpr = Math.max(1, dpr * Math.sqrt(MAX_CANVAS_PIXELS / area));
        const viewport = page.getViewport({scale:(cssWidth * dpr) / base.width});
        const canvas = canvasRef.current;
        if(!canvas) return;
        canvas.width = Math.max(1, Math.floor(viewport.width));
        canvas.height = Math.max(1, Math.floor(viewport.height));
        canvas.style.width = "100%";
        canvas.style.height = "auto";
        const ctx = canvas.getContext("2d",{alpha:false});
        task = page.render({canvasContext:ctx, viewport});
        await task.promise;
        if(!cancelled) setDrawn(true);
      }catch(e){
        // Un rendu annulé (page repartie, zoom modifié) n'est pas une erreur.
      }
    })();
    return ()=>{
      cancelled = true;
      if(task){ try{ task.cancel(); }catch{} }
      const c = canvasRef.current;
      if(c){ try{ c.width = 0; c.height = 0; }catch{} }
    };
  },[near,pdf,pageNum,cssWidth]);
  const height = Math.round(cssWidth * (ratio || 1.414));
  return <div ref={holderRef} style={{width:cssWidth,minHeight:height,margin:"0 auto 14px",background:"#fff",boxShadow:"0 1px 6px rgba(0,0,0,0.16)",borderRadius:2,position:"relative",overflow:"hidden"}}>
    {near
      ? <canvas ref={canvasRef} style={{display:"block",width:"100%",height:"auto"}}/>
      : <div style={{height}}/>}
    {(!drawn||!near)&&<div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
      <span style={{fontFamily:mono,fontSize:10,letterSpacing:1.5,color:"#b8b3ac"}}>PAGE {pageNum}</span>
    </div>}
  </div>;
}
// Lecteur PDF intégré : le document s'ouvre par-dessus le site, sans quitter la
// page. Échap ferme la visionneuse.
function PdfViewer({lesson,subtitle,onClose}){
  const [failed,setFailed] = useState(false);      // rendu PDF.js impossible
  const [pdf,setPdf] = useState(null);
  const [numPages,setNumPages] = useState(0);
  const [progress,setProgress] = useState(0);
  const [activePage,setActivePage] = useState(1);
  const [zoom,setZoom] = useState(1);
  const [boxWidth,setBoxWidth] = useState(0);
  const [ratios,setRatios] = useState({});
  const scrollRef = useRef(null);
  const url = lesson ? lesson.url : "";
  useEffect(()=>{
    const onKey = e => { if(e.key === "Escape") onClose(); };
    window.addEventListener("keydown",onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return ()=>{ window.removeEventListener("keydown",onKey); document.body.style.overflow = prev; };
  },[onClose]);
  // Largeur disponible : suivie en continu pour gérer la rotation de la tablette
  // et l'ouverture du clavier.
  useEffect(()=>{
    const el = scrollRef.current;
    if(!el) return;
    const measure = ()=>setBoxWidth(el.clientWidth);
    measure();
    if(typeof ResizeObserver !== "undefined"){
      const ro = new ResizeObserver(measure);
      ro.observe(el);
      return ()=>ro.disconnect();
    }
    window.addEventListener("resize",measure);
    window.addEventListener("orientationchange",measure);
    return ()=>{ window.removeEventListener("resize",measure); window.removeEventListener("orientationchange",measure); };
  },[failed]);
  // Ouverture du document.
  useEffect(()=>{
    if(!url){ return; }
    let cancelled = false, task = null;
    setPdf(null); setNumPages(0); setProgress(0); setActivePage(1); setRatios({}); setFailed(false);
    loadPdfJs().then(lib=>{
      if(cancelled) return;
      task = lib.getDocument({
        url,
        // Lecture en flux : seules les portions utiles du fichier sont
        // téléchargées, la première page s'affiche sans attendre la fin.
        rangeChunkSize: 262144,
        disableAutoFetch: true,
        disableStream: false,
        cMapUrl: `${PDFJS_BASE}/cmaps/`,
        cMapPacked: true,
        standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/`,
      });
      task.onProgress = ({loaded,total}) => {
        if(cancelled || !total) return;
        setProgress(Math.min(100, Math.round((loaded/total)*100)));
      };
      return task.promise.then(doc=>{
        if(cancelled){ try{ doc.destroy(); }catch{} return; }
        setPdf(doc);
        setNumPages(doc.numPages || 0);
        // Proportions de la première page : elles servent de gabarit aux pages
        // pas encore dessinées, pour que la barre de défilement soit juste.
        return doc.getPage(1).then(p=>{
          if(cancelled) return;
          const v = p.getViewport({scale:1});
          if(v.width) setRatios(r=>({...r, default:v.height/v.width}));
        }).catch(()=>{});
      });
    }).catch(()=>{ if(!cancelled) setFailed(true); });
    return ()=>{
      cancelled = true;
      if(task){ try{ task.destroy(); }catch{} }
    };
  },[url]);
  const onRatio = useCallback((n,r)=>{
    setRatios(prev => prev[n] === r ? prev : {...prev, [n]:r});
  },[]);
  const onActive = useCallback(n=>setActivePage(n),[]);
  if(!lesson) return null;
  // Largeur d'une page : on remplit l'écran sur tablette et téléphone, mais on
  // plafonne sur grand moniteur — une A4 étalée sur 1600 px est illisible.
  const wide = boxWidth >= 760;
  // Sur téléphone, la barre du haut n'a de place que pour le titre et « Fermer » :
  // le zoom, le compteur et le téléchargement descendent dans une petite barre
  // flottante en bas, à portée de pouce et sans écraser le nom du cours.
  const compact = boxWidth > 0 && boxWidth < 520;
  const fitWidth = Math.min(boxWidth - (wide ? 40 : 16), 980);
  const pageWidth = Math.max(240, Math.round(fitWidth * zoom));
  const canZoomOut = zoom > 0.55, canZoomIn = zoom < 3;
  const zoomOut = ()=>setZoom(z=>Math.max(0.5,Math.round((z-0.25)*100)/100));
  const zoomIn = ()=>setZoom(z=>Math.min(3,Math.round((z+0.25)*100)/100));
  const zoomBtn = (label,disabled,onClick) => <button onClick={onClick} disabled={disabled} aria-label={label} style={{fontFamily:font,fontSize:16,fontWeight:600,lineHeight:1,width:34,height:34,cursor:disabled?"default":"pointer",borderRadius:8,border:`1.5px solid ${C.border}`,background:C.surface,color:disabled?"var(--c-textDisabled)":C.textMed,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,WebkitTapHighlightColor:"transparent"}}>{label}</button>;
  const dlLink = extra => <a href={lesson.url} target="_blank" rel="noopener noreferrer" download={lesson.fileName||"cours.pdf"} title="Télécharger" style={{fontFamily:font,fontSize:12,fontWeight:500,padding:extra?"0":"6px 10px",width:extra?34:undefined,height:extra?34:undefined,borderRadius:8,border:`1.5px solid ${C.border}`,background:C.surface,color:C.textMed,textDecoration:"none",display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,whiteSpace:"nowrap",flexShrink:0}}>⬇{wide&&" Télécharger"}</a>;
  return <div style={{position:"fixed",inset:0,zIndex:1200,background:C.bg,display:"flex",flexDirection:"column"}}>
    <div style={{background:C.surface,borderBottom:`1px solid ${C.border}`,padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexShrink:0}}>
      <div style={{minWidth:0,flex:"1 1 auto"}}>
        <p style={{fontFamily:serif,fontSize:15,margin:0,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{lesson.title||lesson.fileName}</p>
        {subtitle&&<p style={{fontFamily:mono,fontSize:9,letterSpacing:1.5,textTransform:"uppercase",color:C.textLt,margin:"3px 0 0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{subtitle}</p>}
      </div>
      <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
        {!compact&&!failed&&numPages>0&&<>
          {zoomBtn("−",!canZoomOut,zoomOut)}
          {zoomBtn("+",!canZoomIn,zoomIn)}
          <span style={{fontFamily:mono,fontSize:10,color:C.textLt,minWidth:52,textAlign:"center",whiteSpace:"nowrap"}}>{activePage} / {numPages}</span>
        </>}
        {!compact&&dlLink(false)}
        <button onClick={onClose} style={{fontFamily:font,fontSize:12,fontWeight:600,padding:"6px 14px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.accent}`,background:C.accentBg,color:C.accent,whiteSpace:"nowrap"}}>Fermer ✕</button>
      </div>
    </div>
    {failed?(
      <div style={{flex:1,minHeight:0,background:"var(--c-surfaceAlt)",display:"flex",flexDirection:"column"}}>
        {isAppleTouch()?(
          <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:24,textAlign:"center"}}>
            <p style={{fontSize:13,color:C.textMed,margin:0,lineHeight:1.7}}>L'aperçu intégré n'a pas pu s'afficher sur cet appareil.<br/>Le document reste consultable dans un nouvel onglet.</p>
            <a href={lesson.url} target="_blank" rel="noopener noreferrer" style={{fontFamily:font,fontSize:13,fontWeight:600,padding:"10px 20px",borderRadius:8,border:`1.5px solid ${C.accent}`,background:C.accentBg,color:C.accent,textDecoration:"none"}}>Ouvrir le PDF →</a>
          </div>
        ):(
          <iframe title={lesson.title||"Cours"} src={`${lesson.url}#view=FitH`} style={{width:"100%",height:"100%",border:"none",display:"block"}}/>
        )}
      </div>
    ):(
      <div ref={scrollRef} data-pdf-scroll tabIndex={0} style={{flex:1,minHeight:0,overflowY:"auto",overflowX:"auto",WebkitOverflowScrolling:"touch",overscrollBehavior:"contain",background:"var(--c-surfaceAlt)",padding:`14px 0 ${compact?86:40}px`,outline:"none"}}>
        {!pdf?(
          <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,padding:24,textAlign:"center"}}>
            <p style={{fontFamily:mono,fontSize:10,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:0}}>Ouverture du cours…</p>
            <div style={{width:180,height:4,borderRadius:4,background:"var(--c-track)",overflow:"hidden"}}>
              <div style={{width:`${Math.max(8,progress)}%`,height:"100%",background:C.accent,transition:"width .2s"}}/>
            </div>
          </div>
        ):(
          <div style={{width:pageWidth,margin:"0 auto"}}>
            {Array.from({length:numPages},(_,i)=>i+1).map(n=>
              <PdfPageView key={n} pdf={pdf} pageNum={n} cssWidth={pageWidth}
                ratio={ratios[n]||ratios.default} onRatio={onRatio} onActive={onActive}/>
            )}
          </div>
        )}
      </div>
    )}
    {compact&&!failed&&numPages>0&&
      <div style={{position:"absolute",left:"50%",transform:"translateX(-50%)",bottom:"calc(14px + env(safe-area-inset-bottom, 0px))",display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:999,background:C.surface,border:`1px solid ${C.border}`,boxShadow:"0 3px 14px rgba(0,0,0,0.18)",zIndex:2}}>
        {zoomBtn("−",!canZoomOut,zoomOut)}
        <span style={{fontFamily:mono,fontSize:11,color:C.textMed,minWidth:54,textAlign:"center",whiteSpace:"nowrap"}}>{activePage} / {numPages}</span>
        {zoomBtn("+",!canZoomIn,zoomIn)}
        {dlLink(true)}
      </div>}
  </div>;
}
// ─── Onglet « Cours » (étudiant) ──────────────────────────────────────────────
// Reprend exactement l'arborescence des flashcards : matière → Cours 1..N →
// chapitres. Le verrouillage suit la même règle que les cartes : un chapitre
// n'est lisible que si son cours est accessible (offert ou payé).
function LessonsTab({semLabel,groups,lessonsByKey,lessons,loading,allCards,isAdmin,userGroups,fullGroups,onUpgrade,onOpen}){
  const [comingSoon,setComingSoon]=useState(null);
  function LessonGroupBlock({group}){
    const [activeCours,setActiveCours]=useState(null);
    const groupLocked=!isAdmin&&!group.nums.some(n=>isLessonAccessible(group.id,n,userGroups,fullGroups));
    const availableCount=group.nums.reduce((acc,n)=>{
      const chs=getLessonChapters(group.id,n,allCards,lessons);
      return acc+chs.filter((_,i)=>lessonsByKey[lessonKey(group.id,n,i+1)]).length;
    },0);
    const totalCount=group.nums.reduce((acc,n)=>acc+getLessonChapters(group.id,n,allCards,lessons).length,0);
    if(groupLocked){
      return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:12,opacity:0.75}}>
        <div style={{padding:"11px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
          <p style={{fontFamily:serif,fontSize:15,margin:0,color:C.textMed}}>{group.label}</p>
          {PURCHASES_VISIBLE&&isSemOffered(group.sem)
            ?<button onClick={onUpgrade} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 12px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.border}`,background:"transparent",color:C.textLt,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0}}>🔒 Débloquer</button>
            :<span style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 12px",borderRadius:6,border:`1.5px solid ${C.border}`,background:"transparent",color:C.textLt,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0}}>🔒 Verrouillé</span>}
        </div>
      </div>;
    }
    return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"11px 18px",borderBottom:`1px solid ${C.border}`,background:C.bg,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
        <p style={{fontFamily:serif,fontSize:15,margin:0}}>{group.label}</p>
        <span style={{fontFamily:mono,fontSize:9,letterSpacing:1,textTransform:"uppercase",color:availableCount>0?C.good:C.textLt,flexShrink:0}}>{availableCount}/{totalCount} en ligne</span>
      </div>
      <div style={{display:"flex",gap:8,padding:"10px 18px",flexWrap:"wrap",borderBottom:activeCours?`1px solid ${C.border}`:"none",background:C.surface}}>
        {group.nums.map(n=>{
          const locked=!isAdmin&&!isLessonAccessible(group.id,n,userGroups,fullGroups);
          const active=activeCours===n;
          const chs=getLessonChapters(group.id,n,allCards,lessons);
          const ready=locked?0:chs.filter((_,i)=>lessonsByKey[lessonKey(group.id,n,i+1)]).length;
          return <button key={n} onClick={()=>locked?(PURCHASES_VISIBLE&&onUpgrade()):setActiveCours(active?null:n)} style={{fontFamily:font,fontSize:12,fontWeight:active?600:400,padding:"8px 16px",cursor:"pointer",borderRadius:7,border:`1.5px solid ${locked?C.border:active?C.accent:ready>0?C.good:C.border}`,background:locked?"transparent":active?C.accentBg:ready>0?C.goodBg:"transparent",color:locked?C.textLt:active?C.accent:ready>0?C.good:C.textMed,display:"flex",alignItems:"center",gap:7,transition:"all 0.15s",opacity:locked?0.7:1}}>
            <span>Cours {n}</span>
            {locked?<span style={{fontSize:10}}>🔒</span>:<>{ready>0&&!active&&<span style={{fontFamily:mono,fontSize:8,fontWeight:700,padding:"1px 5px",borderRadius:10,background:C.good,color:"var(--c-onSolid)"}}>{ready}</span>}<span style={{fontSize:10,opacity:0.6}}>{active?"▲":"▼"}</span></>}
          </button>;
        })}
      </div>
      {activeCours&&(
        <div style={{animation:"fadeIn 0.18s ease"}}>
          {getLessonChapters(group.id,activeCours,allCards,lessons).map((chName,i)=>{
            const chIdx=i+1;
            const lesson=lessonsByKey[lessonKey(group.id,activeCours,chIdx)];
            const subtitle=`${group.label} · Cours ${activeCours} · ${chName}`;
            return <div key={chIdx} style={{display:"flex",alignItems:"center",padding:"10px 18px",gap:12,borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flex:1,minWidth:170}}>
                <span style={{fontFamily:mono,fontSize:9,letterSpacing:1,color:C.textLt,minWidth:18,flexShrink:0}}>{chIdx}</span>
                <span style={{fontFamily:font,fontSize:13,color:lesson?C.text:C.textMed,fontWeight:lesson?500:400}}>{chName}</span>
                {lesson&&lesson.size>0&&<span style={{fontFamily:mono,fontSize:8,padding:"1px 5px",borderRadius:10,background:"var(--c-chipBg)",color:C.textMed,flexShrink:0}}>PDF · {formatBytes(lesson.size)}</span>}
              </div>
              <div style={{flexShrink:0}}>
                {lesson
                  ?<button onClick={()=>onOpen(lesson,subtitle)} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"7px 14px",cursor:"pointer",borderRadius:6,border:"1.5px solid var(--c-violet)",background:"var(--c-violetBg2)",color:"var(--c-violet)",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>📄 Lire le cours →</button>
                  :<button onClick={()=>setComingSoon(subtitle)} style={{fontFamily:font,fontSize:11,fontWeight:500,padding:"7px 14px",cursor:"pointer",borderRadius:6,border:`1.5px dashed ${C.border}`,background:"transparent",color:C.textLt,display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>✍️ Bientôt disponible</button>}
              </div>
            </div>;
          })}
        </div>
      )}
    </div>;
  }
  return <div>
    <p style={{fontFamily:serif,fontSize:18,margin:"0 0 6px"}}>Cours rédigés · {semLabel}</p>
    <p style={{fontSize:13,color:C.textMed,margin:"0 0 16px",lineHeight:1.6}}>Les cours au format PDF, rangés comme les flashcards : par matière, par cours, puis par chapitre. Un chapitre encore vide est en cours de rédaction.</p>
    {loading?(
      <div style={{border:`1px solid ${C.border}`,borderRadius:12,padding:"40px 24px",textAlign:"center",background:C.surface}}>
        <p style={{fontSize:13,color:C.textLt,margin:0}}><span style={{display:"inline-block",animation:"spin 0.8s linear infinite"}}>↻</span> Chargement des cours…</p>
      </div>
    ):groups.map(g=><LessonGroupBlock key={g.id} group={g}/>)}
    {comingSoon&&<ComingSoonModal title={comingSoon} onClose={()=>setComingSoon(null)}/>}
  </div>;
}

function VarRow({sym,name,children}){
  return <div style={{display:"flex",gap:12,padding:"9px 0",borderTop:`1px solid ${C.border}`,alignItems:"flex-start"}}>
    <span style={{fontFamily:mono,fontSize:15,fontWeight:700,color:C.accent,minWidth:26,flexShrink:0}}>{sym}</span>
    <div style={{minWidth:0}}>
