  // Load metadata only — NO front/back. Fast even for 100k cards.
  getCardsMeta: async () => {
    const allRows=[];
    let offset=0;
    const BATCH=1000; // metadata rows are tiny (~100 bytes each)
    try {
      while(true){
        const r=await fetch(`${SUPA_URL}/rest/v1/cards?select=id,group_id,num,chapter_id,packet_id,sort_order,card_type&limit=${BATCH}&offset=${offset}`,{headers:H});
        const d=await r.json();
        if(!r.ok||!Array.isArray(d)||d.length===0)break;
        allRows.push(...d);
        if(d.length<BATCH)break;
        offset+=BATCH;
      }
      return allRows.map(c=>({id:c.id,groupId:c.group_id,num:c.num,chapterId:c.chapter_id||1,packetId:c.packet_id,sort_order:c.sort_order??null,card_type:c.card_type||'text',front:null,back:null}));

  // Load front+back for specific card IDs only (called when starting a study session)
  getCardsContent: async (ids) => {
    if(!ids||ids.length===0)return {};
    const CHUNK=100; // PostgREST URL length limit
    const result={};
    try {
      for(let i=0;i<ids.length;i+=CHUNK){
        const chunk=ids.slice(i,i+CHUNK);
        const idList=chunk.map(id=>`"${id}"`).join(',');
        const r=await fetch(`${SUPA_URL}/rest/v1/cards?select=id,front,back&id=in.(${idList})`,{headers:H});
        const d=await r.json();
        if(r.ok&&Array.isArray(d))d.forEach(c=>{result[c.id]={front:c.front,back:c.back};});
      }
    } catch(e){console.warn("getCardsContent error:",e);}
    return result;
  },
  getCards: async () => { return null; }, // deprecated — use getCardsMeta

  // Admin: fetch full cards (with front+back) server-side filtered — used in AdminCards

  getUserCards: async (username) => {

  getProgress: async (username) => {
    try {
      const all=[]; let offset=0; const BATCH=1000;
      while(true){
        const r=await fetch(`${SUPA_URL}/rest/v1/progress?username=eq.${encodeURIComponent(username)}&select=card_id,data&limit=${BATCH}&offset=${offset}`,{headers:H});
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const rows=await r.json();
        if(!Array.isArray(rows)||!rows.length)break;
        all.push(...rows);
        if(rows.length<BATCH)break;
        offset+=BATCH;
      }
      const prog={};
      all.forEach(row=>{ try{ prog[row.card_id]=typeof row.data==="string"?JSON.parse(row.data):row.data; }catch{} });
      return prog;
    } catch(e){ console.error("getProgress failed:",e); return null; }

  },

const dateKey = (d=new Date()) => d.toISOString().slice(0,10);
const getStats = u => { try { return JSON.parse(localStorage.getItem(`mx6-stats-${u}`)||"null")||{days:{},total:{cards:0,correct:0,seconds:0}}; } catch { return {days:{},total:{cards:0,correct:0,seconds:0}}; } };
const saveStats = (u,st) => { try { localStorage.setItem(`mx6-stats-${u}`,JSON.stringify(st)); } catch {} };
const recordStat = (username, correct, elapsedMs, isNewCard=false) => {
  if(!username)return;
  const st = getStats(username);
  const key = dateKey();
  const secs = Math.min(Math.round(elapsedMs/1000), 120);
  if(!st.days[key]) st.days[key] = {cards:0,correct:0,seconds:0,newShown:0};
  st.days[key].cards++;
  if(correct) st.days[key].correct++;
  st.days[key].seconds += secs;
  if(isNewCard) st.days[key].newShown=(st.days[key].newShown||0)+1;
  st.total.cards++;
  if(correct) st.total.correct++;
  st.total.seconds += secs;
  saveStats(username, st);
};
const computeStreak = (days) => {
  let streak=0;
  const today=dateKey();
  const yesterday=dateKey(new Date(Date.now()-86400000));
  let cur=new Date(days[today]?.cards>0?today:yesterday);
  if(!days[dateKey(cur)]?.cards)return 0;
  while(true){const k=dateKey(cur);if(!days[k]?.cards)break;streak++;cur=new Date(cur.getTime()-86400000);}
  return streak;
};
const formatSeconds = (s) => {
  if(s<60)return `${s}s`;
  const h=Math.floor(s/3600),m=Math.round((s%3600)/60);
  if(h===0)return `${m} min`;
  return `${h}h ${m}min`;
};
const formatNextDue = date => {
  const diff=date-Date.now();
  if(diff<=0)return"maintenant";
  const m=Math.round(diff/60000);
  if(m<2)return"dans moins d'une minute";
  if(m<60)return`dans ${m} min`;
  const h=Math.round(m/60);
  if(h<24)return`dans ${h}h`;
  const d=Math.round(h/24);
  return`dans ${d} jour${d>1?"s":""}`;
};
const getEmptyQueueMsg = (filtered, prog, settings, newShownToday) => {
  const {newCardsPerDay=20}=settings;
  const dueCards=filtered.filter(c=>!prog[c.id]?.buried&&isDue(prog[c.id]));
  if(dueCards.length===0){
    const dates=filtered.filter(c=>!prog[c.id]?.buried&&prog[c.id]?.next).map(c=>new Date(prog[c.id].next)).sort((a,b)=>a-b);
    if(dates.length){
      return`✨ Toutes tes cartes sont à jour !\nProchaine révision ${formatNextDue(dates[0])}.`;
    }
    return"✨ Aucune carte dans cette sélection pour l'instant.";
  }
  const newDue=dueCards.filter(c=>isNew(prog[c.id]));
  const reviewDue=dueCards.filter(c=>!isNew(prog[c.id]));
  if(reviewDue.length===0&&newDue.length>0&&newShownToday>=(newCardsPerDay||20)){
    return`🎯 Plafond de nouvelles cartes atteint !\nTu as déjà découvert ${newShownToday} nouvelle${newShownToday>1?"s":""} carte${newShownToday>1?"s":""} aujourd'hui (plafond : ${newCardsPerDay||20}).\n💡 Reviens demain ou augmente le plafond dans les Paramètres.`;
  }
  if(dueCards.length>0){
    return`📋 ${dueCards.length} carte${dueCards.length>1?"s":""} disponible${dueCards.length>1?"s":""} mais exclue${dueCards.length>1?"s":""} par tes filtres de matières ou de paquets.\nModifie les filtres dans les Paramètres.`;
  }
  return"✨ Aucune carte à réviser pour le moment.";
};

const getCardTimestamp=id=>{const p=(id||'').split('-');return parseInt(p[1])||0;};
const sortCardsGlobally = cards => [...cards].sort((a,b)=>{
  const gi=GROUPS.findIndex(g=>g.id===a.groupId)-GROUPS.findIndex(g=>g.id===b.groupId);
  if(gi)return gi;
  if(a.num!==b.num)return a.num-b.num;
  if(a.chapterId!==b.chapterId)return a.chapterId-b.chapterId;
  const aOrd=a.sort_order>0?a.sort_order:null;
  const bOrd=b.sort_order>0?b.sort_order:null;
  if(aOrd!==null&&bOrd!==null)return aOrd-bOrd;
  if(aOrd!==null)return -1;
  if(bOrd!==null)return 1;
  return getCardTimestamp(a.id)-getCardTimestamp(b.id);
});

function computeNext(prev,rating,s=DEFAULT_SETTINGS){
  const {againMin=1,hardMin=5,goodMin=10,easyDays=4}=s;
  const {state="new",step=0,interval=1,ease=2.5,reps=0,lapses=0,lapseInt=1}=prev||{};
  const mf=m=>new Date(Date.now()+m*60000).toISOString();
  const df=d=>new Date(Date.now()+d*86400000).toISOString();
  const base={ease,reps,lapses,lapseInt};
  if(state==="new"||state==="learning"){
    if(rating===1)return{...base,state:"learning",step:0,interval:againMin,next:mf(againMin)};
    if(rating===2)return{...base,state:"learning",step:1,interval:hardMin,next:mf(hardMin)};
    if(rating===3){if(step>=2)return{...base,state:"review",step:0,interval:1,reps:1,lapseInt:0,next:df(1)};return{...base,state:"learning",step:2,interval:goodMin,next:mf(goodMin)};}
    return{...base,state:"review",step:0,interval:easyDays,reps:1,lapseInt:0,next:df(easyDays)};
  }
  if(state==="review"){
    if(rating===1){const li=Math.max(1,Math.round(interval*0.2));return{state:"relearning",step:0,interval,ease:Math.max(1.3,ease-0.2),reps,lapses:lapses+1,lapseInt:li,next:mf(againMin)};}
    let ni,ne=ease;
    if(rating===2){ni=Math.max(interval+1,Math.round(interval*1.2));ne=Math.max(1.3,ease-0.15);}
    else if(rating===3){ni=Math.max(interval+1,Math.round(interval*ease));}
    else{ni=Math.max(interval+1,Math.round(interval*ease*1.3));ne=Math.min(3.5,ease+0.15);}
    return{state:"review",step:0,interval:ni,ease:ne,reps:reps+1,lapses,lapseInt:0,next:df(ni)};
  }
  if(rating===1)return{...prev,next:mf(againMin)};
  const ni=Math.max(1,lapseInt);return{state:"review",step:0,interval:ni,ease,reps:reps+1,lapses,lapseInt:0,next:df(ni)};
}
function getIntervalLabel(prev,rating,s=DEFAULT_SETTINGS){
  const r=computeNext(prev,rating,s);
  if(r.state==="learning"||r.state==="relearning"){const m=Math.max(1,Math.round((new Date(r.next)-Date.now())/60000));return m<60?`${m} min`:`${Math.round(m/60)} h`;}
  const d=r.interval;if(d===1)return"1 jour";if(d<7)return`${d} j`;if(d<30)return`${Math.round(d/7)} sem.`;if(d<365)return`${Math.round(d/30)} mois`;return`${(d/365).toFixed(1)} an${d>=730?"s":""}`;
}
function isDue(p){return !p?.next||new Date(p.next)<=new Date();}

const effPkt=(card,prog)=>prog[card.id]?.packetOverride||card.packetId;
function buildQueue(cardList,prog,settings,newShownToday=0,scopeOnly=false){
  const {dailyGroups=[],dailyPackets=[],maxReviewsPerDay=100,newCardsPerDay=20,newCardOrder="first",newCardEvery=5}=settings;
  const newLimit=Math.max(0,(newCardsPerDay||20)-newShownToday);
  let newCount=0;
  const newQ=[],revQ=[];
  cardList.forEach(c=>{
    const p=prog[c.id];
    if(p?.buried)return;
    if(!isDue(p))return;
    const ep=effPkt(c,prog);
    if(isNew(p)){
      if(newCount>=newLimit)return;
      if(!scopeOnly){
        if((dailyGroups||[]).length>0&&!dailyGroups.includes(c.groupId))return;
        if((dailyPackets||[]).length>0&&!dailyPackets.includes(ep))return;
      }
      newQ.push(c);newCount++;
    } else {
      revQ.push(c);
    }
  });
  let result;
  if((newCardOrder||"first")==="last"){
    result=[...revQ,...newQ];
  } else if(newCardOrder==="every"){
    result=[];const n=Math.max(1,newCardEvery||5);let ni=0;
    revQ.forEach((card,i)=>{
      result.push(card);
      if((i+1)%n===0&&ni<newQ.length)result.push(newQ[ni++]);
    });
    while(ni<newQ.length)result.push(newQ[ni++]);
  } else {
    result=[...newQ,...revQ];
  }
  return result.slice(0,maxReviewsPerDay||100);
}
function chapterStats(cards,prog,gid,num,chId,pkId){
  const l=cards.filter(c=>c.groupId===gid&&c.num===num&&c.chapterId===chId&&effPkt(c,prog)===pkId);

}

function courseDueCount(cards,prog,gid,num){

  if(!chs.length){return cards.filter(c=>c.groupId===gid&&c.num===num&&isDue(prog[c.id])&&!prog[c.id]?.buried).length;}

}
function globalDue(cards,prog,ids,settings,pkId=null){
  const el=cards.filter(c=>ids.includes(c.groupId)&&(!pkId||effPkt(c,prog)===pkId));

}

const compressImage=(src,maxSize=900,quality=0.75)=>new Promise(resolve=>{
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;}}
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    resolve(c.toDataURL("image/jpeg",quality));
  };
  img.src=src;
});

            } else if(!showOthers){

              ctx.fillStyle="white";ctx.font=`bold ${Math.min(z.h*0.45,18)}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(i+1),z.x+z.w/2,z.y+z.h/2);

}

        <button onClick={onShowPacks} style={{fontFamily:font,fontSize:12,fontWeight:600,padding:"9px 18px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.accent}`,background:C.accent,color:"#fff",whiteSpace:"nowrap"}}>Voir les packs →</button>

}
// ─── StatsTab ─────────────────────────────────────────────────────────────────
function StatsTab({username,progress,allCards,onUnbury}){
  const stats=useMemo(()=>getStats(username),[username]);
  const today=dateKey();
  const todayCards=stats.days[today]?.cards||0;
  const todayCorrect=stats.days[today]?.correct||0;
  const streak=computeStreak(stats.days);
  const totalCards=stats.total.cards;
  const totalCorrect=stats.total.correct;
  const successRate=totalCards>0?Math.round(totalCorrect/totalCards*100):0;
  const totalSeconds=stats.total.seconds;
  const buriedCards=useMemo(()=>{
    if(!progress||!allCards)return[];
    return allCards.filter(c=>progress[c.id]?.buried===true);
  },[progress,allCards]);
  const flameCount=Math.min(streak,10);
  const flames=streak>0?"🔥".repeat(flameCount):"-";
  const heatDays=useMemo(()=>{
    const days=[];
    for(let i=181;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const k=dateKey(d);
      const n=stats.days[k]?.cards||0;
      days.push({date:k,n,label:`${d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}: ${n} carte${n!==1?"s":""}`});
    }
    return days;
  },[stats]);
  const heatColor=(n)=>{
    if(n===0)return"#e8e4dc";
    if(n<=2)return"#bbf7d0";
    if(n<=5)return"#4ade80";
    if(n<=15)return"#16a34a";
    return"#14532d";
  };
  const weeks=useMemo(()=>{
    const ws=[];
    let week=[];
    heatDays.forEach((d,i)=>{
      week.push(d);
      if(week.length===7){ws.push(week);week=[];}
    });
    if(week.length)ws.push(week);
    return ws;
  },[heatDays]);
  const monthLabels=useMemo(()=>{
    const labels=[];
    let lastMonth=-1;
    weeks.forEach((week,wi)=>{
      const mid=week[Math.floor(week.length/2)];
      const m=new Date(mid.date).getMonth();
      if(m!==lastMonth){
        labels.push({wi,label:new Date(mid.date).toLocaleDateString("fr-FR",{month:"short"})});
        lastMonth=m;
      }
    });
    return labels;
  },[weeks]);
  const StatCard=({label,value,sub,accent})=>(
    <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"18px 16px"}}>
      <p style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textLt,margin:"0 0 10px"}}>{label}</p>
      <p style={{fontFamily:serif,fontSize:30,fontWeight:400,margin:"0 0 4px",color:accent||C.text,lineHeight:1.1}}>{value}</p>
      {sub&&<p style={{fontSize:11,color:C.textMed,margin:0}}>{sub}</p>}
    </div>
  );
  return(
    <div style={{animation:"fadeIn 0.18s ease"}}>
      <p style={{fontFamily:serif,fontSize:18,margin:"0 0 4px"}}>Statistiques</p>
      <p style={{fontSize:13,color:C.textMed,margin:"0 0 22px"}}>Sauvegardées sur cet appareil · réinitialisées si tu vides le cache</p>
      {totalCards===0?(
        <div style={{border:`1.5px dashed ${C.border}`,borderRadius:12,padding:"48px 24px",textAlign:"center",background:C.surface}}>
          <p style={{fontSize:36,margin:"0 0 12px"}}>📊</p>
          <p style={{fontFamily:serif,fontSize:18,margin:"0 0 8px"}}>Aucune statistique pour l'instant</p>
          <p style={{fontSize:13,color:C.textMed,margin:0,lineHeight:1.6}}>Commence à réviser des flashcards pour voir tes stats !</p>
        </div>
      ):(
        <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:12,marginBottom:28}}>
            <StatCard label="Streak" value={`${streak} ${streak>0?"🔥":""}`} sub={`${streak===0?"Pas encore actif":streak===1?"1 jour d'affilée":streak+" jours d'affilée"}`} accent={streak>0?"#ea580c":C.text}/>
            <StatCard label="Aujourd'hui" value={todayCards} sub={todayCards>0?`${Math.round(todayCorrect/todayCards*100)}% de réussite`:"Pas encore révisé"} accent={todayCards>0?C.accent:C.text}/>
            <StatCard label="Total révisées" value={totalCards.toLocaleString("fr-FR")} sub="cartes au total"/>
            <StatCard label="Taux de réussite" value={`${successRate}%`} sub={`${totalCorrect} correctes / ${totalCards}`} accent={successRate>=80?C.good:successRate>=60?C.hard:C.again}/>
            <StatCard label="Temps total" value={formatSeconds(totalSeconds)} sub={`≈ ${Math.round(totalSeconds/totalCards)} s / carte`}/>
            <StatCard label="Jours actifs" value={Object.keys(stats.days).filter(k=>stats.days[k]?.cards>0).length} sub="jours de révision"/>
          </div>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"20px"}}>
            <p style={{fontFamily:serif,fontSize:16,margin:"0 0 14px"}}>Activité (26 dernières semaines)</p>
            <div style={{display:"flex",marginBottom:4,paddingLeft:20,position:"relative",height:16}}>
              {monthLabels.map(({wi,label})=>(
                <div key={wi} style={{position:"absolute",left:`${wi*(12+2)+20}px`,fontFamily:mono,fontSize:9,letterSpacing:1,color:C.textLt,textTransform:"uppercase"}}>{label}</div>
              ))}
            </div>
            <div style={{display:"flex",gap:2}}>
              <div style={{display:"flex",flexDirection:"column",gap:2,paddingTop:0,marginRight:4}}>
                {["L","M","M","J","V","S","D"].map((d,i)=>(
                  <div key={i} style={{width:12,height:12,fontFamily:mono,fontSize:8,color:C.textLt,display:"flex",alignItems:"center",justifyContent:"center"}}>{i%2===0?d:""}</div>
                ))}
              </div>
              <div style={{display:"flex",gap:2,overflowX:"auto",paddingBottom:4}}>
                {weeks.map((week,wi)=>(
                  <div key={wi} style={{display:"flex",flexDirection:"column",gap:2}}>
                    {Array(7).fill(null).map((_,di)=>{
                      const day=week[di];
                      if(!day)return<div key={di} style={{width:12,height:12}}/>;
                      return(
                        <div key={di} title={day.label} style={{width:12,height:12,borderRadius:2,background:heatColor(day.n),cursor:"default",transition:"transform 0.1s"}}
                          onMouseEnter={e=>e.currentTarget.style.transform="scale(1.5)"}
                          onMouseLeave={e=>e.currentTarget.style.transform="none"}
                        />
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginTop:12,justifyContent:"flex-end"}}>
              <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>Moins</span>
              {[0,2,5,15,20].map(n=><div key={n} style={{width:12,height:12,borderRadius:2,background:heatColor(n)}}/>)}
              <span style={{fontFamily:mono,fontSize:9,color:C.textLt}}>Plus</span>
            </div>
          </div>
        </>
      )}
      {buriedCards.length>0&&(
        <div style={{marginTop:24,background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden"}}>
          <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.border}`,background:C.bg,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:16}}>🙈</span>
              <p style={{fontFamily:serif,fontSize:15,margin:0}}>Cartes enfouies</p>
              <span style={{fontFamily:mono,fontSize:9,padding:"2px 7px",borderRadius:10,background:"#374151",color:"#fff",fontWeight:700}}>{buriedCards.length}</span>
            </div>
            <p style={{fontSize:11,color:C.textLt,margin:0}}>Exclues de tes révisions · clique pour désenfouir</p>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:0}}>
            {buriedCards.map((card,i)=>{
              const grp=GROUPS.find(g=>g.id===card.groupId);
              const chName=getChapters(card.groupId,card.num)[card.chapterId-1];
              return(
                <div key={card.id} style={{display:"flex",alignItems:"center",padding:"10px 18px",gap:12,borderTop:i>0?`1px solid ${C.border}`:"none"}}>
                  <div style={{width:3,background:pC(card.packetId),borderRadius:2,alignSelf:"stretch",flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:4}}>
                      <Tag color={pC(card.packetId)} bg={pB(card.packetId)} small>{PACKETS.find(p=>p.id===card.packetId)?.label}</Tag>
                      {grp&&<Tag color={C.textMed} bg={C.bg} small>{grp.label}</Tag>}
                      <Tag color={C.textMed} bg={C.bg} small>Cours {card.num}</Tag>
                      {chName&&<Tag color={C.textMed} bg={C.bg} small>Ch.{card.chapterId} {chName}</Tag>}
                      {card.isUserCard&&<Tag color={"#7c3aed"} bg={"#f5f3ff"} small>✏️ Perso</Tag>}
                    </div>
                    {isOcclusion(card)?<p style={{fontFamily:serif,fontSize:12,color:C.textMed,margin:0}}>🖼 Image Occlusion</p>:<p style={{fontFamily:serif,fontSize:13,color:C.textMed,margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{card.front}</p>}
                  </div>
                  <button onClick={()=>onUnbury&&onUnbury(card.id)} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 12px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${C.good}`,background:C.goodBg,color:C.good,whiteSpace:"nowrap",flexShrink:0}}>👁 Désenfouir</button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}
// ─── MyCardsTab ──────────────────────────────────────────────────────────────
function MyCardsTab({userCards,onNew,onEdit,onDelete,onToggleIntegration,progress,onStudyUser}){

    GROUPS.filter(g=>userCards.some(c=>c.groupId===g.id))
  ,[userCards]);

  const integratedCount=userCards.filter(c=>c.integrated).length;
  function GroupPanel({group}){

        <span style={{fontSize:9}}>{pk.label}</span>
        <span style={{fontSize:9,fontWeight:400}}>{total===0?"vide":hasDue?`${due} carte${due>1?"s":""}`:upToDate?"✓ à jour":"vide"}</span>
      </button>;
    }
    return<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"11px 18px",borderBottom:`1px solid ${C.border}`,background:C.bg,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <p style={{fontFamily:serif,fontSize:15,margin:0}}>{group.label}</p>
          <Tag color={group.sem===1?C.accent:group.sem===2?C.imp:C.util} bg={group.sem===1?C.accentBg:group.sem===2?C.impBg:C.utilBg} small>{group.sem===0?"Pré-rentrée":group.sem===1?"Sem. 1":"Sem. 2"}</Tag>
          <Tag color={C.textMed} bg={C.bg} small>{groupCards.length} carte{groupCards.length>1?"s":""}</Tag>
        </div>
      </div>
      <div style={{display:"flex",gap:8,padding:"10px 18px",flexWrap:"wrap",borderBottom:activeCours?`1px solid ${C.border}`:"none",background:C.surface}}>
        {availNums.map(n=>{
          const active=activeCours===n;

function StudyView({label,queue,onRate,onBury,onChangePacket,onBack,settings,isAdmin,progress}){

          setLocalQ(q=>q.map((c,i)=>i===idx?{...c,...content[c.id]}:c));

  const col=pC(card.packetId),grp=GROUPS.find(g=>g.id===card.groupId);

  const isNewCard=!cardProg||cardProg.state==="new";
  return <div style={{fontFamily:font,background:C.bg,minHeight:"100vh",color:C.text}}>
    <Nav left={<button onClick={onBack} style={{fontFamily:font,fontSize:13,background:"none",border:"none",cursor:"pointer",color:C.textMed}}>← Retour</button>} center={label} right={<div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:12,color:C.textLt}}>{idx+1} / {localQ.length}</span><button onClick={handleBury} title="Enfouir cette carte (ne plus la réviser)" style={{fontFamily:font,fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${C.border}`,background:"transparent",color:C.textLt,display:"flex",alignItems:"center",gap:4}}>🙈 Enfouir</button></div>}/>
    <div style={{height:3,background:C.border}}><div style={{height:3,background:col,width:`${(idx/Math.max(1,localQ.length))*100}%`,transition:"width 0.3s"}}/></div>
    {buryFlash&&<div style={{position:"fixed",bottom:24,right:24,zIndex:200,background:"#374151",color:"#fff",borderRadius:8,padding:"10px 18px",fontFamily:font,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.2)",animation:"fadeIn 0.2s ease"}}>🙈 Carte enfouie — plus dans tes révisions</div>}
    <div style={{maxWidth:560,margin:"0 auto",padding:"28px 24px 0"}}>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18,alignItems:"center"}}>
        {isNewCard&&<span style={{fontFamily:mono,fontSize:9,letterSpacing:2,textTransform:"uppercase",padding:"3px 8px",borderRadius:3,background:"#fef2f2",color:"#dc2626",border:"1px solid #fca5a5",fontWeight:700}}>Nouveau</span>}
        <Tag color={col} bg={pB(card.packetId)}>{PACKETS.find(p=>p.id===card.packetId)?.label}</Tag>
        <Tag color={C.accent} bg={C.accentBg}>{grp?.label}</Tag>
        <Tag color={C.textMed} bg={C.bg}>Cours {card.num}</Tag>
        {chName&&<Tag color={C.textMed} bg={C.bg}>Ch.{card.chapterId} {chName}</Tag>}
        {card.isUserCard&&<Tag color={"#7c3aed"} bg={"#f5f3ff"}>✏️ Personnel</Tag>}
        <Tag color={C.textLt} bg={C.bg}>{stateLabel(cardProg)}</Tag>
      </div>
      {isOcclusion(card)?(
        <div style={{marginBottom:22}}>
          <div style={{background:C.surface,border:`1.5px solid ${showBack?col:C.border}`,borderRadius:12,padding:"16px 20px",transition:"border-color 0.3s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><Lbl>{showBack?"Réponse révélée":showOthers?"Indices visibles (image)":"Zone rouge = à deviner · Zones noires = masquées"}</Lbl>{showBack&&<Tag color={C.good} bg={C.goodBg} small>Révélé</Tag>}</div>
            <div onClick={()=>showBack?setShowBack(false):setShowBack(true)} style={{cursor:"pointer"}}><OcclusionCanvas cardFront={card.front} showBack={showBack} showOthers={showOthers}/></div>
            {!showBack&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}><button onClick={e=>{e.stopPropagation();setShowOthers(s=>!s);}} style={{fontFamily:font,fontSize:11,fontWeight:500,padding:"6px 12px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${showOthers?C.imp:C.border}`,background:showOthers?C.impBg:"transparent",color:showOthers?C.imp:C.textMed,display:"flex",alignItems:"center",gap:6}}>{showOthers?"🔲 Masquer les indices":"👁 Voir les indices (image)"}</button><button onClick={()=>setShowBack(true)} style={{fontFamily:font,fontSize:11,fontWeight:600,padding:"6px 14px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${col}`,background:pB(card.packetId),color:col}}>Révéler →</button></div>}
            {showBack&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:12}}><button onClick={()=>setShowBack(false)} style={{fontFamily:font,fontSize:11,background:"none",border:"none",cursor:"pointer",color:C.textLt,padding:0}}>← Cliquer sur l'image pour revoir la question</button></div>}
          </div>
        </div>
      ):(
        <div style={{perspective:1200,marginBottom:22}}>
          {(()=>{
            const fc=parseContent(card.front);
            const bc=parseContent(card.back);
            const minH=fc.img||bc.img?300:260;
            return(
              <div style={{width:"100%",minHeight:minH,position:"relative",transformStyle:"preserve-3d",transform:showBack?"rotateY(180deg)":"rotateY(0)",transition:"transform 0.4s cubic-bezier(0.4,0,0.2,1)",cursor:showBack?"pointer":"pointer"}} onClick={()=>showBack?setShowBack(false):setShowBack(true)}>
                <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",background:C.surface,borderRadius:12,border:`1.5px solid ${C.border}`,padding:"24px 28px",display:"flex",flexDirection:"column",justifyContent:"center",minHeight:minH}}>
                  <Lbl>Question · cliquer pour révéler</Lbl>
                  {fc.text&&<p style={{fontFamily:serif,fontSize:20,lineHeight:1.6,margin:"8px 0 0",whiteSpace:"pre-wrap",...(!isAdmin?noSel:{})}} onContextMenu={!isAdmin?e=>e.preventDefault():undefined}>{fc.text}</p>}
                  {fc.img&&<img src={fc.img} style={{maxWidth:"100%",maxHeight:220,borderRadius:8,marginTop:fc.text?12:0,display:"block",objectFit:"contain"}}/>}
                  <p style={{fontSize:12,color:C.textLt,position:"absolute",bottom:14,right:18}}>Cliquer pour révéler →</p>
                </div>
                <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",background:C.surface,borderRadius:12,border:`1.5px solid ${col}`,padding:"24px 28px",display:"flex",flexDirection:"column",justifyContent:"center",transform:"rotateY(180deg)",minHeight:minH}}>
                  <Lbl>Réponse · cliquer pour revoir la question</Lbl>
                  {bc.text&&<p style={{fontSize:15,lineHeight:1.8,margin:"8px 0 0",color:C.textMed,whiteSpace:"pre-wrap",...(!isAdmin?noSel:{})}} onContextMenu={!isAdmin?e=>e.preventDefault():undefined}>{bc.text}</p>}
                  {bc.img&&<img src={bc.img} style={{maxWidth:"100%",maxHeight:220,borderRadius:8,marginTop:bc.text?12:0,display:"block",objectFit:"contain"}}/>}
                </div>
              </div>
            );
          })()}
        </div>
      )}
      {showBack&&<div>
        <Lbl>Comment était-ce ?</Lbl>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:10}}>
          {[[1,"À revoir",C.again,C.againBg],[2,"Difficile",C.hard,C.hardBg],[3,"Bien",C.good,C.goodBg],[4,"Facile",C.easy,C.easyBg]].map(([r,lbl,btnCol,btnBg])=><button key={r} onClick={()=>handleRate(r)} style={{fontFamily:font,padding:"14px 8px",cursor:"pointer",borderRadius:8,border:`1.5px solid ${btnCol}`,background:btnBg,color:btnCol,display:"flex",flexDirection:"column",alignItems:"center",gap:6,transition:"transform 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.transform="none";}}><span style={{fontSize:12,fontWeight:600}}>{lbl}</span><span style={{fontSize:14,fontWeight:700}}>{getIntervalLabel(cardProg,r,settings)}</span></button>)}
        </div>
        {!isAdmin&&onChangePacket&&<div style={{marginTop:14}}>
          <button onClick={()=>setShowPktChange(s=>!s)} style={{fontFamily:font,fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${showPktChange?C.accent:C.border}`,background:showPktChange?C.accentBg:"transparent",color:showPktChange?C.accent:C.textLt,display:"flex",alignItems:"center",gap:5}}>📦 Changer l'importance (pour moi uniquement) {showPktChange?"▲":"▼"}</button>
          {showPktChange&&<div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
            {PACKETS.map(pk=>{
              const currentPkt=progress?.[card.id]?.packetOverride||card.packetId;
              const isActive=currentPkt===pk.id;
              const isOriginal=!progress?.[card.id]?.packetOverride&&card.packetId===pk.id;
              return<button key={pk.id} onClick={()=>{onChangePacket(card,pk.id);setShowPktChange(false);}} style={{fontFamily:font,fontSize:12,fontWeight:isActive?600:400,padding:"7px 14px",cursor:"pointer",borderRadius:6,border:`1.5px solid ${isActive?pC(pk.id):C.border}`,background:isActive?pB(pk.id):"transparent",color:isActive?pC(pk.id):C.textMed,display:"flex",alignItems:"center",gap:5}}>
                {isActive&&"✓ "}{pk.label}{isOriginal&&<span style={{fontSize:9,color:C.textLt}}>(original)</span>}
              </button>;
            })}
            {progress?.[card.id]?.packetOverride&&<button onClick={()=>{onChangePacket(card,card.packetId);setShowPktChange(false);}} style={{fontFamily:font,fontSize:11,padding:"5px 10px",cursor:"pointer",borderRadius:5,border:`1px solid ${C.again}`,background:C.againBg,color:C.again}}>↩ Rétablir l'original</button>}
          </div>}
        </div>}
      </div>}
    </div>
  </div>;
}
// ─── Settings ─────────────────────────────────────────────────────────────────
function SettingsView({settings,onSave,onBack}){
  const [s,setS]=useState(settings),[saved,setSaved]=useState(false);
  const save=()=>{onSave(s);setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const Sl=({k,label,desc,min,max,step,unit})=><div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"14px 16px"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><p style={{fontSize:13,fontWeight:500,margin:0}}>{label}</p><p style={{fontSize:18,fontWeight:300,color:C.accent,margin:0}}>{s[k]}<span style={{fontSize:11}}> {unit}</span></p></div><p style={{fontSize:11,color:C.textMed,margin:"0 0 8px"}}>{desc}</p><input type="range" min={min} max={max} step={step} value={s[k]} onChange={e=>setS(p=>({...p,[k]:Number(e.target.value)}))} style={{width:"100%"}}/></div>;
  const Sec=({title,children})=><div style={{marginBottom:24}}><h2 style={{fontFamily:serif,fontSize:19,fontWeight:400,margin:"0 0 12px",paddingBottom:8,borderBottom:`1px solid ${C.border}`}}>{title}</h2>{children}</div>;
  return <div style={{fontFamily:font,background:C.bg,minHeight:"100vh",color:C.text}}>
    <Nav left={<button onClick={onBack} style={{fontFamily:font,fontSize:13,background:"none",border:"none",cursor:"pointer",color:C.textMed}}>← Retour</button>} center="Paramètres" right={<Btn fill onClick={save}>{saved?"✓ Sauvegardé":"Sauvegarder"}</Btn>}/>
    <div style={{maxWidth:600,margin:"0 auto",padding:"28px 24px"}}>
      <Sec title="🎯 Nouvelles cartes du jour"><div style={{display:"flex",flexDirection:"column",gap:10}}><div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"14px 16px"}}><MultiToggle label="Matières à découvrir" value={s.dailyGroups} onChange={v=>setS(p=>({...p,dailyGroups:v}))} options={GROUPS.map(g=>({value:g.id,label:groupLabel(g)}))} colorFn={()=>C.accent}/></div><div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"14px 16px"}}><MultiToggle label="Paquets à découvrir" value={s.dailyPackets} onChange={v=>setS(p=>({...p,dailyPackets:v}))} options={PACKETS.map(pk=>({value:pk.id,label:pk.label}))} colorFn={pC}/></div></div></Sec>
      <Sec title="⏱ Intervalles d'apprentissage"><div style={{display:"flex",flexDirection:"column",gap:8}}><Sl k="againMin" label="À revoir" desc="Délai de réaffichage." min={1} max={10} step={1} unit="min"/><Sl k="hardMin" label="Difficile" desc="Délai carte presque sue." min={2} max={30} step={1} unit="min"/><Sl k="goodMin" label="Bien" desc="Avant graduation en révision." min={5} max={60} step={5} unit="min"/><Sl k="easyDays" label="Facile" desc="Graduation immédiate." min={1} max={14} step={1} unit="jours"/></div></Sec>
      <Sec title="📚 Session d'étude">
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <Sl k="newCardsPerDay" label="Nouvelles cartes / jour" desc="Limite quotidienne de nouvelles cartes à découvrir." min={5} max={100} step={5} unit=""/>
          <Sl k="maxReviewsPerDay" label="Révisions max / session" desc="Plafond total de cartes par session (nouvelles + révisions)." min={20} max={500} step={10} unit=""/>
          <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:8,padding:"14px 16px"}}>
            <p style={{fontSize:13,fontWeight:500,margin:"0 0 4px"}}>Position des nouvelles cartes dans la session</p>
            <p style={{fontSize:11,color:C.textMed,margin:"0 0 12px"}}>Quand réviser les cartes jamais vues ?</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[["first","⬆ En début de session","Toutes les nouvelles cartes d'abord, puis les révisions (par défaut)"],["last","⬇ En fin de session","Révisions d'abord, nouvelles cartes ensuite"],["every","🔀 Intercalées toutes les N révisions","Une nouvelle carte s'insère automatiquement toutes les N cartes révisées"]].map(([val,lbl,desc])=>(
                <label key={val} onClick={()=>setS(p=>({...p,newCardOrder:val}))} style={{cursor:"pointer",display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",borderRadius:7,border:`1.5px solid ${s.newCardOrder===val?C.accent:C.border}`,background:s.newCardOrder===val?C.accentBg:"transparent"}}>
                  <input type="radio" readOnly checked={s.newCardOrder===val} style={{marginTop:2,accentColor:C.accent,flexShrink:0}}/>
                  <div><p style={{fontSize:13,fontWeight:s.newCardOrder===val?600:400,margin:"0 0 2px",color:s.newCardOrder===val?C.accent:C.text}}>{lbl}</p><p style={{fontSize:11,color:C.textMed,margin:0}}>{desc}</p></div>
                </label>
              ))}
              {s.newCardOrder==="every"&&<div style={{marginLeft:8}}><Sl k="newCardEvery" label="Fréquence d'intercalage" desc="Une nouvelle carte toutes les X révisions." min={2} max={20} step={1} unit="révisions"/></div>}
            </div>
          </div>
        </div>
      </Sec>
      <Btn fill full style={{fontSize:14}} onClick={save}>{saved?"✓ Sauvegardé":"Sauvegarder tous les paramètres"}</Btn>
    </div>
  </div>;
}

        const [groupId,num,chapterId]=key.split("|");
        const batchIds=new Set(groups[key].map(s=>s.id));
        const chCards=cards.filter(c=>String(c.groupId)===groupId&&String(c.num)===num&&String(c.chapterId)===chapterId&&!batchIds.has(c.id));
        let maxOrd=chCards.reduce((m,c)=>c.sort_order>0?Math.max(m,c.sort_order):m,0);
        groups[key].forEach(saved=>{maxOrd+=1;saved.sort_order=maxOrd;});
      });
    } else {
      savedList.forEach(saved=>{
        if(!(saved.sort_order>0)){
          const chCards=cards.filter(c=>c.groupId===saved.groupId&&c.num===saved.num&&c.chapterId===saved.chapterId&&c.id!==saved.id);
          const maxOrd=chCards.reduce((m,c)=>c.sort_order>0?Math.max(m,c.sort_order):m,0);
          if(maxOrd>0){
            saved.sort_order=maxOrd+1;
          } else {
            delete saved.sort_order;
          }
        }
      });
    }
    try {
      for(const saved of savedList){
        await supa.upsertCard(saved);
      }
    } catch(e){
      alert(`⚠️ ERREUR DE SAUVEGARDE\n\nLa carte n'a pas pu être enregistrée dans Supabase :\n${e.message||e}\n\nNote le contenu manuellement et réessaie.`);
      console.error("upsertCard failed:",e);
      return;
    }
    setCards(prev=>{
      let next=prev;
      savedList.forEach(saved=>{
        const exists=next.find(c=>c.id===saved.id);
        next=exists?next.map(c=>c.id===saved.id?saved:c):[...next,saved];
      });
      return sortCardsGlobally(next);
    });
  },[cards]);
  const handleDeleteCard=useCallback(async id=>{await supa.deleteCard(id);setCards(p=>p.filter(c=>c.id!==id));},[]);
  const handleSaveUser=useCallback(async acc=>{await supa.upsertAccount(acc);setAccounts(p=>p.find(a=>a.username===acc.username)?p.map(a=>a.username===acc.username?{...a,...acc,plan_id:acc.planId}:a):[...p,{...acc,plan_id:acc.planId}]);},[]);
  const handleDeleteUser=useCallback(async username=>{await supa.deleteAccount(username);setAccounts(p=>p.filter(a=>a.username!==username));},[]);
  const handleRegister=useCallback(async newAcc=>{await supa.upsertAccount(newAcc);setAccounts(p=>[...p,{...newAcc,plan_id:newAcc.planId}]);const u={username:newAcc.username,role:"student",plan:{planId:newAcc.planId,groups:newAcc.groups}};setProg({});setCurrentUser(u);storage.set("mx6-session",u);},[]);
  useEffect(()=>{
    if(!currentUser||currentUser.role==="admin"){setUserCards([]);return;}
    const cached=mergeIntegrated(getUCache(currentUser.username),currentUser.username);
    if(cached.length>0)setUserCards(cached);
    supa.getUserCards(currentUser.username).then(uc=>{
      if(uc===null){
        console.warn("user_cards fetch failed — using localStorage cache");
        return;
      }
      const supaIds=new Set(uc.map(c=>c.id));
      const cacheExtras=cached.filter(c=>!supaIds.has(c.id));
      const merged=mergeIntegrated([...uc,...cacheExtras],currentUser.username);
      setUserCards(merged);
      setUCache(currentUser.username,merged);
    });
  },[currentUser?.username]);
  const handleSaveUserCard=useCallback(async(cardOrCards)=>{
    const list=Array.isArray(cardOrCards)?cardOrCards:[cardOrCards];
    const isCreatingNew=!list[0]?.id||list[0]?.id?.startsWith("u-");
    let newCards=[...userCards];
    for(const card of list){
      const c={...card,
        id:card.id||`u-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
        username:currentUser.username,isUserCard:true,integrated:card.integrated||false};
      newCards=newCards.find(x=>x.id===c.id)?newCards.map(x=>x.id===c.id?c:x):[...newCards,c];
    }
    setUserCards(newCards);
    setUCache(currentUser.username,newCards);
    for(const card of list){
      const c=newCards.find(x=>x.id===card.id)||card;
      supa.upsertUserCard(c).catch(e=>console.error("upsertUserCard failed:",e));
    }
    if(userCardEditor===false){
      setUserCardKey(k=>k+1);
    } else {
      setUserCardEditor(null);
    }
  },[currentUser,userCards,userCardEditor]);
  const handleBatchSortCards=useCallback(async(updatedCards)=>{
    setCards(prev=>{
      const map={};updatedCards.forEach(c=>{map[c.id]=c;});
      return sortCardsGlobally(prev.map(c=>map[c.id]||c));
    });
    await supa.batchUpdateSort(updatedCards.map(c=>({id:c.id,sort_order:c.sort_order})));
  },[]);
  const handleDeleteUserCard=useCallback(async id=>{
    await supa.deleteUserCard(id);
    setUserCards(prev=>{
      const newCards=prev.filter(c=>c.id!==id);
      setUCache(currentUser.username,newCards);
      return newCards;
    });
    const ids=getIntegratedIds(currentUser.username);
    ids.delete(id);
    saveIntegratedIds(currentUser.username,ids);
  },[currentUser,userCards]);
  useEffect(()=>{
    if(!currentUser||currentUser.role==="admin")return;
    const timer=setTimeout(async()=>{
      try{
        const acc=await supa.getAccount(currentUser.username);
        if(!acc)return;
        const rawPlanId=acc.plan_id||acc.planId;
        const isFullPlan=["sem1","sem2","both"].includes(rawPlanId);
        const subPlanId=isFullPlan?rawPlanId:(currentUser.plan?.planId||"prerentree");
        const supaGroups=Array.isArray(acc.groups)?acc.groups:[];
        const extra=getExtraGroups(currentUser.username);
        const mergedGroups=computeGroups(subPlanId,supaGroups,extra);
        const extraNotInSupa=extra.filter(g=>!supaGroups.includes(g));
        if(extraNotInSupa.length>0){
          supa.updateGroups(currentUser.username,mergedGroups,isFullPlan?subPlanId:undefined).catch(()=>{});
        }
        const curStr=JSON.stringify([...(currentUser.plan?.groups||[])].sort());
        const newStr=JSON.stringify([...mergedGroups].sort());
        if(subPlanId!==currentUser.plan?.planId||curStr!==newStr){
          const newUser={...currentUser,plan:{planId:subPlanId,groups:mergedGroups}};
          setCurrentUser(newUser);
          storage.set("mx6-session",newUser);
        }
      }catch{}
    },4000);
    return()=>clearTimeout(timer);
  },[currentUser?.username]);
  const handleToggleIntegration=useCallback(async(card)=>{
    const updated={...card,integrated:!card.integrated};
    const ids=getIntegratedIds(currentUser.username);
    updated.integrated?ids.add(card.id):ids.delete(card.id);
    saveIntegratedIds(currentUser.username,ids);
    setUserCards(prev=>{
      const newCards=prev.map(c=>c.id===card.id?updated:c);
      setUCache(currentUser.username,newCards);
      return newCards;
    });
    supa.upsertUserCard(updated).catch(e=>console.error("upsertUserCard failed:",e));
  },[currentUser]);
  const startUserCardStudy=useCallback((gid,num,chapterId,pkId)=>{
    const filtered=userCards.filter(c=>
      c.groupId===gid&&c.num===num&&
      (chapterId===null||c.chapterId===chapterId)&&
      (pkId===null||c.packetId===pkId)
    );
    const queue=buildQueue(filtered,prog,settings);
    if(!queue.length){alert("Aucune carte personnelle à réviser dans cette sélection !");return;}
    const grp=GROUPS.find(g=>g.id===gid);
    const chName=chapterId?getChapters(gid,num)[chapterId-1]:"";
    const pkLabel=pkId?PACKETS.find(p=>p.id===pkId)?.label:"Tout";
    const label=`Personnel · ${grp?.label} · Cours ${num}${chName?" · "+chName:""}${pkLabel?" · "+pkLabel:""}`;
    setStudyCtx({label,queue});
    setView("study");
  },[userCards,prog,settings]);
  const allCards=useMemo(()=>[
    ...cards,
    ...userCards.filter(c=>c.integrated)
  ],[cards,userCards]);
  const getNewShownToday=useCallback(()=>{
    if(!currentUser||currentUser.role==="admin")return 0;
    return getStats(currentUser.username).days[dateKey()]?.newShown||0;
  },[currentUser]);
  const enrichCards=useCallback(async(queue)=>{
    const textIds=queue.filter(c=>c.card_type!=='occlusion'&&!c.front).map(c=>c.id);
    const textContent=textIds.length>0?await supa.getCardsContent(textIds):{};
    const firstOcc=queue.find(c=>c.card_type==='occlusion'&&!c.front);
    const firstOccContent=firstOcc?await supa.getCardsContent([firstOcc.id]):{};
    const allContent={...textContent,...firstOccContent};
    return queue.map(c=>c.front?c:{...c,...(allContent[c.id]||{front:null,back:null})});
  },[]);
  const startStudy=useCallback(async(gid,num,chapterId,pkId)=>{
    if(gid==="__user__"){
      const queue=buildQueue(userCards,prog,settings,getNewShownToday(),true);
      if(!queue.length){alert(getEmptyQueueMsg(userCards,prog,settings,getNewShownToday()));return;}
      setStudyCtx({label:"Mes flashcards personnelles",queue});setView("study");return;
    }
    const grp=GROUPS.find(g=>g.id===gid);
    if(pkId==="__all__"||pkId==="__course__"){
      const isCourse=pkId==="__course__";
      const filtered=allCards.filter(c=>c.groupId===gid&&c.num===num&&(isCourse||c.chapterId===chapterId));
      const queue=buildQueue(filtered,prog,settings,getNewShownToday(),true);
      if(!queue.length){alert(getEmptyQueueMsg(filtered,prog,settings,getNewShownToday()));return;}
      const fullQueue=await enrichCards(queue);
      const chName=!isCourse&&chapterId?getChapters(gid,num)[chapterId-1]:`Ch.${chapterId}`;
      const label=isCourse?`${grp?.label} · Cours ${num} · Cours complet`:`${grp?.label} · Cours ${num} · ${chName} · Tout`;
      setStudyCtx({label,queue:fullQueue});setView("study");return;
    }
    const scopeFiltered=allCards.filter(c=>c.groupId===gid&&c.num===num&&c.chapterId===chapterId&&effPkt(c,prog)===pkId);
    const queue=buildQueue(scopeFiltered,prog,settings,getNewShownToday(),true);
    if(!queue.length){alert(getEmptyQueueMsg(scopeFiltered,prog,settings,getNewShownToday()));return;}
    const fullQueue=await enrichCards(queue);
    const chName=getChapters(gid,num)[chapterId-1]||`Ch. ${chapterId}`;
    setStudyCtx({label:`${grp?.label} · Cours ${num} · ${chName} · ${PACKETS.find(p=>p.id===pkId)?.label}`,queue:fullQueue});
    setView("study");
  },[allCards,userCards,prog,settings,getNewShownToday,enrichCards]);
  const startGlobalStudy=useCallback(async pkId=>{
    const ids=currentUser?.plan?.groups||[];
    const globalFiltered=allCards.filter(c=>ids.includes(c.groupId)&&(!pkId||effPkt(c,prog)===pkId));
    const queue=buildQueue(globalFiltered,prog,settings,getNewShownToday(),false);
    if(!queue.length){alert(getEmptyQueueMsg(globalFiltered,prog,settings,getNewShownToday()));return;}
    const fullQueue=await enrichCards(queue);
    setStudyCtx({label:pkId?`Révision globale · ${PACKETS.find(p=>p.id===pkId)?.label}`:"Révision globale · Toutes",queue:fullQueue});
    setView("study");
  },[allCards,prog,currentUser,settings,getNewShownToday,enrichCards]);
  const handleRate=useCallback(async(card,rating,elapsedMs=0)=>{
    const existing=prog[card.id]||{};
    const wasNew=isNew(existing);
    const np=computeNext(existing,rating,settings);
    const preserved={};
    if(existing.packetOverride)preserved.packetOverride=existing.packetOverride;
    if(existing.buried)preserved.buried=existing.buried;
    saveProg({...prog,[card.id]:{...np,...preserved}},card.id);
    if(currentUser&&currentUser.role!=="admin"){
      recordStat(currentUser.username,rating>=3,elapsedMs,wasNew);
    }
    return np;
  },[prog,saveProg,settings,currentUser]);
  const handleBury=useCallback((card)=>{
    const existing=prog[card.id]||{};
    saveProg({...prog,[card.id]:{...existing,buried:true}},card.id);
  },[prog,saveProg]);
  const handleUnbury=useCallback((cardId)=>{
    const existing=prog[cardId]||{};
    const {buried:_,...rest}=existing;
    saveProg({...prog,[cardId]:rest},cardId);
  },[prog,saveProg]);
  const handleChangePacket=useCallback((card,newPktId)=>{
    const existing=prog[card.id]||{};
    if(newPktId===card.packetId){
      const {packetOverride:_,...rest}=existing;
      saveProg({...prog,[card.id]:rest},card.id);
    } else {
      saveProg({...prog,[card.id]:{...existing,packetOverride:newPktId}},card.id);
    }
  },[prog,saveProg]);
  if(view==="loading") return <div style={{fontFamily:font,background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
    <p style={{fontFamily:serif,fontSize:28,letterSpacing:-0.5}}>MyFlashcard</p>
    <p style={{color:C.textLt,fontSize:13}}>Connexion à Supabase…</p>
    {supaError&&<div style={{marginTop:12,maxWidth:400,background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:10,padding:"16px 20px",textAlign:"center"}}>
      <p style={{fontSize:14,fontWeight:600,color:"#dc2626",margin:"0 0 8px"}}>⚠️ Supabase ne répond pas</p>
      <p style={{fontSize:12,color:"#7f1d1d",margin:"0 0 12px",lineHeight:1.6}}>Erreur : <code>{supaError}</code><br/>Ton projet Supabase est peut-être <strong>en pause</strong> (plan gratuit).</p>
      <a href="https://supabase.com/dashboard" target="_blank" style={{fontFamily:font,fontSize:12,fontWeight:600,padding:"8px 16px",borderRadius:6,background:"#dc2626",color:"#fff",textDecoration:"none",display:"inline-block"}}>→ Ouvrir Supabase Dashboard</a>
      <p style={{fontSize:11,color:"#7f1d1d",margin:"10px 0 0"}}>Cherche "Restore project" ou "Unpause" sur ton projet.</p>
    </div>}
  </div>;
  if(view==="landing")   return <Landing onBack={()=>setView("login")} onRegister={()=>setView("register")}/>;
  if(view==="login")     return <LoginView onLogin={handleLogin} onShowLanding={()=>setView("landing")} onRegister={()=>setView("register")} accounts={accounts} onPasswordReset={(em,pwd)=>setAccounts(p=>p.map(a=>a.username===em?{...a,password:pwd}:a))}/>;
  if(view==="register")  return <RegisterView onRegister={acc=>{handleRegister(acc);setView("dashboard");}} onBack={()=>setView("login")} accounts={accounts}/>;
  if(userCardEditor!==null&&currentUser?.role!=="admin")return <CardEditor key={userCardKey} card={userCardEditor||null} onSave={handleSaveUserCard} onCancel={()=>setUserCardEditor(null)} userGroups={currentUser?.plan?.groups||[]}/>;
  if(view==="dashboard"&&currentUser) return <Dashboard currentUser={currentUser} cards={cards} userCards={userCards} progress={prog} settings={settings} onStudy={startStudy} onGlobalStudy={startGlobalStudy} onAdmin={()=>setView("admin")} onSettings={()=>setView("settings")} onLogout={logout} onNewUserCard={()=>setUserCardEditor(false)} onEditUserCard={c=>setUserCardEditor(c)} onDeleteUserCard={handleDeleteUserCard} onToggleIntegration={handleToggleIntegration} onStudyUser={startUserCardStudy} onUnbury={handleUnbury} allCards={allCards} paymentStatus={paymentStatus} onClosePaymentBanner={()=>setPaymentStatus(null)}/>;
  if(view==="study"&&studyCtx) return <StudyView label={studyCtx.label} queue={studyCtx.queue} onRate={handleRate} onBury={handleBury} onChangePacket={handleChangePacket} onBack={()=>setView("dashboard")} settings={settings} isAdmin={currentUser?.role==="admin"} progress={prog}/>;
  if(view==="admin")     return <AdminView cards={cards} accounts={accounts} onSaveCard={handleSaveCard} onDeleteCard={handleDeleteCard} onSaveUser={handleSaveUser} onDeleteUser={handleDeleteUser} onSortCards={handleBatchSortCards} onBack={()=>setView("dashboard")}/>;
  if(view==="settings")  return <SettingsView settings={settings} onSave={saveSet} onBack={()=>setView("dashboard")}/>;
  return null;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
